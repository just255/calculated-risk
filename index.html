      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .multiselect-toggle:hover {
      background: rgba(60, 65, 75, 0.9);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .multiselect-toggle.active {
      background: rgba(74, 158, 255, 0.3);
      border-color: #4a9eff;
      color: #4a9eff;
    }

    /* Checkmark for multi-selected units */
    .su-check {
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 0.6rem;
      color: #4a9eff;
      text-shadow: 0 0 4px rgba(74, 158, 255, 0.8);
    }

    .squad-units {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .squad-unit-btn {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(60, 65, 75, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .squad-unit-btn:hover {
      background: rgba(80, 85, 95, 0.9);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .squad-unit-btn.active {
      background: rgba(74, 158, 255, 0.3);
      border-color: #4a9eff;
      box-shadow: 0 0 8px rgba(74, 158, 255, 0.5);
    }

    .squad-unit-btn.dead {
      opacity: 0.35;
      filter: grayscale(0.9);
    }

    .su-icon {
      font-size: 1.1rem;
    }

    .su-hp-bar {
      position: absolute;
      bottom: 2px;
      left: 4px;
      right: 4px;
      height: 3px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 2px;
    }

    .su-hp-fill {
      height: 100%;
      background: linear-gradient(to right, #4caf50, #8bc34a);
      border-radius: 2px;
      transition: width 0.2s ease;
    }

    .radio-toggle-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 200, 50, 0.2);
      border: 2px solid rgba(255, 200, 50, 0.5);
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.15s ease;
    }

    .radio-toggle-btn:hover {
      background: rgba(255, 200, 50, 0.35);
    }

    .radio-toggle-btn.active {
      background: rgba(255, 200, 50, 0.4);
      border-color: var(--accent-yellow);
      box-shadow: 0 0 10px rgba(255, 200, 50, 0.5);
    }

    /* ═══════════════════════════════════════════════════════════════
       VINTAGE MILITARY RADIO - WWII-era field radio style
       ═══════════════════════════════════════════════════════════════ */
    .radio-popup {
      position: absolute;
      right: 60px;
      top: 50%;
      transform: translateY(-50%) translateX(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 99;
      transition: all 0.2s ease;
    }

    .radio-popup.open {
      transform: translateY(-50%) translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* Vintage Radio Body - olive drab metal casing */
    .vintage-radio .radio-body {
      background: linear-gradient(145deg, #4a5540 0%, #3a4530 50%, #2a3520 100%);
      border: 3px solid #2a3020;
      border-radius: 8px;
      padding: 10px;
      min-width: 150px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 4px 12px rgba(0,0,0,0.5),
        0 0 0 1px #1a2010;
    }

    /* Speaker Grille - horizontal lines */
    .radio-speaker-grille {
      background: linear-gradient(
        transparent 0px,
        #2a3020 1px,
        transparent 2px,
        transparent 4px
      );
      background-size: 100% 5px;
      background-color: #1a2010;
      height: 20px;
      border-radius: 4px;
      margin-bottom: 8px;
      border: 1px solid #1a2010;
    }

    /* Digital-style Display */
    .radio-display {
      background: #1a2015;
      border: 2px inset #0a1005;
      border-radius: 4px;
      padding: 5px 10px;
      margin-bottom: 8px;
      text-align: center;
    }

    .radio-freq {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: #7cb87c;
      text-shadow: 0 0 5px #7cb87c;
      letter-spacing: 2px;
      animation: radio-flicker 3s ease-in-out infinite;
    }

    @keyframes radio-flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
      52% { opacity: 0.95; }
    }

    /* Decorative Knobs */
    .radio-knobs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 10px;
    }

    .radio-knob {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #6a7560, #3a4530, #2a3520);
      border-radius: 50%;
      border: 2px solid #1a2010;
      box-shadow:
        inset 0 -2px 4px rgba(0,0,0,0.5),
        0 2px 4px rgba(0,0,0,0.3);
    }

    .radio-knob::after {
      content: '';
      display: block;
      width: 2px;
      height: 6px;
      background: #1a2010;
      margin: 4px auto 0;
      border-radius: 1px;
    }

    /* Command Buttons Grid */
    .vintage-radio .radio-popup-orders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .vintage-radio .rp-order-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 6px;
      background: linear-gradient(180deg, #5a6550 0%, #4a5540 50%, #3a4530 100%);
      border: 2px solid #2a3020;
      border-radius: 4px;
      color: #d0d8c0;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.15),
        0 2px 4px rgba(0,0,0,0.3);
    }

    .vintage-radio .rp-order-btn:hover {
      background: linear-gradient(180deg, #6a7560 0%, #5a6550 50%, #4a5540 100%);
      color: #fff;
    }

    .vintage-radio .rp-order-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    }

    .vintage-radio .rp-order-btn.active {
      background: linear-gradient(180deg, #8a9a70 0%, #7a8a60 50%, #6a7a50 100%);
      border-color: #9aaa80;
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 0 8px rgba(150, 180, 120, 0.4);
    }

    .vintage-radio .rp-order-btn.focus {
      background: linear-gradient(180deg, #7a4545 0%, #6a3535 50%, #5a2525 100%);
      border-color: #8a4545;
      color: #ffaaaa;
    }

    .vintage-radio .rp-order-btn.focus:hover {
      background: linear-gradient(180deg, #8a5555 0%, #7a4545 50%, #6a3535 100%);
      color: #fff;
    }

    .vintage-radio .rp-order-btn.focus.active {
      background: linear-gradient(180deg, #aa6565 0%, #9a5555 50%, #8a4545 100%);
      border-color: #cc7777;
      color: #fff;
      animation: pulse-target 1s ease-in-out infinite;
    }

    @keyframes pulse-target {
      0%, 100% { box-shadow: 0 0 5px rgba(255, 68, 68, 0.4); }
      50% { box-shadow: 0 0 15px rgba(255, 68, 68, 0.7); }
    }

    @keyframes pulse-selected {
      0%, 100% { box-shadow: 0 0 15px #4a9eff, 0 0 25px rgba(74, 158, 255, 0.5); }
      50% { box-shadow: 0 0 20px #4a9eff, 0 0 35px rgba(74, 158, 255, 0.7); }
    }

    .rpo-icon {
      font-size: 1rem;
    }

    .rpo-label {
      font-size: 0.55rem;
      font-weight: bold;
      letter-spacing: 0.3px;
      text-align: center;
      text-transform: uppercase;
    }

    /* Mobile adjustments for squad strip */
    @media (max-width: 768px) {
      .squad-strip {
        right: 5px;
      }

      .squad-units {
        padding: 4px;
      }

      .squad-unit-btn {
        width: 34px;
        height: 34px;
      }

      .su-icon {
        font-size: 0.95rem;
      }

      .radio-popup {
        right: 50px;
      }

      .vintage-radio .radio-body {
        min-width: 130px;
        padding: 8px;
      }

      .radio-speaker-grille {
        height: 16px;
        margin-bottom: 6px;
      }

      .radio-display {
        padding: 4px 8px;
        margin-bottom: 6px;
      }

      .radio-freq {
        font-size: 0.55rem;
      }

      .radio-knobs {
        margin-bottom: 8px;
      }

      .radio-knob {
        width: 14px;
        height: 14px;
      }

      .vintage-radio .rp-order-btn {
        padding: 6px 4px;
      }

      .rpo-icon {
        font-size: 0.9rem;
      }

      .rpo-label {
        font-size: 0.5rem;
      }
    }

    .campaign-controls-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 15px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: rgba(0,0,0,0.5);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .control-group kbd {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-primary);
    }

    .control-sep {
      color: rgba(255,255,255,0.3);
    }

    .commands-row {
      color: var(--accent-yellow);
    }

    .commands-row kbd {
      background: rgba(255, 200, 50, 0.2);
      border-color: rgba(255, 200, 50, 0.4);
    }

    /* Mobile Controls - Bottom 35% zones for joysticks */
    .mobile-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 35%;
      pointer-events: none;
      z-index: 90;
      display: flex;
    }

    .mobile-joystick-zone {
      position: relative;
      flex: 1;
      height: 100%;
      background: linear-gradient(to top, rgba(100,150,255,0.08) 0%, transparent 100%);
      border-top: 1px solid rgba(100,150,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .joystick-hint {
      color: rgba(100,150,255,0.6);
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .mobile-shoot-zone {
      position: relative;
      flex: 1;
      height: 100%;
      background: linear-gradient(to top, rgba(255,100,100,0.08) 0%, transparent 100%);
      border-top: 1px solid rgba(255,100,100,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .shoot-hint {
      color: rgba(255,100,100,0.6);
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .mobile-commands {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .mobile-cmd-btn {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .mobile-cmd-btn:active {
      background: rgba(74, 158, 255, 0.5);
      border-color: #4a9eff;
    }

    /* Hide desktop controls on mobile */
    @media (max-width: 768px) {
      .campaign-controls-hint {
        display: none;
      }

      .campaign-top-bar {
        padding: 5px 8px;
        gap: 6px;
        flex-wrap: wrap;
      }

      .minimap-canvas {
        width: 50px;
        height: 50px;
      }

      .campaign-minimap.expanded .minimap-canvas {
        width: 200px !important;
        height: 200px !important;
      }

      .minimap-legend {
        display: none;
      }

      .campaign-minimap.expanded .minimap-legend {
        display: flex;
      }

      /* Compact front-line buttons on mobile */
      .front-line-commands {
        padding: 3px 5px;
        gap: 4px;
      }

      .front-line-btn {
        padding: 4px 8px;
        min-width: 45px;
      }

      .front-line-btn .fl-icon {
        font-size: 14px;
      }

      .front-line-btn .fl-label {
        font-size: 7px;
      }

      .front-line-btn .fl-key {
        display: none;
      }

      .campaign-hp-bar {
        width: 100px;
        height: 18px;
      }

      .campaign-hp-text {
        font-size: 0.65rem;
      }

      .campaign-stats {
        font-size: 0.7rem;
        gap: 8px;
      }
    }

    /* Campaign Result Screen */
    .campaign-result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px;
    }

    .victory-title {
      color: var(--accent-green);
      text-shadow: 0 0 20px var(--accent-green);
    }

    .defeat-title {
      color: var(--accent-red);
      text-shadow: 0 0 20px var(--accent-red);
    }

    .result-stats {
      text-align: center;
      line-height: 2;
    }

    /* Landscape orientation warning */
    #rotate-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a2e;
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    .rotate-content {
      text-align: center;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
    }

    .rotate-icon {
      font-size: 80px;
      animation: rotate-hint 2s ease-in-out infinite;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    .rotate-content h2 {
      margin: 20px 0 10px;
      color: #4a9eff;
    }

    .rotate-content p {
      color: #888;
    }

    #dismiss-rotate {
      margin-top: 20px;
      padding: 12px 24px;
      background: transparent;
      border: 2px solid #4a9eff;
      color: #4a9eff;
      font-family: 'Oxanium', sans-serif;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    #dismiss-rotate:hover {
      background: rgba(74, 158, 255, 0.2);
    }

    /* Show warning only on mobile in portrait */
    @media (max-width: 900px) and (orientation: portrait) {
      #rotate-warning {
        display: flex;
      }
      #app {
        display: none;
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       LANDSCAPE RESPONSIVE - Short viewport heights
       ═══════════════════════════════════════════════════════════════ */
    @media (max-height: 500px) and (orientation: landscape) {
      /* Make all screens scrollable */
      .screen {
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      /* Menu Screen - Horizontal layout */
      .menu-screen {
        padding: 10px 20px;
        justify-content: flex-start;
        min-height: 100%;
      }

      .menu-content {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 15px;
        width: 100%;
        padding: 10px 0;
      }

      .menu-header {
        width: auto;
        flex: 0 0 auto;
        text-align: left;
        padding-right: 30px;
      }

      .game-title {
        font-size: 1.4rem;
        margin-bottom: 2px;
      }

      .game-title span {
        font-size: 1.6rem;
      }

      .game-subtitle {
        font-size: 0.7rem;
      }

      .menu-buttons {
        flex-direction: row;
        flex-wrap: wrap;
        max-width: none;
        gap: 8px;
        justify-content: center;
      }

      .menu-btn {
        width: auto;
        min-width: 120px;
        padding: 10px 16px;
        font-size: 0.85rem;
      }

      .menu-resources {
        margin-top: 5px;
      }

      .menu-version {
        bottom: 5px;
        right: 10px;
      }

      /* Campaign/Selection Screens - Scrollable horizontal */
      .campaign-screen {
        padding: 10px 15px;
        justify-content: flex-start;
        min-height: 100%;
      }

      .campaign-content {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 15px;
        width: 100%;
        padding: 40px 0 10px;
      }

      .campaign-screen h2 {
        font-size: 1.2rem;
        width: 100%;
        text-align: center;
        margin-bottom: 0;
      }

      .campaign-screen .subtitle {
        width: 100%;
        text-align: center;
        margin-bottom: 5px;
        font-size: 0.8rem;
      }

      .back-btn-subtle {
        top: 8px;
        left: 8px;
        padding: 4px 10px;
        font-size: 0.75rem;
      }

      /* Era/MOS Grid - More compact */
      .era-grid, .mos-grid {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 8px;
        max-width: none;
      }

      .era-btn, .mos-btn {
        padding: 8px 12px;
        min-width: 90px;
      }

      .era-name, .mos-name {
        font-size: 0.8rem;
      }

      .era-period, .mos-style {
        font-size: 0.65rem;
      }

      /* Vehicle Selection - Compact horizontal layout */
      .vehicle-preview-container {
        margin: 5px 0;
      }

      #vehicle-preview {
        width: 120px;
        height: 120px;
      }

      .vehicle-current {
        margin-top: 4px;
        font-size: 0.85rem;
      }

      .vehicle-grid {
        margin: 8px 0;
        gap: 6px;
      }

      .vehicle-btn {
        padding: 6px;
        min-width: 70px;
      }

      .vehicle-thumb {
        width: 40px;
        height: 40px;
        margin-bottom: 4px;
      }

      .vehicle-name {
        font-size: 0.7rem;
      }

      .variant-pills {
        margin: 5px 0;
        gap: 5px;
      }

      .variant-pill {
        padding: 4px 12px;
        font-size: 0.7rem;
      }

      .vehicle-stats {
        padding: 8px;
        margin: 8px auto;
        max-width: 250px;
      }

      .stat-row {
        margin: 3px 0;
      }

      .stat-label {
        width: 55px;
        font-size: 0.65rem;
      }

      .stat-bar {
        height: 6px;
      }

      .stat-value {
        font-size: 0.65rem;
      }

      .battle-type-select {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 10px;
        gap: 8px;
      }

      .battle-type-select .menu-btn {
        flex: 0 0 auto;
        min-width: 140px;
      }

      /* Settings Screen - Compact */
      .settings-screen {
        padding: 10px 15px;
      }

      .settings-screen h1 {
        font-size: 1.3rem;
        margin: 5px 0;
      }

      .settings-section h2 {
        font-size: 1rem;
        margin: 8px 0 5px;
      }

      .settings-group {
        padding: 8px;
        margin-bottom: 8px;
      }

      .setting-row {
        padding: 6px 0;
      }

      /* Stats Screen - Compact */
      .stats-screen {
        padding: 10px 15px;
      }

      .stats-screen h1 {
        font-size: 1.3rem;
        margin: 5px 0;
      }

        margin-bottom: 8px;

        padding: 10px;
      }

        font-size: 1.3rem;
      }

      .hq-tabs {
        gap: 5px;
        margin: 8px 0;

        padding: 6px 8px;
        font-size: 0.62rem;

    /* Even shorter viewports - ultra compact */
    @media (max-height: 400px) and (orientation: landscape) {
      .menu-content {
        gap: 10px;
      }

      .menu-header {
        padding-right: 20px;
      }

      .game-title {
        font-size: 1.2rem;
      }

      .game-title span {
        font-size: 1.4rem;
      }

      .menu-btn {
        padding: 8px 12px;
        font-size: 0.75rem;
        min-width: 100px;
      }

      .campaign-content {
        gap: 10px;
        padding-top: 35px;
      }

      #vehicle-preview {
        width: 100px;
        height: 100px;
      }

      .vehicle-btn {
        padding: 4px;
        min-width: 60px;
      }

      .vehicle-thumb {
        width: 30px;
        height: 30px;
      }

      .vehicle-name {
        font-size: 0.6rem;
      }

      .vehicle-stats {
        display: none; /* Hide stats on very short screens */
      }
    }

    /* ===== ENDLESS MODE THEMES ===== */

    /* Theme: Motor Pool (Industrial garage) */
    .theme-motor-pool {
      --theme-bg: linear-gradient(180deg, #1a1f2e 0%, #0f1219 100%);
      --theme-header-bg: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
      --theme-panel-bg: linear-gradient(180deg, #1f2937 0%, #111827 100%);
      --theme-accent: #f59e0b;
      --theme-accent-dark: #d97706;
      --theme-stripe: repeating-linear-gradient(45deg, #f59e0b, #f59e0b 10px, #1a1a1a 10px, #1a1a1a 20px);
      --theme-border: #374151;
      --theme-text-header: #f59e0b;
    }

    .theme-motor-pool .loadout-header {
      background: var(--theme-header-bg);
      border-bottom: 4px solid transparent;
      border-image: var(--theme-stripe) 1;
    }

    .theme-motor-pool .loadout-header h2 {
      color: var(--theme-accent);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .theme-motor-pool .loadout-header::before {
      content: '⚙';
      margin-right: 8px;
      font-size: 1.2rem;
    }

    .theme-motor-pool .lift-bay {
      background: var(--theme-panel-bg);
      border: 3px solid var(--theme-border);
      box-shadow: inset 0 -8px 16px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
      position: relative;
    }

    .theme-motor-pool .lift-bay::after {
      content: 'LIFT BAY 01';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      color: var(--text-secondary);
      letter-spacing: 2px;
    }

    .theme-motor-pool .section-label {
      font-family: 'Oxanium', sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #9ca3af;
      font-size: 0.7rem;
      border-bottom: 2px solid var(--theme-border);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .theme-motor-pool .section-label::before {
      content: '▸ ';
      color: var(--theme-accent);
    }

    .theme-motor-pool .equipment-rack {
      background:
        linear-gradient(90deg, transparent 48%, #2d3748 48%, #2d3748 52%, transparent 52%),
        linear-gradient(transparent 48%, #2d3748 48%, #2d3748 52%, transparent 52%),
        var(--theme-panel-bg);
      background-size: 24px 24px, 24px 24px, 100% 100%;
      border: 2px solid var(--theme-border);
      border-radius: 4px;
    }

    .theme-motor-pool .deploy-btn {
      background: linear-gradient(135deg, var(--theme-accent) 0%, var(--theme-accent-dark) 100%);
      color: #000;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .theme-motor-pool .deploy-btn::before {
      content: '▶ ';
    }

    .theme-motor-pool .caution-stripe {
      height: 4px;
      background: var(--theme-stripe);
    }

    .theme-motor-pool .panel {
      background: var(--theme-panel-bg);
      border: 2px solid var(--theme-border);
      border-radius: 4px;
    }

    .theme-motor-pool .panel-header {
      background: var(--theme-header-bg);
      padding: 8px 12px;
      border-bottom: 2px solid var(--theme-border);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--theme-accent);
    }

    .theme-motor-pool .stat-bar {
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
    }

    .theme-motor-pool .stat-bar-fill {
      height: 100%;
      background: var(--theme-accent);
      border-radius: 3px;
    }

    /* ===== ENDLESS MODE STYLES ===== */

    /* Loadout Screen - 2 Column Split Layout */
    .endless-loadout-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--theme-bg, var(--bg-dark));
      overflow: hidden;
    }

    .loadout-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-medium);
      border-bottom: 1px solid var(--bg-light);
      flex-shrink: 0;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .loadout-header h2 {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 2px;
      margin: 0;
      flex: 1;
    }

    .header-unit-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .header-unit-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 1px;
    }

    .header-variant-select {
      background: var(--bg-dark);
      border: 1px solid var(--bg-lighter);
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-family: inherit;
      cursor: pointer;
    }

    .header-variant-select:hover {
      border-color: var(--accent-blue);
    }

    /* Header right section (resources, options, deploy) */
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .header-label {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin-left: 4px;
    }

    .header-option-check,
    .header-option-radio {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      background: var(--bg-dark);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.6rem;
      color: var(--text-secondary);
      transition: all 0.15s;
      white-space: nowrap;
    }

    .header-option-check:hover,
    .header-option-radio:hover {
      background: var(--bg-light);
    }

    .header-option-check .check-icon {
      width: 10px;
      height: 10px;
      border: 1px solid var(--text-secondary);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.45rem;
      color: transparent;
    }

    .header-option-check.checked .check-icon {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: var(--bg-dark);
    }

    .header-option-check.checked {
      color: var(--text-primary);
    }

    .header-option-check.disabled,
    .header-deploy-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .header-option-radio .radio-dot {
      width: 8px;
      height: 8px;
      border: 1px solid var(--text-secondary);
      border-radius: 50%;
    }

    .header-option-radio.selected .radio-dot {
      border-color: var(--accent-blue);
      background: var(--accent-blue);
    }

    .header-option-radio.selected {
      color: var(--text-primary);
    }

    .header-option-divider {
      width: 1px;
      height: 16px;
      background: var(--bg-lighter);
      margin: 0 2px;
    }

    .header-mode-select {
      background: var(--bg-dark);
      border: 1px solid var(--bg-lighter);
      color: var(--text-secondary);
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 0.6rem;
      font-family: inherit;
      cursor: pointer;
    }

    .header-mode-select:hover {
      border-color: var(--accent-blue);
    }

    .header-deploy-btn {
      padding: 4px 10px;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      margin-left: 4px;
    }

    .header-deploy-btn:hover {
      filter: brightness(1.1);
    }

    .loadout-header .resource-display {
      display: flex;
      gap: 8px;
      font-size: 0.65rem;
      font-weight: 600;
      padding-right: 6px;
      border-right: 1px solid var(--bg-lighter);
      margin-right: 2px;
    }

    .res-scrap { color: var(--accent-yellow); }
    .res-parts { color: var(--accent-blue); }

    .back-btn {
      background: transparent;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn:active {
      background: var(--bg-light);
    }

    /* Main content area */
    .loadout-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 12px;
      gap: 12px;
    }

    /* Section labels */
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    /* Asset Selection - 2 column split */
    .asset-selection {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr; /* Narrow list, rest for preview */
      gap: 12px;
      flex: 1;
      min-height: 0; /* Allow shrinking */
      overflow: hidden; /* Contain inner scrolling to prevent parent overflow */
    }

    .asset-selection > * {
      min-height: 0; /* Allow grid children to shrink */
    }

    /* Left side - Vehicle Grid */
    .asset-grid-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
      flex: 1;
    }

    /* Category Tabs */
    .category-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .category-tab {
      padding: 6px 10px;
      font-size: 0.65rem;
      font-weight: 600;
      background: var(--bg-medium);
      border: none;
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .category-tab.active {
      background: var(--bg-light);
      color: var(--text-primary);
    }

    /* Vehicle Grid */
    .vehicle-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow-y: auto;
      padding: 8px;
      background: var(--bg-medium);
      border-radius: 8px;
      flex: 1;
      align-content: start;
    }

    .vehicle-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--bg-dark);
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      padding: 8px 4px;
      position: relative;
    }

    .vehicle-tile:hover {
      background: var(--bg-light);
    }

    .vehicle-tile.selected {
      border-color: var(--accent-green);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), var(--bg-dark));
    }

    .vehicle-tile.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .vehicle-tile-icon {
      font-size: 1.8rem;
      line-height: 1;
    }

    .vehicle-tile-name {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: center;
    }

    /* Mini stat bar on tiles */
    .vehicle-tile-stat {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .mini-stat-bar {
      flex: 1;
      height: 4px;
      background: var(--bg-light);
      border-radius: 2px;
      overflow: hidden;
    }

    .mini-stat-bar-fill {
      height: 100%;
      background: var(--accent-red);
      border-radius: 2px;
    }

    .mini-stat-value {
      font-size: 0.5rem;
      font-weight: 700;
      color: var(--text-secondary);
      min-width: 16px;
      text-align: right;
    }

    /* Layout Toggle */
    .layout-toggle {
      margin-left: auto;
      padding: 4px 8px;
      font-size: 0.65rem;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
    }

    .layout-toggle:hover {
      background: var(--bg-light);
      color: var(--text-primary);
    }

    /* List View Styles */
    .vehicle-grid.list-view {
      display: flex !important;
      flex-direction: column !important;
      gap: 2px !important;
      flex-wrap: nowrap !important;
    }

    .vehicle-grid.list-view .vehicle-tile {
      flex-direction: row !important;
      padding: 8px 12px !important;
      gap: 10px !important;
      justify-content: flex-start !important;
      align-items: center !important;
      border-radius: 4px;
      width: 100%;
    }

    .vehicle-grid.list-view .vehicle-tile-icon {
      font-size: 1.1rem !important;
      flex-shrink: 0;
      width: 24px;
      text-align: center;
    }

    .vehicle-grid.list-view .vehicle-tile-name {
      font-size: 0.75rem !important;
      flex: 1;
      text-align: left !important;
      font-weight: 500;
    }

    .vehicle-grid.list-view .vehicle-tile-stat {
      display: none !important; /* Hide stat bars in list view */
    }

    /* Right side - Selected Unit Details */
    .unit-details {
      display: flex;
      flex-direction: column;
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .unit-details-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      height: 100%;
    }

    /* Horizontal Card Layout - Preview Left, Info Right */
    .unit-card-horizontal {
      display: flex;
      gap: 16px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }

    /* Large Tank Preview - Square, fills available height */
    .unit-preview-large {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      border-radius: 8px;
      flex: 1;
      min-width: 180px;
      max-width: 50%;
      position: relative;
      overflow: hidden;
    }

    .unit-preview-canvas {
      transform-origin: center center;
    }

    /* Preview Zoom Controls - Top Left */
    .preview-zoom-controls {
      position: absolute;
      top: 6px;
      left: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,0,0,0.7);
      border-radius: 4px;
      padding: 2px 4px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .preview-zoom-controls:hover {
      opacity: 1;
    }

    .zoom-level {
      font-size: 0.6rem;
      color: var(--text-secondary);
      min-width: 20px;
      text-align: center;
    }

    /* Preview Pan Controls - Top Right */
    .preview-pan-controls {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .preview-pan-controls:hover {
      opacity: 1;
    }

    .pan-btn-row {
      display: flex;
      gap: 2px;
    }

    .ctrl-btn {
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 3px;
      background: rgba(0,0,0,0.7);
      color: var(--text-secondary);
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .ctrl-btn:hover {
      background: var(--bg-light);
      color: var(--text-primary);
    }

    .unit-preview-fallback {
      font-size: 4rem;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
      display: none;
    }

    .unit-preview-canvas[style*="display: none"] + .unit-preview-fallback {
      display: block;
    }

    /* Icon-only mode when no sprite variants exist */
    .unit-preview-large.icon-only {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .unit-preview-large.icon-only .unit-preview-fallback {
      display: flex;
      font-size: 6rem;
      opacity: 0.8;
    }

    .no-variants-label {
      font-size: 0.6rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Info Stack - Right side */
    .unit-info-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .unit-header {
      flex-shrink: 0;
    }

    .unit-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }

    .unit-variant-label {
      font-size: 0.65rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Stats Display */
    .stats-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-dark);
      border-radius: 6px;
      padding: 8px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-primary);
      letter-spacing: 0.05em;
      width: 32px;
    }

    .stat-bar {
      flex: 1;
      height: 12px;
      background: rgba(0,0,0,0.4);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    /* Minor ticks every 5% — centered on each 5% boundary (straddle the line) */
    .stat-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.2) 0,
        rgba(0,0,0,0.2) 0.5px,
        transparent 0.5px,
        transparent calc(5% - 0.5px),
        rgba(0,0,0,0.2) calc(5% - 0.5px),
        rgba(0,0,0,0.2) 5%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Major ticks every 10% (3px) — centered on each 10% boundary */
    .stat-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.8) 0,
        rgba(0,0,0,0.8) 1.5px,
        transparent 1.5px,
        transparent calc(10% - 1.5px),
        rgba(0,0,0,0.8) calc(10% - 1.5px),
        rgba(0,0,0,0.8) 10%
      );
      pointer-events: none;
      z-index: 2;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .stat-bar-fill.dmg { background: linear-gradient(180deg, #ff6b6b, var(--accent-red)); }
    .stat-bar-fill.spd { background: linear-gradient(180deg, #74b9ff, var(--accent-blue)); }
    .stat-bar-fill.arm { background: linear-gradient(180deg, #7bed9f, var(--accent-green)); }
    .stat-bar-fill.dur { background: linear-gradient(180deg, #ffeaa7, var(--accent-yellow)); }

    .stat-value {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 18px;
      text-align: right;
    }

    /* Equipment Section - Hidden on desktop (Equipment Bay visible), shown on mobile */
    .unit-equipment-section {
      display: none;
    }

    @media (max-width: 800px), (max-height: 600px) {
      .unit-equipment-section {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex-shrink: 0;
      }
    }

    .unit-equipment-header {
      font-size: 0.5rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      text-align: center;
    }

    .unit-equipment-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .unit-equip-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 40px;
      height: 44px;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .unit-equip-slot:hover {
      border-color: var(--accent-green);
      background: var(--bg-light);
    }

    .unit-equip-slot.filled {
      border-color: var(--accent-blue);
      background: rgba(96, 165, 250, 0.1);
    }

    .unit-equip-icon {
      font-size: 1rem;
      line-height: 1;
    }

    .unit-equip-label {
      font-size: 0.45rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    /* Deploy Strip - horizontal bar below detail panel */
    .deploy-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-dark);
      border-radius: 6px;
      margin-top: 8px;
    }

    /* Deploy Options Row */
    .deploy-options {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
      font-size: 0.65rem;
    }

    .deploy-strip .unit-deploy-btn {
      margin-top: 0;
      white-space: nowrap;
    }

    .deploy-option-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .deploy-option-label {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 0.5px;
      margin-right: 2px;
    }

    .deploy-option-check,
    .deploy-option-radio {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: var(--bg-medium);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-secondary);
    }

    .deploy-option-check:hover,
    .deploy-option-radio:hover {
      background: var(--bg-light);
    }

    .deploy-option-check .check-icon {
      width: 12px;
      height: 12px;
      border: 1px solid var(--text-secondary);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      color: transparent;
      transition: all 0.15s;
    }

    .deploy-option-check.checked .check-icon {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: var(--bg-dark);
    }

    .deploy-option-check.checked {
      color: var(--text-primary);
    }

    .deploy-option-radio .radio-dot {
      width: 10px;
      height: 10px;
      border: 1px solid var(--text-secondary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .deploy-option-radio .radio-dot::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: transparent;
      transition: all 0.15s;
    }

    .deploy-option-radio.selected .radio-dot {
      border-color: var(--accent-blue);
    }

    .deploy-option-radio.selected .radio-dot::after {
      background: var(--accent-blue);
    }

    .deploy-option-radio.selected {
      color: var(--text-primary);
    }

    .option-cost {
      color: var(--accent-yellow);
      font-size: 0.55rem;
    }

    .deploy-option-divider {
      width: 1px;
      height: 20px;
      background: var(--bg-lighter);
    }

    /* Deploy Button */
    .unit-deploy-btn {
      margin-top: auto;
      padding: 10px 16px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .unit-deploy-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
    }

    .unit-deploy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Dropdowns */
    .unit-selects {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .select-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      width: 60px;
    }

    .unit-select {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.8rem;
      font-family: 'Oxanium', sans-serif;
      cursor: pointer;
    }

    /* Equipment Bay Section - Two Section Layout */
    .equipment-bay {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 12px;
    }

    .parts-section {
      background: var(--bg-dark);
      border-radius: 6px;
      padding: 8px 12px;
    }

    .parts-section-header {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .parts-slots {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .part-slot {
      flex: 0 0 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      background: var(--bg-medium);
      border: 2px dashed var(--bg-light);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .part-slot.filled {
      border-style: solid;
      border-color: var(--accent-green);
    }

    .part-slot.placeholder {
      opacity: 0.5;
      border-color: var(--bg-light);
    }

    .part-slot:hover:not(.placeholder) {
      border-color: var(--accent-blue);
      background: var(--bg-light);
    }

    .part-slot-icon {
      font-size: 1.2rem;
      line-height: 1;
    }

    .part-slot-name {
      font-size: 0.5rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.05em;
    }

    .part-slot-status {
      font-size: 0.45rem;
      color: var(--text-secondary);
    }

    .part-slot-status.filled {
      color: var(--accent-green);
    }

    .part-slot-status.empty {
      color: var(--text-secondary);
    }

    .parts-empty-message {
      font-size: 0.6rem;
      color: var(--text-secondary);
      font-style: italic;
      padding: 8px;
    }

    /* Risk Assessment Section */
    .risk-assessment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .risk-panel {
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 12px;
    }

    .risk-panel-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .insurance-total {
      color: var(--accent-yellow);
    }

    /* Checkbox items */
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
    }

    .checkbox-box {
      width: 18px;
      height: 18px;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: transparent;
      transition: all 0.15s;
    }

    .checkbox-item.checked .checkbox-box {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: white;
    }

    .checkbox-label {
      flex: 1;
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    .checkbox-cost {
      font-size: 0.7rem;
      color: var(--accent-yellow);
    }

    .insurance-note {
      font-size: 0.6rem;
      color: var(--text-secondary);
      margin-top: 8px;
      font-style: italic;
    }

    /* Radio items */
    .radio-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
    }

    .radio-circle {
      width: 18px;
      height: 18px;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      background: transparent;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .radio-item.selected .radio-circle {
      border-color: var(--accent-green);
    }

    .radio-item.selected .radio-circle::after {
      background: var(--accent-green);
    }

    .radio-label {
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    /* Footer */
    .loadout-footer {
      padding: 12px 16px;
      background: var(--bg-medium);
      border-top: 2px solid var(--bg-light);
      display: flex;
      justify-content: flex-end;
    }

    .deploy-btn {
      padding: 14px 32px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .deploy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
    }

    .deploy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Mobile portrait: Stack vertically */
    @media (max-width: 700px) {
      .asset-selection {
        grid-template-columns: 1fr;
      }

      .vehicle-grid {
        max-height: 200px;
      }

      .risk-assessment {
        grid-template-columns: 1fr;
      }

      .deploy-btn {
        width: 100%;
      }
    }

    /* Mobile landscape: Compact 2-column layout */
    @media (max-height: 500px) and (orientation: landscape) {
      .loadout-content {
        padding: 8px;
        gap: 4px;
      }

      /* Hide secondary sections - equipment/risk are in unit card */
      .loadout-content > .section-label:not(:first-child),
      .equipment-bay,
      .risk-assessment {
        display: none;
      }

      /* Asset selection fills available space */
      .asset-selection {
        flex: 1;
      }

      .vehicle-grid {
        max-height: none;
        overflow-y: auto;
      }

      .category-tabs {
        gap: 2px;
      }

      .category-tab {
        padding: 4px 8px;
        font-size: 0.6rem;
      }

      /* Compact horizontal unit card */
      .unit-card-top {
        gap: 8px;
      }

      .unit-preview {
        padding: 4px;
      }

      .unit-preview-canvas {
        width: 70px;
        height: 70px;
      }

      .unit-name {
        font-size: 0.7rem;
      }

      .unit-variant-label {
        font-size: 0.5rem;
      }

      .stats-list {
        padding: 4px;
        gap: 2px;
      }

      .stat-bar {
        height: 4px;
      }

      .stat-label {
        font-size: 0.55rem;
        width: 26px;
      }

      .stat-value {
        font-size: 0.5rem;
        min-width: 16px;
      }

      .unit-equipment-header {
        font-size: 0.4rem;
      }

      .unit-equipment-row {
        gap: 3px;
      }

      .unit-equip-slot {
        width: 32px;
        height: 36px;
        gap: 1px;
      }

      .unit-equip-icon {
        font-size: 0.75rem;
      }

      .unit-equip-label {
        font-size: 0.35rem;
      }

      .unit-deploy-btn {
        padding: 6px 10px;
        font-size: 0.65rem;
      }
    }

    /* Endless Battle Screen */
    .endless-battle-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-dark);
      position: relative; /* containing block for .deploy-panel absolute positioning */
    }

    .endless-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg-medium);
      border-bottom: 2px solid var(--bg-light);
    }

    .hud-left, .hud-right, .hud-center {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .fps-display {
      font: bold 13px monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60vw;
    }

    .wave-display {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-orange);
    }

    .kills-display {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .endless-hp-bar {
      width: 140px;
      height: 18px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .endless-hp-fill {
      height: 100%;
      background: linear-gradient(to right, #ff4444, #ff8844);
      transition: width 0.2s;
    }

    .endless-hp-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.65rem;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      white-space: nowrap;
    }

    .score-display {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-yellow);
    }

    .endless-battlefield {
      flex: 1;
      position: relative;
      background: #1a1a2e;
    }
    /* Menu cursor — driven by --cursor-menu, written by js/cursor-apply.js from
       Game.settings.cursors.menu. The universal selector + !important wins over
       the 230+ explicit `cursor: pointer` rules baked into the legacy CSS so
       the player's chosen cursor shows everywhere, not just empty space.
       Exceptions also use !important to stay above the universal rule:
       text inputs keep the I-beam; in-battle hides the cursor for the canvas
       crosshair. See docs/systems/cursors.md. */
    :root { --cursor-menu: auto; }
    * { cursor: var(--cursor-menu) !important; }
    .endless-battlefield.hero-crosshair,
    .endless-battlefield.hero-crosshair * { cursor: none !important; }

    .endless-controls {
      position: absolute;
      top: 60px;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 10;
    }

    /* Kill feed — bottom-left overlay */
    .kill-feed {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 280px;
    }
    .kill-feed-entry {
      font: 500 0.6rem/1.3 'Share Tech Mono', monospace;
      padding: 3px 8px;
      background: rgba(0, 0, 0, 0.6);
      border-left: 2px solid;
      border-radius: 0 3px 3px 0;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: kill-feed-fade 4s ease-out forwards;
    }
    .kill-feed-entry.feed-kill { border-color: var(--accent-red); }
    .kill-feed-entry.feed-death { border-color: #888; }
    .kill-feed-entry.feed-wave { border-color: var(--accent-orange); }
    .kill-feed-entry.feed-elite { border-color: var(--accent-yellow); }
    .kill-feed-entry.feed-commander { border-color: #c44; color: #e66; font-style: italic; }
    .kill-feed-entry.feed-critical { border-color: #f44; color: #f88; font-weight: 600; text-transform: uppercase; }

    @keyframes kill-feed-fade {
      0%, 70% { opacity: 1; }
      100% { opacity: 0; }
    }

    .endless-minimap {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--accent-green);
      border-radius: 6px;
      padding: 3px;
    }

    .endless-minimap .minimap-canvas {
      display: block;
      border-radius: 4px;
      width: 160px;
      height: 160px;
    }

    /* Controls legend */
    .controls-legend {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: rgba(10, 12, 18, 0.9);
      border: 1px solid var(--bg-light);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'Oxanium', monospace;
      font-size: 0.7rem;
      color: var(--text-secondary);
      z-index: 100;
    }
    .controls-legend-title {
      color: var(--accent-green);
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .controls-legend-row {
      display: flex;
      gap: 8px;
      padding: 1px 0;
    }
    .controls-legend-row .key {
      color: var(--text-primary);
      font-weight: 600;
      min-width: 50px;
    }
    /* Radio HUD */
    .radio-hud {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 90;
      pointer-events: auto;
      transition: transform 0.6s ease, bottom 0.6s ease, right 0.6s ease;
      transform-origin: bottom right;
    }
    .radio-hud.focused {
      transform: scale(1.6);
      bottom: 60px;
      right: 60px;
      z-index: 200;
    }
    .radio-body {
      position: relative;
      width: 280px;
      height: 220px;
    }
    .radio-svg {
      width: 280px;
      height: 220px;
      display: block;
    }
    .radio-screen {
      position: absolute;
      top: 10px;
      left: 40px;
      width: 226px;
      height: 156px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 3px;
    }
    .radio-objective {
      padding: 4px 6px;
      font-family: 'Oxanium', monospace;
      font-size: 0.6rem;
      color: #c8a020;
      text-shadow: 0 0 6px #c8a02044;
      background: rgba(6, 10, 4, 0.95);
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .radio-obj-label {
      font-weight: 700;
      margin-right: 4px;
      color: #c8a020;
    }
    .radio-obj-text {
      color: #a88818;
    }
    .radio-separator {
      height: 1px;
      background: #1a2210;
      flex-shrink: 0;
    }
    .radio-comms {
      flex: 1;
      overflow: hidden;
      background: rgba(4, 8, 3, 0.96);
      cursor: pointer;
      position: relative;
      min-height: 0;
    }
    .radio-comms-scroll {
      height: 100%;
      overflow-y: auto;
      padding: 4px 6px;
      scrollbar-width: thin;
      scrollbar-color: #1a2210 transparent;
    }
    .radio-hud.expanded .radio-comms {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 360px;
      background: rgba(4, 8, 3, 0.96);
      border: 1px solid #1a2210;
      border-radius: 4px 4px 0 0;
      z-index: 5;
    }
    .radio-msg {
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #14200e22;
    }
    .radio-msg:last-child { border-bottom: none; margin-bottom: 0; }
    .radio-msg-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .radio-msg-sender {
      font-family: 'Oxanium', monospace;
      font-size: 0.55rem;
      font-weight: 700;
      color: #5aaa5a;
      text-shadow: 0 0 4px #3a883a33;
    }
    .radio-msg-time {
      font-family: 'Oxanium', monospace;
      font-size: 0.5rem;
      color: #2e5528;
    }
    .radio-msg-text {
      font-family: 'Oxanium', monospace;
      font-size: 0.6rem;
      color: #30cc30;
      text-shadow: 0 0 4px #20aa2028;
      line-height: 1.3;
      margin-top: 1px;
    }
    .radio-msg.msg-urgent .radio-msg-text { color: #c8a020; text-shadow: 0 0 4px #c8a02033; }
    .radio-msg.msg-urgent .radio-msg-sender { color: #c8a020; }
    .radio-msg.msg-critical .radio-msg-text { color: #cc4444; text-shadow: 0 0 6px #cc444444; }
    .radio-msg.msg-critical .radio-msg-sender { color: #cc4444; }

    /* Scanline overlay */
    .radio-scanlines {
      position: absolute;
      top: 10px;
      left: 40px;
      width: 226px;
      height: 156px;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
      pointer-events: none;
      border-radius: 3px;
    }

    /* LED animations */
    .radio-led-pwr { fill: #22aa22; filter: url(#led-glow); }
    .radio-led-rx { fill: #886600; }
    .radio-led-tx { fill: #226622; }
    .radio-led-tx.flashing { animation: led-flash 0.15s ease 3; }
    .radio-led-tx.flash-urgent { animation: led-flash-amber 0.15s ease 3; }
    .radio-led-tx.flash-critical { animation: led-flash-red 0.1s ease 5; }
    @keyframes led-flash { 0%,100% { fill: #226622; } 50% { fill: #44ff44; } }
    @keyframes led-flash-amber { 0%,100% { fill: #886600; } 50% { fill: #ffcc00; } }
    @keyframes led-flash-red { 0%,100% { fill: #662222; } 50% { fill: #ff4444; } }
    .radio-led-rx { animation: led-breathe 3s ease-in-out infinite; }
    @keyframes led-breathe { 0%,100% { fill: #664400; } 50% { fill: #cc8800; } }

    .controls-legend-btn {
      font-weight: 700 !important;
      font-size: 0.85rem !important;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      background: var(--bg-medium);
      border: 1px solid var(--bg-light);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Mobile battle HUD scaling */
    @media (max-width: 768px), (max-height: 500px) {
      .radio-hud { transform: scale(0.65); transform-origin: bottom right; }
      .radio-hud.focused { transform: scale(1.2); }
      .endless-minimap .minimap-canvas { width: 100px; height: 100px; }
      .endless-controls { top: 8px; right: 5px; gap: 4px; }
      .control-btn { width: 32px; height: 32px; font-size: 1rem; }
    }

    /* Mobile HQ — Operations & Barracks density */
    @media (max-width: 900px), (max-height: 500px) {
      /* Operations detail panel: cap height so it doesn't take over */
      .ops-detail-panel { max-height: 35vh; overflow-y: auto; }
      .ops-detail-panel .ops-cmp-columns { flex-direction: column; gap: 8px; }
      .ops-cmp-col { min-width: 0; }

      /* Barracks: compact soldier rows */
      .soldier-row { padding: 4px 8px; }
      .soldier-main { gap: 4px; }
      .soldier-insignia { width: 32px !important; height: 32px !important; }
      .soldier-name { font-size: 0.7rem; }
      .soldier-role-tag { font-size: 0.55rem; padding: 1px 4px; }
      .hp-seg { width: 5px; height: 8px; }

    /* Endless Between Waves Screen */
    /* Medevac Scene */
    .medevac-screen {

      justify-content: center;
      min-height: 100vh;
    }

    }
    .medevac-line {
      font-family: 'Oxanium', monospace;

      margin-bottom: 20px;

    .medevac-doc { color: #94a3b8; font-style: italic; }

    .medevac-name-input {
      display: none;
      margin: 16px 0 24px;
      gap: 10px;
    }
    .medevac-name-input.visible {
      display: flex;
      flex-wrap: wrap;
      animation: medevac-fade 0.4s ease forwards;
    }
    .medevac-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #4a5568;
      color: #e2e8f0;

      font-size: 1rem;
      padding: 6px 2px;
      outline: none;
      flex: 1;
      min-width: 120px;

      padding: 4px 12px;
      font-family: 'Oxanium', monospace;
      font-size: 0.65rem;
      background: transparent;
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s, color 0.2s;
    }
    .rush-heal-btn:hover {
      background: var(--accent-yellow);
      color: #0a0a0a;
    }
    .rush-heal-btn.disabled {
      border-color: #4a5568;
      color: #4a5568;
      cursor: not-allowed;
      pointer-events: none;
    }

    .medevac-confirm {
      padding: 8px 20px;
      font-size: 0.8rem;
      font-family: 'Oxanium', monospace;
      background: transparent;
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, color 0.2s;
    }
    .medevac-confirm:hover {
      background: var(--accent-green);
      color: #0a0a0a;
    }
    .medevac-continue {
      display: none;
      margin-top: 30px;
    }
    .medevac-continue.visible { display: block; animation: medevac-fade 0.6s ease forwards; }
    .medevac-continue .btn {
      padding: 10px 28px;
      font-family: 'Oxanium', monospace;
      font-size: 0.85rem;
      background: transparent;
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, color 0.2s;

    .medevac-continue .btn:hover {
      background: var(--accent-green);
      color: #0a0a0a;
    }
    @keyframes medevac-fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }

    /* ── Results Screen (Battle + Rank Reports) ── */
    .results-tab-bar {
      display: flex; gap: 2px; margin-bottom: 12px;
    }
    .results-tab {
      padding: 8px 20px; border: none; cursor: pointer;
      background: rgba(255,255,255,0.05); color: var(--text-secondary);

    /* PG config — mobile landscape (short viewport).
       Trigger on max-height rather than max-width so it catches modern
       phones whose landscape widths are ~932–1100px (iPhone Pro Max, Galaxy,
       iPad mini) — the 900px width breakpoint would miss them. The real
       constraint is vertical: <500px tall = phone landscape.
       Header shrinks, three-column body stays horizontal but each panel
       can scroll vertically. */
    @media (orientation: landscape) and (max-height: 500px) {
      .fr-config-screen { padding: 6px; }
      .fr-header { margin-bottom: 6px; }
      .fr-header h1 { font-size: 1.1rem; letter-spacing: 2px; }
      .fr-subtitle { font-size: 0.65rem; letter-spacing: 1.5px; }
      .fr-body { gap: 6px; }
      .fr-team-panel { padding: 6px; gap: 4px; overflow-y: auto; }
      .fr-team-title { font-size: 0.7rem; letter-spacing: 1.5px; }
      .fr-center-col { gap: 8px; min-width: 100px; }
      .fr-size-btn { padding: 4px 6px; font-size: 0.65rem; }
      .fr-deploy-btn { font-size: 0.85rem; padding: 8px 18px; }
    }
    @media (max-width: 700px) and (orientation: portrait) {
      .fr-body { flex-direction: column; gap: 8px; }
      .fr-team-panel, .fr-center-col { width: 100%; }
      .fr-config-screen { padding: 8px; }
      .fr-header h1 { font-size: 1.2rem; }
    }
    .fr-map-size {
      text-align: center;
    }
    .fr-label {
      display: block;
      font-size: 0.7rem;
      color: var(--text-secondary, #888);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .fr-size-btns {
      display: flex;
      gap: 4px;
    }
    .fr-size-btn {
      padding: 6px 10px;
      border: 1px solid var(--border-color, #333);
      background: var(--bg-medium, #1a1a2e);
      color: var(--text-primary, #eee);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      text-transform: capitalize;
    }
    .fr-size-btn.active {
      background: var(--accent-blue, #4a9eff);
      border-color: var(--accent-blue, #4a9eff);
      color: #fff;
    }
    .fr-deploy-btn { font-size: 1rem; padding: 12px 32px; }

    .fr-team-count {

    }

    .fr-team-count.red { color: #ff4444; }
    .fr-sgt-phase {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }
    .fr-sgt-phase.blue { color: #4a9eff; }

    .fr-status {

    .cmdr-sq-phase { font-size: 10px; text-transform: uppercase; opacity: 0.7; }

    .cmdr-orders {

    .cmdr-ord-pending { border-color: var(--accent-yellow, #fbbf24); color: var(--accent-yellow, #fbbf24); animation: cmdr-pulse 1s infinite; }

    }

      padding: 2px 6px;
      font-size: 0.6rem;
