<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculated Risk</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4a9eff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalcRisk">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oxanium:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #1a1f2e;
      --bg-medium: #252b3d;
      --bg-light: #2f3749;
      --bg-lighter: #3d4559;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-yellow: #fbbf24;
      --accent-blue: #60a5fa;
      --accent-orange: #fb923c;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
    }

    /* Global themed scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-lighter);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-blue);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Oxanium', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      touch-action: manipulation;
    }

    button, .lane-slot, .lane, .unit-option, .toggle {
      touch-action: manipulation;
      cursor: pointer;
    }

    #app {
      height: 100%;
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* ===== SCREENS ===== */
    .screen {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Menu Screen - Landscape optimized */
    .menu-screen {
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(180deg, #0f1319 0%, #1a1f2e 50%, #252b3d 100%);
      position: relative;
    }

    .menu-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .menu-resources {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      gap: 12px;
    }

    .res-scrap { color: var(--accent-yellow); }
    .res-parts { color: var(--accent-blue); }

    .menu-header {
      text-align: center;
      width: 100%;
      flex-shrink: 0;
    }

    .game-title {
      font-family: 'Black Ops One', cursive;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 5px;
    }

    .game-title span {
      display: inline;
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-subtitle {
      font-family: 'Share Tech Mono', monospace;
      color: var(--text-secondary);
      margin-bottom: 0;
      font-size: 0.85rem;
      letter-spacing: 2px;
    }

    .menu-version {
      position: absolute;
      bottom: 12px;
      right: 15px;
      font-family: 'Share Tech Mono', monospace;
      color: var(--text-secondary);
      font-size: 0.7rem;
      opacity: 0.5;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 300px;
      width: 100%;
    }

    .menu-btn {
      width: 100%;
      padding: 14px 24px;
      font-family: 'Oxanium', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid var(--accent-green);
      background: transparent;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .menu-btn:active, .menu-btn:hover {
      background: var(--accent-green);
      color: var(--bg-dark);
    }

    .menu-btn.secondary {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
    }

    .menu-btn.secondary:active, .menu-btn.secondary:hover {
      background: var(--text-secondary);
      color: var(--bg-dark);
    }

    .menu-btn:disabled {
      opacity: 0.5;
    }

    /* ===== GAME SCREEN ===== */
    .game-screen {
      background: var(--bg-dark);
    }

    /* HUD */
    .game-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      background: var(--bg-medium);
      border-bottom: 2px solid var(--bg-light);
      flex-shrink: 0;
    }

    .hud-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .health-bar {
      width: 80px;
      height: 18px;
      background: var(--bg-dark);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-green));
      transition: width 0.3s;
    }

    .health-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: white;
      text-shadow: 0 0 3px black;
    }

    .resource-display {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
    }

    .resource-display.scrap { color: var(--accent-yellow); }
    .resource-display.parts { color: var(--accent-blue); }

    .score-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      color: var(--accent-green);
    }

    .wave-display {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .hud-btn {
      background: none;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      font-size: 1rem;
      padding: 5px 10px;
      font-family: 'Oxanium', sans-serif;
    }

    /* Battlefield */
    .battlefield {
      flex: 1;
      display: flex;
      position: relative;
      background: linear-gradient(180deg, #2d3a2d 0%, #3d4a3d 50%, #4a5a4a 100%);
      overflow: hidden;
    }

    .lane {
      flex: 1;
      position: relative;
      border-right: 1px dashed rgba(255,255,255,0.1);
    }

    .lane:last-child {
      border-right: none;
    }

    .lane-number {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      font-family: 'Share Tech Mono', monospace;
    }

    /* Units and Enemies */
    .unit, .enemy {
      position: absolute;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .unit svg, .enemy svg {
      width: 100%;
      height: 100%;
    }

    .unit {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .enemy {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Unit shadows - rendered behind units */
    .unit-shadow {
      position: absolute;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform-origin: center center;
    }

    .unit-shadow svg,
    .unit-shadow img.unit-sprite {
      width: 100%;
      height: 100%;
      filter: brightness(0) saturate(0);
      background: transparent !important;
    }

    /* PNG Sprite support */
    .unit-sprite {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .enemy .unit-sprite {
      filter: hue-rotate(180deg) saturate(0.8) brightness(0.9);
    }

    .health-pip {
      position: absolute;
      bottom: -8px;
      left: 5px;
      right: 5px;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }

    .health-pip-fill {
      height: 100%;
      background: var(--accent-red);
      border-radius: 2px;
    }

    .explosion {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, var(--accent-yellow), var(--accent-orange), transparent);
      border-radius: 50%;
      animation: explode 0.3s forwards;
      pointer-events: none;
    }

    @keyframes explode {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* Projectiles */
    .projectile {
      position: absolute;
      pointer-events: none;
      z-index: 15;
    }

    .muzzle-flash {
      position: absolute;
      pointer-events: none;
      z-index: 14;
    }

    .impact {
      position: absolute;
      pointer-events: none;
      z-index: 16;
    }

    .loot-drop {
      position: absolute;
      font-size: 0.8rem;
      font-weight: bold;
      animation: float-up 1s forwards;
      pointer-events: none;
      font-family: 'Share Tech Mono', monospace;
      text-shadow: 0 0 5px black;
    }

    .loot-drop.scrap { color: var(--accent-yellow); }
    .loot-drop.parts { color: var(--accent-blue); }

    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }

    /* Base */
    .base-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(0deg, var(--bg-medium), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 2px solid var(--accent-green);
    }

    .base-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-green);
      letter-spacing: 2px;
    }

    /* Lane Selector */
    .lane-selector {
      display: flex;
      padding: 10px;
      background: var(--bg-medium);
      border-top: 2px solid var(--bg-light);
      flex-shrink: 0;
    }

    .lane-slot {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 5px;
      background: var(--bg-dark);
      margin: 0 5px;
      border-radius: 6px;
      border: 2px solid transparent;
      transition: all 0.2s;
      position: relative;
    }

    .lane-slot:active, .lane-slot.selected {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.1);
    }

    .lane-slot .unit-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 5px;
    }

    .lane-slot .unit-name {
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .lane-slot .deploy-ready {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 5px var(--accent-green);
    }

    .lane-slot .cooldown-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--bg-light);
      border-radius: 0 0 4px 4px;
    }

    .lane-slot .cooldown-fill {
      height: 100%;
      background: var(--accent-blue);
      border-radius: 0 0 4px 4px;
    }

    /* Unit Selection Panel */
    .unit-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-dark);
      border-top: 3px solid var(--accent-green);
      padding: 15px;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      z-index: 100;
    }

    .unit-panel.open {
      transform: translateY(0);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .panel-title {
      font-family: 'Black Ops One', cursive;
      font-size: 1rem;
    }

    .panel-close {
      background: none;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      padding: 6px 12px;
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .unit-option {
      padding: 10px;
      background: var(--bg-medium);
      border: 2px solid transparent;
      border-radius: 6px;
      text-align: center;
    }

    .unit-option:active, .unit-option.selected {
      border-color: var(--accent-green);
    }

    .unit-option .icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 5px;
    }

    .unit-option .name {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .unit-option .stats {
      font-size: 0.6rem;
      color: var(--accent-yellow);
      margin-top: 3px;
    }

    /* Overlays */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .overlay h2 {
      font-family: 'Black Ops One', cursive;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .overlay .stats-box {
      text-align: center;
      margin: 20px 0;
    }

    .overlay .stat-line {
      font-size: 1rem;
      margin: 10px 0;
      color: var(--text-secondary);
    }

    .overlay .stat-line span {
      color: var(--accent-yellow);
      font-family: 'Share Tech Mono', monospace;
    }

    .countdown-overlay h2 {
      font-size: 5rem;
      color: var(--accent-green);
    }

    .countdown-overlay .wave-info {
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .wave-complete-overlay h2 { color: var(--accent-green); }
    .game-over-overlay h2 { color: var(--accent-red); }
    .game-over-overlay.victory h2 { color: var(--accent-green); }
    .pause-overlay h2 { color: var(--text-primary); }

    /* Settings Screen - Landscape */
    .settings-screen {
      padding: 20px 40px;
      overflow-y: auto;
      max-width: 600px;
      margin: 0 auto;
    }

    .settings-header {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      padding: 10px;
      margin-right: 10px;
      cursor: pointer;
    }

    .back-btn:hover {
      color: var(--accent-green);
    }

    .settings-title {
      font-family: 'Black Ops One', cursive;
      font-size: 1.3rem;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .setting-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .setting-btn {
      flex: 1;
      min-width: 100px;
      padding: 10px 16px;
      font-family: 'Oxanium', sans-serif;
      font-size: 0.85rem;
      border: 1px solid var(--bg-light);
      background: var(--bg-medium);
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
    }

    .setting-btn:hover {
      border-color: var(--text-secondary);
    }

    .setting-btn.active {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.1);
      color: var(--accent-green);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--bg-light);
    }

    .checkbox-row label {
      flex: 1;
      font-size: 0.9rem;
    }

    .toggle {
      width: 50px;
      height: 28px;
      background: var(--bg-light);
      border-radius: 14px;
      position: relative;
      transition: background 0.2s;
      cursor: pointer;
    }

    .toggle.active {
      background: var(--accent-green);
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.active::after {
      transform: translateX(22px);
    }

    /* Skin Selector */
    .skins-container {
      max-height: 200px;
      overflow-y: auto;
    }

    .skin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--bg-light);
    }

    .skin-row:last-child {
      border-bottom: none;
    }

    .skin-unit-name {
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .skin-selector {
      padding: 6px 10px;
      background: var(--bg-medium);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 140px;
    }

    .skin-selector:hover {
      border-color: var(--accent-blue);
    }

    .skin-selector:focus {
      outline: none;
      border-color: var(--accent-green);
    }

    /* Stats Screen - Landscape */
    .stats-screen {
      padding: 20px 40px;
      overflow-y: auto;
      max-width: 800px;
      margin: 0 auto;
    }

    .stats-sections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .stats-section {
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 16px;
    }

    .stats-section h3 {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--bg-light);
      font-size: 0.9rem;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-value {
      font-family: 'Share Tech Mono', monospace;
      color: var(--accent-green);
    }

    /* ===== HEADQUARTERS SCREEN - Landscape ===== */
    .hq-screen {
      padding: 0;
      background: linear-gradient(180deg, #0f1319 0%, #1a1f2e 100%);
      display: flex;
      flex-direction: column;
    }

    .hq-header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: var(--bg-medium);
      border-bottom: 2px solid var(--accent-green);
      flex-shrink: 0;
    }

    .hq-title {
      font-family: 'Black Ops One', cursive;
      font-size: 1.2rem;
      margin-right: 20px;
    }

    .hq-resources {
      display: flex;
      gap: 15px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      flex: 1;
    }

    .hq-tabs {
      display: flex;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--bg-light);
      flex-shrink: 0;
    }

    .hq-tab {
      padding: 10px 20px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .hq-tab.active {
      color: var(--accent-green);
      border-bottom-color: var(--accent-green);
    }

    .hq-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    /* Lineup Tab - Landscape */
    .lineup-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .lineup-slots {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }

    .lineup-slot {
      flex: 0 0 auto;
      width: 120px;
      background: var(--bg-medium);
      border: 2px solid var(--bg-light);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .lineup-slot.selected {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.1);
    }

    .slot-label {
      font-size: 0.65rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .slot-unit {
      width: 45px;
      height: 45px;

    .details-header {

      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .details-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      padding: 4px 8px;

    .details-weapon {

      gap: 16px;
      font-size: 0.85rem;
      padding: 8px 12px;

    }

      font-weight: 600;
    }

    .weapon-speed {
      color: var(--text-secondary);
      font-family: 'Share Tech Mono', monospace;
    }

    /* Firing Range */
    .firing-range {
      background: var(--bg-dark);
      border-radius: 8px;
      overflow: hidden;
    }

    .range-field {
      position: relative;
      height: 120px;
      background: linear-gradient(to bottom, #1a2a1a 0%, #0d1a0d 100%);
      border-bottom: 3px solid #2a3a2a;
    }

    .range-unit {
      position: absolute;
      bottom: 10px;
      left: 20px;
      width: 40px;
      height: 40px;
    }

    .range-unit svg {
      width: 100%;
      height: 100%;
    }

    .range-targets {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .range-target {
      width: 32px;
      height: 32px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .range-target:hover {
      transform: scale(1.1);
    }

    .range-target:active {
      transform: scale(0.95);
    }

    .range-target svg {
      width: 100%;
      height: 100%;
    }

    .range-target.hit {
      animation: target-hit 0.3s ease-out;
    }

    @keyframes target-hit {
      0% { transform: translateX(0); }
      20% { transform: translateX(5px); }
      40% { transform: translateX(-4px); }
      60% { transform: translateX(3px); }
      80% { transform: translateX(-2px); }
      100% { transform: translateX(0); }
    }

    .range-projectiles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .range-projectile {
      position: absolute;
      border-radius: 2px;
      animation: range-shot 0.3s linear forwards;
    }

    @keyframes range-shot {
      0% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }

    .range-muzzle {
      position: absolute;
      border-radius: 50%;
      animation: range-flash 0.1s ease-out forwards;
    }

    @keyframes range-flash {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }

    .range-impact {
      position: absolute;
      border-radius: 50%;
      animation: range-impact 0.2s ease-out forwards;
    }

    @keyframes range-impact {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    }

      font-size: 0.75rem;
