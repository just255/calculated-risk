        flex-direction: row;
      }

        flex: 1;
        flex-direction: column;
        text-align: center;
        padding: 8px 4px;
      }

      .pos-text {
        font-size: 0.65rem;
      }

    .campaign-battle-screen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: #1a1a2e;
      position: relative;
    }

    .campaign-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);

      gap: 10px;
      padding: 8px 15px;

      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;

    .front-line-btn {

      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;

      border: 1px solid rgba(255, 255, 255, 0.2);

    .front-line-btn.advance.active {

      border-color: #4caf50;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);

    .front-line-btn.hold.active {

      border-color: #ffc107;
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);

      border-color: #f44336;
      box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);

    .front-line-btn .fl-icon {
      font-size: 16px;
    }

    .front-line-btn .fl-label {
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .front-line-btn .fl-key {
      font-size: 8px;
      opacity: 0.6;
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 4px;
      border-radius: 3px;

    .campaign-hud {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
      justify-content: center;
    }

    .campaign-hp-bar {
      width: 150px;
      height: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .campaign-hp-fill {
      height: 100%;
      background: linear-gradient(to right, #ff4444, #ff8844);
      transition: width 0.2s;
    }

    .campaign-hp-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.7rem;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
    }

    .campaign-stats {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
    }

    .campaign-timer {
      color: var(--accent-yellow);
      font-weight: bold;
    }

    .campaign-kills {
      color: var(--accent-blue);
    }

    .campaign-wave {
      color: var(--accent-green);
    }

    .campaign-battlefield {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #3a3a2e;
      cursor: crosshair;
      touch-action: none; /* Disable browser touch gestures - we handle all touch */
    }

    .campaign-terrain {
      z-index: 1;
    }

    .campaign-cell {
      transition: none;
      overflow: hidden;
    }

    .campaign-cell .terrain-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .campaign-entity {
      position: absolute;
      pointer-events: none;
    }

    .campaign-unit {
      z-index: 30;
      box-shadow: 0 0 10px rgba(90, 138, 90, 0.5);
    }

    .campaign-hero {
      z-index: 50;
      box-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
    }

    .campaign-enemy {
      z-index: 40;
    }

    .campaign-projectile {
      z-index: 45;
    }

    .campaign-minimap {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--accent-green);
      border-radius: 6px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .campaign-minimap:hover {
      border-color: var(--accent-blue);
      transform: scale(1.05);
    }

    .campaign-minimap.expanded {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 500;
      padding: 10px;
      border-width: 2px;
    }

    .campaign-minimap.expanded .minimap-canvas {
      width: 240px !important;
      height: 240px !important;
    }

    .campaign-minimap.expanded .minimap-legend {
      font-size: 0.75rem;
      gap: 12px;
      padding-top: 8px;
    }

    .minimap-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 499;
    }

    .minimap-overlay.visible {
      display: block;
    }

    .minimap-canvas {
      display: block;
      border-radius: 4px;
      width: 60px;
      height: 60px;
    }

    .minimap-legend {
      display: flex;
      justify-content: center;
      gap: 6px;
      font-size: 0.5rem;
      padding-top: 2px;
      color: var(--text-secondary);
    }

    .legend-hero { color: #4a9eff; }
    .legend-unit { color: #5a8a5a; }
    .legend-enemy { color: #ff4444; }

    /* ═══════════════════════════════════════════════════════════════
       SQUAD STRIP - Right-side vertical unit icons + radio toggle
       ═══════════════════════════════════════════════════════════════ */
    .squad-strip {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }

    /* Multi-select toggle button */
    .multiselect-toggle {
      width: 40px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(40, 45, 55, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .multiselect-toggle:hover {
      background: rgba(60, 65, 75, 0.9);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .multiselect-toggle.active {
      background: rgba(74, 158, 255, 0.3);
      border-color: #4a9eff;
      color: #4a9eff;
    }

    /* Checkmark for multi-selected units */
    .su-check {
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 0.6rem;
      color: #4a9eff;
      text-shadow: 0 0 4px rgba(74, 158, 255, 0.8);
    }

    .squad-units {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .squad-unit-btn {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(60, 65, 75, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .squad-unit-btn:hover {
      background: rgba(80, 85, 95, 0.9);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .squad-unit-btn.active {
      background: rgba(74, 158, 255, 0.3);
      border-color: #4a9eff;
      box-shadow: 0 0 8px rgba(74, 158, 255, 0.5);
    }

    .squad-unit-btn.dead {
      opacity: 0.35;
      filter: grayscale(0.9);
    }

    .su-icon {
      font-size: 1.1rem;
    }

    .su-hp-bar {
      position: absolute;
      bottom: 2px;
      left: 4px;
      right: 4px;
      height: 3px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 2px;
    }

    .su-hp-fill {
      height: 100%;
      background: linear-gradient(to right, #4caf50, #8bc34a);
      border-radius: 2px;
      transition: width 0.2s ease;
    }

    .radio-toggle-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 200, 50, 0.2);
      border: 2px solid rgba(255, 200, 50, 0.5);
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.15s ease;
    }

    .radio-toggle-btn:hover {
      background: rgba(255, 200, 50, 0.35);
    }

    .radio-toggle-btn.active {
      background: rgba(255, 200, 50, 0.4);
      border-color: var(--accent-yellow);
      box-shadow: 0 0 10px rgba(255, 200, 50, 0.5);
    }

    /* ═══════════════════════════════════════════════════════════════
       VINTAGE MILITARY RADIO - WWII-era field radio style
       ═══════════════════════════════════════════════════════════════ */
    .radio-popup {
      position: absolute;
      right: 60px;
      top: 50%;
      transform: translateY(-50%) translateX(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 99;
      transition: all 0.2s ease;
    }

    .radio-popup.open {
      transform: translateY(-50%) translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* Vintage Radio Body - olive drab metal casing */
    .vintage-radio .radio-body {
      background: linear-gradient(145deg, #4a5540 0%, #3a4530 50%, #2a3520 100%);
      border: 3px solid #2a3020;
      border-radius: 8px;
      padding: 10px;
      min-width: 150px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 4px 12px rgba(0,0,0,0.5),
        0 0 0 1px #1a2010;
    }

    /* Speaker Grille - horizontal lines */
    .radio-speaker-grille {
      background: linear-gradient(
        transparent 0px,
        #2a3020 1px,
        transparent 2px,
        transparent 4px
      );
      background-size: 100% 5px;
      background-color: #1a2010;
      height: 20px;
      border-radius: 4px;
      margin-bottom: 8px;
      border: 1px solid #1a2010;
    }

    /* Digital-style Display */
    .radio-display {
      background: #1a2015;
      border: 2px inset #0a1005;
      border-radius: 4px;
      padding: 5px 10px;
      margin-bottom: 8px;
      text-align: center;
    }

    .radio-freq {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: #7cb87c;
      text-shadow: 0 0 5px #7cb87c;
      letter-spacing: 2px;
      animation: radio-flicker 3s ease-in-out infinite;
    }

    @keyframes radio-flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
      52% { opacity: 0.95; }
    }

    /* Decorative Knobs */
    .radio-knobs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 10px;
    }

    .radio-knob {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, #6a7560, #3a4530, #2a3520);
      border-radius: 50%;
      border: 2px solid #1a2010;
      box-shadow:
        inset 0 -2px 4px rgba(0,0,0,0.5),
        0 2px 4px rgba(0,0,0,0.3);
    }

    .radio-knob::after {
      content: '';
      display: block;
      width: 2px;
      height: 6px;
      background: #1a2010;
      margin: 4px auto 0;
      border-radius: 1px;
    }

    /* Command Buttons Grid */
    .vintage-radio .radio-popup-orders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .vintage-radio .rp-order-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 6px;
      background: linear-gradient(180deg, #5a6550 0%, #4a5540 50%, #3a4530 100%);
      border: 2px solid #2a3020;
      border-radius: 4px;
      color: #d0d8c0;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.15),
        0 2px 4px rgba(0,0,0,0.3);
    }

    .vintage-radio .rp-order-btn:hover {
      background: linear-gradient(180deg, #6a7560 0%, #5a6550 50%, #4a5540 100%);
      color: #fff;
    }

    .vintage-radio .rp-order-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    }

    .vintage-radio .rp-order-btn.active {
      background: linear-gradient(180deg, #8a9a70 0%, #7a8a60 50%, #6a7a50 100%);
      border-color: #9aaa80;
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 0 8px rgba(150, 180, 120, 0.4);
    }

    .vintage-radio .rp-order-btn.focus {
      background: linear-gradient(180deg, #7a4545 0%, #6a3535 50%, #5a2525 100%);
      border-color: #8a4545;
      color: #ffaaaa;
    }

    .vintage-radio .rp-order-btn.focus:hover {
      background: linear-gradient(180deg, #8a5555 0%, #7a4545 50%, #6a3535 100%);
      color: #fff;
    }

    .vintage-radio .rp-order-btn.focus.active {
      background: linear-gradient(180deg, #aa6565 0%, #9a5555 50%, #8a4545 100%);
      border-color: #cc7777;
      color: #fff;
      animation: pulse-target 1s ease-in-out infinite;
    }

    @keyframes pulse-target {
      0%, 100% { box-shadow: 0 0 5px rgba(255, 68, 68, 0.4); }
      50% { box-shadow: 0 0 15px rgba(255, 68, 68, 0.7); }
    }

    @keyframes pulse-selected {
      0%, 100% { box-shadow: 0 0 15px #4a9eff, 0 0 25px rgba(74, 158, 255, 0.5); }
      50% { box-shadow: 0 0 20px #4a9eff, 0 0 35px rgba(74, 158, 255, 0.7); }
    }

    .rpo-icon {
      font-size: 1rem;
    }

    .rpo-label {
      font-size: 0.55rem;
      font-weight: bold;
      letter-spacing: 0.3px;
      text-align: center;
      text-transform: uppercase;
    }

    /* Mobile adjustments for squad strip */
    @media (max-width: 768px) {
      .squad-strip {
        right: 5px;
      }

      .squad-units {
        padding: 4px;
      }

      .squad-unit-btn {
        width: 34px;
        height: 34px;
      }

      .su-icon {
        font-size: 0.95rem;
      }

      .radio-popup {
        right: 50px;
      }

      .vintage-radio .radio-body {
        min-width: 130px;
        padding: 8px;
      }

      .radio-speaker-grille {
        height: 16px;
        margin-bottom: 6px;
      }

      .radio-display {
        padding: 4px 8px;
        margin-bottom: 6px;
      }

      .radio-freq {
        font-size: 0.55rem;
      }

      .radio-knobs {
        margin-bottom: 8px;
      }

      .radio-knob {
        width: 14px;
        height: 14px;
      }

      .vintage-radio .rp-order-btn {
        padding: 6px 4px;
      }

      .rpo-icon {
        font-size: 0.9rem;
      }

      .rpo-label {
        font-size: 0.5rem;
      }
    }

    .campaign-controls-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 15px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: rgba(0,0,0,0.5);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .control-group kbd {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-primary);
    }

    .control-sep {
      color: rgba(255,255,255,0.3);
    }

    .commands-row {
      color: var(--accent-yellow);
    }

    .commands-row kbd {
      background: rgba(255, 200, 50, 0.2);
      border-color: rgba(255, 200, 50, 0.4);
    }

    /* Mobile Controls - Bottom 35% zones for joysticks */
    .mobile-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 35%;
      pointer-events: none;
      z-index: 90;
      display: flex;
    }

    .mobile-joystick-zone {
      position: relative;
      flex: 1;
      height: 100%;
      background: linear-gradient(to top, rgba(100,150,255,0.08) 0%, transparent 100%);
      border-top: 1px solid rgba(100,150,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .joystick-hint {
      color: rgba(100,150,255,0.6);
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .mobile-shoot-zone {
      position: relative;
      flex: 1;
      height: 100%;
      background: linear-gradient(to top, rgba(255,100,100,0.08) 0%, transparent 100%);
      border-top: 1px solid rgba(255,100,100,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .shoot-hint {
      color: rgba(255,100,100,0.6);
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .mobile-commands {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .mobile-cmd-btn {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .mobile-cmd-btn:active {
      background: rgba(74, 158, 255, 0.5);
      border-color: #4a9eff;
    }

    /* Hide desktop controls on mobile */
    @media (max-width: 768px) {
      .campaign-controls-hint {
        display: none;
      }

      .campaign-top-bar {
        padding: 5px 8px;
        gap: 6px;
        flex-wrap: wrap;
      }

      .minimap-canvas {
        width: 50px;
        height: 50px;
      }

      .campaign-minimap.expanded .minimap-canvas {
        width: 200px !important;
        height: 200px !important;
      }

      .minimap-legend {
        display: none;
      }

      .campaign-minimap.expanded .minimap-legend {
        display: flex;
      }

      /* Compact front-line buttons on mobile */
      .front-line-commands {
        padding: 3px 5px;
        gap: 4px;
      }

      .front-line-btn {
        padding: 4px 8px;
        min-width: 45px;
      }

      .front-line-btn .fl-icon {
        font-size: 14px;
      }

      .front-line-btn .fl-label {
        font-size: 7px;
      }

      .front-line-btn .fl-key {
        display: none;
      }

      .campaign-hp-bar {
        width: 100px;
        height: 18px;
      }

      .campaign-hp-text {
        font-size: 0.65rem;
      }

      .campaign-stats {
        font-size: 0.7rem;
        gap: 8px;
      }
    }

    /* Campaign Result Screen */
    .campaign-result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px;
    }

    .victory-title {
      color: var(--accent-green);
      text-shadow: 0 0 20px var(--accent-green);
    }

    .defeat-title {
      color: var(--accent-red);
      text-shadow: 0 0 20px var(--accent-red);
    }

    .result-stats {
      text-align: center;
      line-height: 2;
    }

    /* Landscape orientation warning */
    #rotate-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a2e;
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    .rotate-content {
      text-align: center;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
    }

    .rotate-icon {
      font-size: 80px;
      animation: rotate-hint 2s ease-in-out infinite;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    .rotate-content h2 {
      margin: 20px 0 10px;
      color: #4a9eff;
    }

    .rotate-content p {
      color: #888;
    }

    #dismiss-rotate {
      margin-top: 20px;
      padding: 12px 24px;
      background: transparent;
      border: 2px solid #4a9eff;
      color: #4a9eff;
      font-family: 'Oxanium', sans-serif;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    #dismiss-rotate:hover {
      background: rgba(74, 158, 255, 0.2);
    }

    /* Show warning only on mobile in portrait */
    @media (max-width: 900px) and (orientation: portrait) {
      #rotate-warning {
        display: flex;
      }
      #app {
        display: none;
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       LANDSCAPE RESPONSIVE - Short viewport heights
       ═══════════════════════════════════════════════════════════════ */
    @media (max-height: 500px) and (orientation: landscape) {
      /* Make all screens scrollable */
      .screen {
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      /* Menu Screen - Horizontal layout */
      .menu-screen {
        padding: 10px 20px;
        justify-content: flex-start;
        min-height: 100%;
      }

      .menu-content {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 15px;
        width: 100%;
        padding: 10px 0;
      }

      .menu-header {
        width: auto;
        flex: 0 0 auto;
        text-align: left;
        padding-right: 30px;
      }

      .game-title {
        font-size: 1.4rem;
        margin-bottom: 2px;
      }

      .game-title span {
        font-size: 1.6rem;
      }

      .game-subtitle {
        font-size: 0.7rem;
      }

      .menu-buttons {
        flex-direction: row;
        flex-wrap: wrap;
        max-width: none;
        gap: 8px;
        justify-content: center;
      }

      .menu-btn {
        width: auto;
        min-width: 120px;
        padding: 10px 16px;
        font-size: 0.85rem;
      }

      .menu-resources {
        margin-top: 5px;
      }

      .menu-version {
        bottom: 5px;
        right: 10px;
      }

      /* Campaign/Selection Screens - Scrollable horizontal */
      .campaign-screen {
        padding: 10px 15px;
        justify-content: flex-start;
        min-height: 100%;
      }

      .campaign-content {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 15px;
        width: 100%;
        padding: 40px 0 10px;
      }

      .campaign-screen h2 {
        font-size: 1.2rem;
        width: 100%;
        text-align: center;
        margin-bottom: 0;
      }

      .campaign-screen .subtitle {
        width: 100%;
        text-align: center;
        margin-bottom: 5px;
        font-size: 0.8rem;
      }

      .back-btn-subtle {
        top: 8px;
        left: 8px;
        padding: 4px 10px;
        font-size: 0.75rem;
      }

      /* Era/MOS Grid - More compact */
      .era-grid, .mos-grid {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 8px;
        max-width: none;
      }

      .era-btn, .mos-btn {
        padding: 8px 12px;
        min-width: 90px;
      }

      .era-name, .mos-name {
        font-size: 0.8rem;
      }

      .era-period, .mos-style {
        font-size: 0.65rem;
      }

      /* Vehicle Selection - Compact horizontal layout */
      .vehicle-preview-container {
        margin: 5px 0;
      }

      #vehicle-preview {
        width: 120px;
        height: 120px;
      }

      .vehicle-current {
        margin-top: 4px;
        font-size: 0.85rem;
      }

      .vehicle-grid {
        margin: 8px 0;
        gap: 6px;
      }

      .vehicle-btn {
        padding: 6px;
        min-width: 70px;
      }

      .vehicle-thumb {
        width: 40px;
        height: 40px;
        margin-bottom: 4px;
      }

      .vehicle-name {
        font-size: 0.7rem;
      }

      .variant-pills {
        margin: 5px 0;
        gap: 5px;
      }

      .variant-pill {
        padding: 4px 12px;
        font-size: 0.7rem;
      }

      .vehicle-stats {
        padding: 8px;
        margin: 8px auto;
        max-width: 250px;
      }

      .stat-row {
        margin: 3px 0;
      }

      .stat-label {
        width: 55px;
        font-size: 0.65rem;
      }

      .stat-bar {
        height: 6px;
      }

      .stat-value {
        font-size: 0.65rem;
      }

      .battle-type-select {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 10px;
        gap: 8px;
      }

      .battle-type-select .menu-btn {
        flex: 0 0 auto;
        min-width: 140px;
      }

      /* Settings Screen - Compact */
      .settings-screen {
        padding: 10px 15px;
      }

      .settings-screen h1 {
        font-size: 1.3rem;
        margin: 5px 0;
      }

      .settings-section h2 {
        font-size: 1rem;
        margin: 8px 0 5px;
      }

      .settings-group {
        padding: 8px;
        margin-bottom: 8px;
      }

      .setting-row {
        padding: 6px 0;
      }

      /* Stats Screen - Compact */
      .stats-screen {
        padding: 10px 15px;
      }

      .stats-screen h1 {
        font-size: 1.3rem;
        margin: 5px 0;
      }

      .stat-card {
        padding: 10px;
        margin-bottom: 8px;
      }

      /* HQ Screen - Compact */
      .hq-screen {
        padding: 10px;
      }

      .hq-header h1 {
        font-size: 1.3rem;
      }

      .hq-tabs {
        gap: 5px;
        margin: 8px 0;
      }

      .hq-tab {
        padding: 6px 12px;
        font-size: 0.75rem;
      }

      .unit-roster {
        gap: 8px;
      }

      .unit-card {
        padding: 10px;
      }

      /* H2H Design Screen - Compact */
      .h2h-design-screen {
        padding: 10px;
      }

      .design-header h1 {
        font-size: 1.2rem;
      }

      .design-unit-grid {
        gap: 6px;
      }

      .design-unit-card {
        padding: 8px;
        min-width: 70px;
      }
    }

    /* Even shorter viewports - ultra compact */
    @media (max-height: 400px) and (orientation: landscape) {
      .menu-content {
        gap: 10px;
      }

      .menu-header {
        padding-right: 20px;
      }

      .game-title {
        font-size: 1.2rem;
      }

      .game-title span {
        font-size: 1.4rem;
      }

      .menu-btn {
        padding: 8px 12px;
        font-size: 0.75rem;
        min-width: 100px;
      }

      .campaign-content {
        gap: 10px;
        padding-top: 35px;
      }

      #vehicle-preview {
        width: 100px;
        height: 100px;
      }

      .vehicle-btn {
        padding: 4px;
        min-width: 60px;
      }

      .vehicle-thumb {
        width: 30px;
        height: 30px;
      }

      .vehicle-name {
        font-size: 0.6rem;
      }

      .vehicle-stats {
        display: none; /* Hide stats on very short screens */
      }
    }

    /* ===== ENDLESS MODE THEMES ===== */

    /* Theme: Motor Pool (Industrial garage) */
    .theme-motor-pool {
      --theme-bg: linear-gradient(180deg, #1a1f2e 0%, #0f1219 100%);
      --theme-header-bg: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
      --theme-panel-bg: linear-gradient(180deg, #1f2937 0%, #111827 100%);
      --theme-accent: #f59e0b;
      --theme-accent-dark: #d97706;
      --theme-stripe: repeating-linear-gradient(45deg, #f59e0b, #f59e0b 10px, #1a1a1a 10px, #1a1a1a 20px);
      --theme-border: #374151;
      --theme-text-header: #f59e0b;
    }

    .theme-motor-pool .loadout-header {
      background: var(--theme-header-bg);
      border-bottom: 4px solid transparent;
      border-image: var(--theme-stripe) 1;
    }

    .theme-motor-pool .loadout-header h2 {
      color: var(--theme-accent);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .theme-motor-pool .loadout-header::before {
      content: '⚙';
      margin-right: 8px;
      font-size: 1.2rem;
    }

    .theme-motor-pool .lift-bay {
      background: var(--theme-panel-bg);
      border: 3px solid var(--theme-border);
      box-shadow: inset 0 -8px 16px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
      position: relative;
    }

    .theme-motor-pool .lift-bay::after {
      content: 'LIFT BAY 01';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      color: var(--text-secondary);
      letter-spacing: 2px;
    }

    .theme-motor-pool .section-label {
      font-family: 'Oxanium', sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #9ca3af;
      font-size: 0.7rem;
      border-bottom: 2px solid var(--theme-border);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .theme-motor-pool .section-label::before {
      content: '▸ ';
      color: var(--theme-accent);
    }

    .theme-motor-pool .equipment-rack {
      background:
        linear-gradient(90deg, transparent 48%, #2d3748 48%, #2d3748 52%, transparent 52%),
        linear-gradient(transparent 48%, #2d3748 48%, #2d3748 52%, transparent 52%),
        var(--theme-panel-bg);
      background-size: 24px 24px, 24px 24px, 100% 100%;
      border: 2px solid var(--theme-border);
      border-radius: 4px;
    }

    .theme-motor-pool .deploy-btn {
      background: linear-gradient(135deg, var(--theme-accent) 0%, var(--theme-accent-dark) 100%);
      color: #000;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .theme-motor-pool .deploy-btn::before {
      content: '▶ ';
    }

    .theme-motor-pool .caution-stripe {
      height: 4px;
      background: var(--theme-stripe);
    }

    .theme-motor-pool .panel {
      background: var(--theme-panel-bg);
      border: 2px solid var(--theme-border);
      border-radius: 4px;
    }

    .theme-motor-pool .panel-header {
      background: var(--theme-header-bg);
      padding: 8px 12px;
      border-bottom: 2px solid var(--theme-border);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--theme-accent);
    }

    .theme-motor-pool .stat-bar {
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
    }

    .theme-motor-pool .stat-bar-fill {
      height: 100%;
      background: var(--theme-accent);
      border-radius: 3px;
    }

    /* ===== ENDLESS MODE STYLES ===== */

    /* Loadout Screen - 2 Column Split Layout */
    .endless-loadout-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--theme-bg, var(--bg-dark));
      overflow: hidden;
    }

    .loadout-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-medium);
      border-bottom: 1px solid var(--bg-light);
      flex-shrink: 0;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .loadout-header h2 {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 2px;
      margin: 0;
      flex: 1;
    }

    .header-unit-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .header-unit-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 1px;
    }

    .header-variant-select {
      background: var(--bg-dark);
      border: 1px solid var(--bg-lighter);
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-family: inherit;
      cursor: pointer;
    }

    .header-variant-select:hover {
      border-color: var(--accent-blue);
    }

    /* Header right section (resources, options, deploy) */
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .header-label {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin-left: 4px;
    }

    .header-option-check,
    .header-option-radio {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      background: var(--bg-dark);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.6rem;
      color: var(--text-secondary);
      transition: all 0.15s;
      white-space: nowrap;
    }

    .header-option-check:hover,
    .header-option-radio:hover {
      background: var(--bg-light);
    }

    .header-option-check .check-icon {
      width: 10px;
      height: 10px;
      border: 1px solid var(--text-secondary);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.45rem;
      color: transparent;
    }

    .header-option-check.checked .check-icon {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: var(--bg-dark);
    }

    .header-option-check.checked {
      color: var(--text-primary);
    }

    .header-option-check.disabled,
    .header-deploy-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .header-option-radio .radio-dot {
      width: 8px;
      height: 8px;
      border: 1px solid var(--text-secondary);
      border-radius: 50%;
    }

    .header-option-radio.selected .radio-dot {
      border-color: var(--accent-blue);
      background: var(--accent-blue);
    }

    .header-option-radio.selected {
      color: var(--text-primary);
    }

    .header-option-divider {
      width: 1px;
      height: 16px;
      background: var(--bg-lighter);
      margin: 0 2px;
    }

    .header-mode-select {
      background: var(--bg-dark);
      border: 1px solid var(--bg-lighter);
      color: var(--text-secondary);
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 0.6rem;
      font-family: inherit;
      cursor: pointer;
    }

    .header-mode-select:hover {
      border-color: var(--accent-blue);
    }

    .header-deploy-btn {
      padding: 4px 10px;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      margin-left: 4px;
    }

    .header-deploy-btn:hover {
      filter: brightness(1.1);
    }

    .loadout-header .resource-display {
      display: flex;
      gap: 8px;
      font-size: 0.65rem;
      font-weight: 600;
      padding-right: 6px;
      border-right: 1px solid var(--bg-lighter);
      margin-right: 2px;
    }

    .res-scrap { color: var(--accent-yellow); }
    .res-parts { color: var(--accent-blue); }

    .back-btn {
      background: transparent;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn:active {
      background: var(--bg-light);
    }

    /* Main content area */
    .loadout-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 12px;
      gap: 12px;
    }

    /* Section labels */
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    /* Asset Selection - 2 column split */
    .asset-selection {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr; /* Narrow list, rest for preview */
      gap: 12px;
      flex: 1;
      min-height: 0; /* Allow shrinking */
    }

    .asset-selection > * {
      min-height: 0; /* Allow grid children to shrink */
    }

    /* Left side - Vehicle Grid */
    .asset-grid-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    /* Category Tabs */
    .category-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .category-tab {
      padding: 6px 10px;
      font-size: 0.65rem;
      font-weight: 600;
      background: var(--bg-medium);
      border: none;
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .category-tab.active {
      background: var(--bg-light);
      color: var(--text-primary);
    }

    /* Vehicle Grid */
    .vehicle-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow-y: auto;
      padding: 8px;
      background: var(--bg-medium);
      border-radius: 8px;
      flex: 1;
      align-content: start;
    }

    .vehicle-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--bg-dark);
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      padding: 8px 4px;
      position: relative;
    }

    .vehicle-tile:hover {
      background: var(--bg-light);
    }

    .vehicle-tile.selected {
      border-color: var(--accent-green);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), var(--bg-dark));
    }

    .vehicle-tile.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .vehicle-tile-icon {
      font-size: 1.8rem;
      line-height: 1;
    }

    .vehicle-tile-name {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: center;
    }

    /* Mini stat bar on tiles */
    .vehicle-tile-stat {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .mini-stat-bar {
      flex: 1;
      height: 4px;
      background: var(--bg-light);
      border-radius: 2px;
      overflow: hidden;
    }

    .mini-stat-bar-fill {
      height: 100%;
      background: var(--accent-red);
      border-radius: 2px;
    }

    .mini-stat-value {
      font-size: 0.5rem;
      font-weight: 700;
      color: var(--text-secondary);
      min-width: 16px;
      text-align: right;
    }

    /* Layout Toggle */
    .layout-toggle {
      margin-left: auto;
      padding: 4px 8px;
      font-size: 0.65rem;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
    }

    .layout-toggle:hover {
      background: var(--bg-light);
      color: var(--text-primary);
    }

    /* List View Styles */
    .vehicle-grid.list-view {
      display: flex !important;
      flex-direction: column !important;
      gap: 2px !important;
      flex-wrap: nowrap !important;
    }

    .vehicle-grid.list-view .vehicle-tile {
      flex-direction: row !important;
      padding: 8px 12px !important;
      gap: 10px !important;
      justify-content: flex-start !important;
      align-items: center !important;
      border-radius: 4px;
      width: 100%;
    }

    .vehicle-grid.list-view .vehicle-tile-icon {
      font-size: 1.1rem !important;
      flex-shrink: 0;
      width: 24px;
      text-align: center;
    }

    .vehicle-grid.list-view .vehicle-tile-name {
      font-size: 0.75rem !important;
      flex: 1;
      text-align: left !important;
      font-weight: 500;
    }

    .vehicle-grid.list-view .vehicle-tile-stat {
      display: none !important; /* Hide stat bars in list view */
    }

    /* Right side - Selected Unit Details */
    .unit-details {
      display: flex;
      flex-direction: column;
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .unit-details-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      height: 100%;
    }

    /* Horizontal Card Layout - Preview Left, Info Right */
    .unit-card-horizontal {
      display: flex;
      gap: 16px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }

    /* Large Tank Preview - Square, fills available height */
    .unit-preview-large {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      border-radius: 8px;
      flex: 1;
      min-width: 180px;
      max-width: 50%;
      position: relative;
      overflow: hidden;
    }

    .unit-preview-canvas {
      transform-origin: center center;
    }

    /* Preview Zoom Controls - Top Left */
    .preview-zoom-controls {
      position: absolute;
      top: 6px;
      left: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,0,0,0.7);
      border-radius: 4px;
      padding: 2px 4px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .preview-zoom-controls:hover {
      opacity: 1;
    }

    .zoom-level {
      font-size: 0.6rem;
      color: var(--text-secondary);
      min-width: 20px;
      text-align: center;
    }

    /* Preview Pan Controls - Top Right */
    .preview-pan-controls {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .preview-pan-controls:hover {
      opacity: 1;
    }

    .pan-btn-row {
      display: flex;
      gap: 2px;
    }

    .ctrl-btn {
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 3px;
      background: rgba(0,0,0,0.7);
      color: var(--text-secondary);
      font-size: 0.65rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .ctrl-btn:hover {
      background: var(--bg-light);
      color: var(--text-primary);
    }

    .unit-preview-fallback {
      font-size: 4rem;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
      display: none;
    }

    .unit-preview-canvas[style*="display: none"] + .unit-preview-fallback {
      display: block;
    }

    /* Icon-only mode when no sprite variants exist */
    .unit-preview-large.icon-only {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .unit-preview-large.icon-only .unit-preview-fallback {
      display: flex;
      font-size: 6rem;
      opacity: 0.8;
    }

    .no-variants-label {
      font-size: 0.6rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Info Stack - Right side */
    .unit-info-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .unit-header {
      flex-shrink: 0;
    }

    .unit-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }

    .unit-variant-label {
      font-size: 0.65rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Stats Display */
    .stats-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-dark);
      border-radius: 6px;
      padding: 8px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-label {
      font-size: 0.55rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      width: 26px;
    }

    .stat-bar {
      flex: 1;
      height: 12px;
      background: rgba(0,0,0,0.4);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    /* Minor ticks every 5% (half thickness of major) */
    .stat-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0%,
        transparent calc(5% - 1.5px),
        rgba(0,0,0,0.35) calc(5% - 1.5px),
        rgba(0,0,0,0.35) 5%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Major ticks every 10% (3px) */
    .stat-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent 0%,
        transparent calc(10% - 3px),
        rgba(0,0,0,0.8) calc(10% - 3px),
        rgba(0,0,0,0.8) 10%
      );
      pointer-events: none;
      z-index: 2;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .stat-bar-fill.dmg { background: linear-gradient(180deg, #ff6b6b, var(--accent-red)); }
    .stat-bar-fill.spd { background: linear-gradient(180deg, #74b9ff, var(--accent-blue)); }
    .stat-bar-fill.arm { background: linear-gradient(180deg, #7bed9f, var(--accent-green)); }
    .stat-bar-fill.dur { background: linear-gradient(180deg, #ffeaa7, var(--accent-yellow)); }

    .stat-value {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 18px;
      text-align: right;
    }

    /* Equipment Row - Hidden on desktop (Equipment Bay visible), shown on mobile */
    .unit-equipment-row {
      display: none;
    }

    @media (max-width: 800px), (max-height: 600px) {
      .unit-equipment-row {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        justify-content: center;
      }
    }

    .unit-equip-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .unit-equip-slot:hover {
      border-color: var(--accent-green);
      background: var(--bg-light);
    }

    .unit-equip-slot.filled {
      border-color: var(--accent-blue);
      background: rgba(96, 165, 250, 0.1);
    }

    .unit-equip-icon {
      font-size: 1rem;
      line-height: 1;
    }

    .unit-equip-label {
      display: none; /* Hidden - using just icons */
    }

    /* Deploy Strip - horizontal bar below detail panel */
    .deploy-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-dark);
      border-radius: 6px;
      margin-top: 8px;
    }

    /* Deploy Options Row */
    .deploy-options {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
      font-size: 0.65rem;
    }

    .deploy-strip .unit-deploy-btn {
      margin-top: 0;
      white-space: nowrap;
    }

    .deploy-option-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .deploy-option-label {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 0.5px;
      margin-right: 2px;
    }

    .deploy-option-check,
    .deploy-option-radio {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: var(--bg-medium);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-secondary);
    }

    .deploy-option-check:hover,
    .deploy-option-radio:hover {
      background: var(--bg-light);
    }

    .deploy-option-check .check-icon {
      width: 12px;
      height: 12px;
      border: 1px solid var(--text-secondary);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      color: transparent;
      transition: all 0.15s;
    }

    .deploy-option-check.checked .check-icon {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: var(--bg-dark);
    }

    .deploy-option-check.checked {
      color: var(--text-primary);
    }

    .deploy-option-radio .radio-dot {
      width: 10px;
      height: 10px;
      border: 1px solid var(--text-secondary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .deploy-option-radio .radio-dot::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: transparent;
      transition: all 0.15s;
    }

    .deploy-option-radio.selected .radio-dot {
      border-color: var(--accent-blue);
    }

    .deploy-option-radio.selected .radio-dot::after {
      background: var(--accent-blue);
    }

    .deploy-option-radio.selected {
      color: var(--text-primary);
    }

    .option-cost {
      color: var(--accent-yellow);
      font-size: 0.55rem;
    }

    .deploy-option-divider {
      width: 1px;
      height: 20px;
      background: var(--bg-lighter);
    }

    /* Deploy Button */
    .unit-deploy-btn {
      margin-top: auto;
      padding: 10px 16px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .unit-deploy-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
    }

    .unit-deploy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Dropdowns */
    .unit-selects {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .select-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      width: 60px;
    }

    .unit-select {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.8rem;
      font-family: 'Oxanium', sans-serif;
      cursor: pointer;
    }

    /* Equipment Bay Section */
    .equipment-bay {
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 12px;
    }

    .equipment-slots {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .equipment-slot {
      flex: 0 0 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 8px;
      background: var(--bg-dark);
      border: 2px dashed var(--bg-light);
      border-radius: 6px;
      text-align: center;
    }

    .equipment-slot.filled {
      border-style: solid;
      border-color: var(--accent-green);
    }

    .equipment-slot-icon {
      font-size: 1.5rem;
    }

    .equipment-slot-name {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .equipment-slot-bonus {
      font-size: 0.55rem;
      color: var(--accent-green);
    }

    .equipment-slot-empty {
      font-size: 0.6rem;
      color: var(--text-secondary);
    }

    .equipment-add-btn {
      flex: 0 0 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: transparent;
      border: 2px dashed var(--bg-light);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 0.7rem;
      cursor: pointer;
    }

    .equipment-add-btn:hover {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    /* Risk Assessment Section */
    .risk-assessment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .risk-panel {
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 12px;
    }

    .risk-panel-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .insurance-total {
      color: var(--accent-yellow);
    }

    /* Checkbox items */
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
    }

    .checkbox-box {
      width: 18px;
      height: 18px;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: transparent;
      transition: all 0.15s;
    }

    .checkbox-item.checked .checkbox-box {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: white;
    }

    .checkbox-label {
      flex: 1;
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    .checkbox-cost {
      font-size: 0.7rem;
      color: var(--accent-yellow);
    }

    .insurance-note {
      font-size: 0.6rem;
      color: var(--text-secondary);
      margin-top: 8px;
      font-style: italic;
    }

    /* Radio items */
    .radio-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
    }

    .radio-circle {
      width: 18px;
      height: 18px;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      background: transparent;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .radio-item.selected .radio-circle {
      border-color: var(--accent-green);
    }

    .radio-item.selected .radio-circle::after {
      background: var(--accent-green);
    }

    .radio-label {
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    /* Footer */
    .loadout-footer {
      padding: 12px 16px;
      background: var(--bg-medium);
      border-top: 2px solid var(--bg-light);
      display: flex;
      justify-content: flex-end;
    }

    .deploy-btn {
      padding: 14px 32px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .deploy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
    }

    .deploy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Mobile portrait: Stack vertically */
    @media (max-width: 700px) {
      .asset-selection {
        grid-template-columns: 1fr;
      }

      .vehicle-grid {
        max-height: 200px;
      }

      .risk-assessment {
        grid-template-columns: 1fr;
      }

      .deploy-btn {
        width: 100%;
      }
    }

    /* Mobile landscape: Compact 2-column layout */
    @media (max-height: 500px) and (orientation: landscape) {
      .loadout-content {
        padding: 8px;
        gap: 4px;
      }

      /* Hide secondary sections - equipment/risk are in unit card */
      .loadout-content > .section-label:not(:first-child),
      .equipment-bay,
      .risk-assessment {
        display: none;
      }

      /* Asset selection fills available space */
      .asset-selection {
        flex: 1;
      }

      .vehicle-grid {
        max-height: none;
        overflow-y: auto;
      }

      .category-tabs {
        gap: 2px;
      }

      .category-tab {
        padding: 4px 8px;
        font-size: 0.6rem;
      }

      /* Compact horizontal unit card */
      .unit-card-top {
        gap: 8px;
      }

      .unit-preview {
        padding: 4px;
      }

      .unit-preview-canvas {
        width: 70px;
        height: 70px;
      }

      .unit-name {
        font-size: 0.7rem;
      }

      .unit-variant-label {
        font-size: 0.5rem;
      }

      .stats-list {
        padding: 4px;
        gap: 2px;
      }

      .stat-bar {
        height: 4px;
      }

      .stat-label {
        font-size: 0.45rem;
        width: 22px;
      }

      .stat-value {
        font-size: 0.5rem;
        min-width: 16px;
      }

      .unit-equipment-row {
        gap: 4px;
      }

      .unit-equip-slot {
        padding: 4px 2px;
      }

      .unit-equip-icon {
        font-size: 0.8rem;
      }

      .unit-equip-label {
        font-size: 0.4rem;
      }

      .unit-deploy-btn {
        padding: 6px 10px;
        font-size: 0.65rem;
      }
    }

    /* Endless Battle Screen */
    .endless-battle-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-dark);
    }

    .endless-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg-medium);
      border-bottom: 2px solid var(--bg-light);
    }

    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .wave-display {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-orange);
    }

    .kills-display {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .score-display {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-yellow);
    }

    .endless-battlefield {
      flex: 1;
      position: relative;
      background: #1a1a2e;
    }

    .endless-controls {
      position: absolute;
      top: 60px;
      right: 10px;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      background: var(--bg-medium);
      border: 1px solid var(--bg-light);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Endless Between Waves Screen */
    .endless-between-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      background: var(--bg-dark);
      text-align: center;
    }

    .between-header h2 {
      font-size: 1.4rem;
      color: var(--accent-green);
      margin-bottom: 8px;
    }

    .between-header .score-display {
      font-size: 1.1rem;
      color: var(--accent-yellow);
    }

    .between-stats {
      margin: 20px 0;
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 16px 24px;
      min-width: 250px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.9rem;
    }

    .stat-row span:first-child {
      color: var(--text-secondary);
    }

    .boss-warning {
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.2), transparent);
      border: 2px solid var(--accent-red);
      border-radius: 8px;
      padding: 12px 20px;
      margin: 16px 0;
    }

    .boss-warning h3 {
      color: var(--accent-red);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .boss-warning p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .between-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
      max-width: 280px;
    }

    .between-actions .menu-btn.primary {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: var(--bg-dark);
    }

    .exit-btn {
      border-color: var(--accent-yellow) !important;
      color: var(--accent-yellow) !important;
    }

    .loot-preview {
      margin-top: 20px;
      padding: 12px;
      background: var(--bg-medium);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .loot-preview h4 {
      color: var(--text-secondary);
      font-size: 0.75rem;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .warning-text {
      color: var(--accent-red);
      font-size: 0.75rem;
      margin-top: 6px;
    }

    /* Endless Result Screen */
    .endless-result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      background: var(--bg-dark);
      text-align: center;
    }

    .result-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .result-header h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .result-header.exit h2 {
      color: var(--accent-green);
    }

    .result-header.death h2 {
      color: var(--accent-red);
    }

    .result-wave {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .result-loot {
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 16px 24px;
      margin: 20px 0;
      min-width: 250px;
    }

    .result-loot h4 {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .loot-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    .loot-lost {
      color: var(--accent-red);
    }

    .loot-gained {
      color: var(--accent-green);
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 250px;
    }

    /* Portrait mode adjustments for Endless */
    @media (orientation: portrait), (max-width: 600px) {
      .endless-content {
        flex-direction: column;
      }

      .options-panel {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
      }

      .preview-box {
        display: none;
      }

      .option-card {
        flex: 1;
        min-width: 140px;
      }
    }
  </style>
</head>
<body>
  <div id="app"><div style="padding:40px;text-align:center;">Loading...</div></div>

  <!-- Landscape orientation warning -->
  <div id="rotate-warning">
    <div class="rotate-content">
      <div class="rotate-icon">📱</div>
      <h2>Rotate Your Device</h2>
      <p>This game plays best in landscape mode</p>
      <button id="dismiss-rotate" onclick="this.parentElement.parentElement.style.display='none'; sessionStorage.setItem('rotateDismissed','1');">Continue Anyway</button>
    </div>
  </div>
  <script>if(sessionStorage.getItem('rotateDismissed')) document.getElementById('rotate-warning').style.display='none';</script>

  <script type="module" src="js/main.js"></script>

  <!-- Service Worker disabled for development - uncomment for production
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
  -->

  <!-- Unregister any existing service workers (run once to clean up) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(reg => {
          reg.unregister();
          console.log('SW unregistered:', reg.scope);
        });
      });
    }
  </script>
</body>
</html>
