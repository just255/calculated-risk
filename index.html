    /* ═══════════════════════════════════════════════════════════════ */
    /* Replay Theater                                                 */
    /* ═══════════════════════════════════════════════════════════════ */
    .replay-theater { max-width: 700px; margin: 0 auto; padding: 20px; }
    .replay-theater h1 { text-align: center; color: #ccc; margin-bottom: 12px; }
    .replay-tabs { display: flex; gap: 4px; margin-bottom: 16px; justify-content: center; flex-wrap: wrap; }
    .replay-tab {
      background: var(--bg-medium, #252b3d); color: var(--text-secondary, #94a3b8);
      border: 1px solid #333; border-radius: 4px; padding: 6px 14px;
      cursor: pointer; font: 500 0.8rem 'Oxanium', sans-serif; transition: all 0.15s;
    }
    .replay-tab:hover { background: var(--bg-light, #2f3749); }
    .replay-tab.active { background: var(--accent-blue, #60a5fa); color: #fff; border-color: var(--accent-blue, #60a5fa); }
    .replay-tab-count { font-size: 0.7rem; opacity: 0.7; margin-left: 4px; }
    .replay-list { display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow-y: auto; }
    .replay-card { background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; }
    .replay-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .replay-result { font-weight: bold; font-size: 1.1em; }
    .replay-mode { color: #aaa; font-size: 0.85em; padding: 1px 6px; background: #2a2a3e; border-radius: 3px; }
    .replay-seed { color: #666; font-family: monospace; }
    .replay-card.debug-save { border-color: #fb923c44; }
    .replay-debug-tag { color: #fb923c; font-size: 0.75em; font-weight: 600; padding: 1px 5px; background: #fb923c22; border: 1px solid #fb923c44; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
    .replay-card-body { display: flex; gap: 16px; color: #999; font-size: 0.9em; margin-bottom: 8px; }
    .replay-card-footer { display: flex; justify-content: space-between; align-items: center; }
    .replay-date { color: #555; font-size: 0.85em; }
    .replay-watch-btn { background: #2a4a7f; color: #fff; border: none; padding: 4px 16px; border-radius: 4px; cursor: pointer; }
    .replay-watch-btn:hover { background: #3a5a9f; }
    .replay-delete-btn { background: #4a1a1a; color: #f88; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; margin-left: 8px; }
    .replay-delete-btn:hover { background: #6a2a2a; }
    .replay-back-btn { display: block; margin: 20px auto; background: #333; color: #ccc; border: none; padding: 8px 24px; border-radius: 4px; cursor: pointer; }
    .replay-empty { text-align: center; color: #666; padding: 40px; }

    /* Replay Playback */
    .replay-playback { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; }
    .replay-playback .endless-battlefield { flex: 1; position: relative; }
    .replay-controls { background: #111; padding: 8px 16px; display: flex; flex-direction: column; gap: 4px; }
    .replay-buttons { display: flex; align-items: center; gap: 8px; }
    .replay-buttons button { background: #333; color: #ccc; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .replay-buttons button:hover { background: #444; }
    .replay-time { color: #888; font-family: monospace; margin-left: 12px; }
    .replay-timeline { padding: 0 4px; }
    .replay-timeline input[type="range"] { width: 100%; }
    .replay-speeds { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .replay-speeds button { background: #222; color: #888; border: 1px solid #333; padding: 2px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
    .replay-speeds button.active { background: #2a4a7f; color: #fff; border-color: #4a6abf; }
    .replay-exit-btn { margin-left: auto !important; background: #4a1a1a !important; color: #f88 !important; }

    /* ═════════════════════════ DEPLOY PANEL (HTML) ═════════════════════════
       Olive palette intentionally kept distinct from the rest of the site —
       it matches the in-world canvas colors so the panel feels integrated.
       Replaces the canvas-drawn deploy UI in deploy-crew.js / loadouts.js / game.js. */
    .deploy-panel {
      position: absolute;
      left: 4px; right: 4px; bottom: 4px;
      height: 60%;
      background: rgba(40, 55, 32, 0.95);
      border-top: 2px solid #8cb060;
      border-left: 1px solid rgba(140, 176, 96, 0.4);
      border-right: 1px solid rgba(140, 176, 96, 0.4);
      border-radius: 6px 6px 4px 4px;
      display: flex; flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }
    .deploy-panel.collapsed { height: auto; background: transparent; border: none; }
    .deploy-panel.collapsed .dp-header,
    .deploy-panel.collapsed .dp-body { display: none; }

    /* Header */
    .dp-header {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 8px;
      background: rgba(70, 95, 55, 0.6);
      border-bottom: 1px solid rgba(140, 176, 96, 0.4);
      flex-shrink: 0; min-height: 26px;
    }
    .dp-zone-name { font-family: 'Black Ops One', cursive; font-size: 0.78rem; letter-spacing: 1.2px; color: #e0e8d0; flex-shrink: 0; }
    .dp-mode-toggle { display: inline-flex; border: 1px solid rgba(120, 160, 80, 0.3); border-radius: 3px; overflow: hidden; margin-left: auto; }
    .dp-mode-toggle button { padding: 2px 8px; background: rgba(40, 55, 30, 0.4); color: #708060; border: none; font-family: 'Black Ops One', cursive; font-size: 0.55rem; letter-spacing: 1px; cursor: pointer; }
    .dp-mode-toggle button.active { background: rgba(100, 150, 60, 0.5); color: #e0f0c0; }
    .dp-collapse-btn { padding: 2px 8px; background: rgba(60, 80, 45, 0.5); border: 1px solid rgba(120, 160, 80, 0.3); color: #b0c0a0; border-radius: 3px; cursor: pointer; font-size: 0.58rem; }
    .dp-deploy-btn { padding: 3px 14px; background: rgba(100, 150, 60, 0.7); border: 1.5px solid #a0d060; color: #e0f0c0; border-radius: 3px; cursor: pointer; font-family: 'Black Ops One', cursive; font-size: 0.7rem; letter-spacing: 1.2px; animation: dp-pulse 1.5s infinite; }
    @keyframes dp-pulse { 0%, 100% { box-shadow: 0 0 0 rgba(160,208,96,0); } 50% { box-shadow: 0 0 12px rgba(160,208,96,0.5); } }

    /* Body grid */
    .dp-body { display: grid; grid-template-columns: 260px 1fr 1fr; gap: 6px; padding: 6px; flex: 1; min-height: 0; }
    .dp-body.with-drawer { grid-template-columns: 260px 1fr 1fr 240px; }

    .dp-col { background: rgba(28, 38, 22, 0.6); border: 1px solid rgba(80, 100, 60, 0.2); border-radius: 4px; padding: 6px; display: flex; flex-direction: column; min-height: 0; }
    .dp-col-head { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; margin-bottom: 4px; border-bottom: 1px solid rgba(100, 130, 70, 0.3); flex-shrink: 0; }
    .dp-col-title { font-family: 'Black Ops One', cursive; font-size: 0.62rem; letter-spacing: 1px; color: #b0c0a0; }
    .dp-col-count { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: #708060; margin-left: auto; }
    .dp-col-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }

    /* Preset cards */
    .preset-card { background: rgba(40, 55, 30, 0.4); border: 1px solid transparent; border-radius: 3px; padding: 5px 6px; margin-bottom: 4px; cursor: pointer; position: relative; }
    .preset-card:hover { background: rgba(60, 80, 40, 0.5); }
    .preset-card.active { background: rgba(140, 180, 90, 0.12); border-color: rgba(140, 180, 90, 0.5); }
    .preset-name { font-family: 'Oxanium', sans-serif; font-size: 0.72rem; font-weight: 700; color: #d0e0b0; }
    .preset-tagline { font-size: 0.58rem; color: #708060; margin-top: 1px; font-style: italic; }
    .preset-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .preset-icons { display: flex; gap: 1px; flex: 1; flex-wrap: nowrap; overflow: hidden; }
    .unit-ico { width: 14px; height: 14px; background: var(--bg-light); border-radius: 2px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 0.55rem; color: #b0c0a0; }
    .unit-ico.hero { background: rgba(140, 180, 90, 0.25); color: #c0d0a0; }
    .unit-ico.vehicle { background: rgba(100, 130, 70, 0.3); }
    .preset-stats { font-family: 'Share Tech Mono', monospace; font-size: 0.55rem; color: #708060; text-align: right; line-height: 1.15; }
    .preset-stats .gold { color: #d0c068; }
    .fmt-mini { width: 22px; height: 22px; background: rgba(20, 30, 18, 0.6); border-radius: 2px; flex-shrink: 0; }

    /* Squad column */
    .squad-fmt-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .squad-fmt-label { font-family: 'Black Ops One', cursive; font-size: 0.55rem; letter-spacing: 0.5px; color: #708060; }
    .squad-fmt-select { flex: 1; background: rgba(20, 30, 18, 0.7); border: 1px solid rgba(100, 130, 70, 0.3); color: #c0d0a0; padding: 3px 8px; border-radius: 2px; font-family: 'Oxanium', sans-serif; font-size: 0.65rem; font-weight: 700; cursor: pointer; }
    .squad-fmt-preview { width: 28px; height: 28px; background: rgba(20, 30, 18, 0.6); border-radius: 3px; flex-shrink: 0; }
    .lineup-list { display: flex; flex-direction: column; gap: 2px; }
    .lineup-row { display: flex; align-items: center; gap: 6px; padding: 3px 5px; background: rgba(40, 55, 30, 0.35); border-radius: 2px; font-size: 0.66rem; cursor: pointer; }
    .lineup-row:hover { background: rgba(60, 80, 40, 0.55); }
    .lineup-row.hero { background: rgba(140, 180, 90, 0.12); border-left: 2px solid var(--accent-yellow); }
    .lineup-row.selected { background: rgba(140, 180, 90, 0.2); }
    .lineup-rank { font-family: 'Share Tech Mono', monospace; font-size: 0.55rem; color: #708060; width: 28px; flex-shrink: 0; }
    .lineup-name { flex: 1; color: #c0d0a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lineup-role { font-family: 'Black Ops One', cursive; font-size: 0.5rem; color: var(--accent-blue); background: rgba(96, 165, 250, 0.12); padding: 1px 4px; border-radius: 2px; flex-shrink: 0; }
    .lineup-remove { background: none; border: none; color: var(--accent-red); opacity: 0.4; cursor: pointer; padding: 0 2px; font-size: 0.7rem; }
    .lineup-remove:hover { opacity: 1; }
    .ghost-slot { border: 1px dashed rgba(100, 130, 70, 0.25); border-radius: 2px; padding: 3px 5px; text-align: center; font-size: 0.6rem; color: #708060; font-style: italic; background: transparent; }

    /* Pool column */
    .pool-tabs { display: flex; gap: 1px; margin-bottom: 4px; flex-shrink: 0; }
    .pool-tab { flex: 1; background: rgba(40, 55, 30, 0.3); border: none; color: #708060; padding: 4px 6px; font-family: 'Black Ops One', cursive; font-size: 0.55rem; letter-spacing: 1px; cursor: pointer; border-bottom: 2px solid transparent; }
    .pool-tab.active { background: rgba(80, 110, 55, 0.5); color: #c0d0a0; border-bottom-color: rgba(140, 180, 90, 0.6); }
    .pool-group { margin-bottom: 4px; }
    .pool-group-head { display: flex; align-items: center; gap: 5px; background: rgba(40, 55, 30, 0.4); padding: 3px 5px; border-radius: 2px 2px 0 0; margin-bottom: 1px; }
    .pool-group-icon { width: 12px; height: 12px; background: var(--bg-light); border-radius: 2px; flex-shrink: 0; }
    .pool-group-name { font-family: 'Black Ops One', cursive; font-size: 0.55rem; color: #b0c0a0; letter-spacing: 0.5px; }
    .pool-group-count { font-family: 'Share Tech Mono', monospace; font-size: 0.55rem; color: #708060; margin-left: auto; }
    .pool-row { display: flex; align-items: center; gap: 5px; padding: 3px 8px; font-size: 0.65rem; cursor: pointer; border-left: 2px solid transparent; }
    .pool-row:hover { background: rgba(60, 80, 40, 0.4); }
    .pool-row.selected { background: rgba(160, 200, 110, 0.15); border-left-color: var(--accent-green); }
    .pool-row .name { flex: 1; color: #b0c0a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pool-row.selected .name { color: #d0e0b0; }
    .pool-add { background: rgba(60, 100, 50, 0.3); border: none; color: #b0c0a0; padding: 0; width: 16px; height: 16px; border-radius: 2px; cursor: pointer; font-weight: 700; flex-shrink: 0; }
    .pool-add:hover { background: rgba(100, 160, 60, 0.4); color: #c0d0a0; }
    .pool-empty { padding: 8px; text-align: center; color: #708060; font-style: italic; font-size: 0.66rem; }

    /* Drawer (inline grid column when open) */
    .dp-drawer { background: rgba(28, 38, 22, 0.97); border: 1px solid #8cb060; border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; }
    .drawer-head { display: flex; align-items: center; gap: 6px; padding-bottom: 5px; border-bottom: 1px solid rgba(100, 130, 70, 0.3); margin-bottom: 6px; }
    .drawer-title { font-family: 'Black Ops One', cursive; font-size: 0.65rem; letter-spacing: 1px; color: #c0d0a0; flex: 1; }
    .drawer-close { background: none; border: 1px solid rgba(120, 160, 80, 0.3); color: #708060; width: 18px; height: 18px; border-radius: 2px; cursor: pointer; font-size: 0.7rem; }
    .drawer-unit { font-family: 'Oxanium', sans-serif; font-size: 0.85rem; font-weight: 700; color: #d0e0b0; margin-bottom: 4px; }
    .drawer-unit-sub { font-size: 0.62rem; color: #708060; font-style: italic; margin-bottom: 8px; }
    .drawer-radar { width: 100%; height: 130px; background: rgba(20, 30, 18, 0.5); border: 1px solid rgba(100, 130, 70, 0.15); border-radius: 3px; margin-bottom: 6px; }
    .drawer-stat { display: flex; justify-content: space-between; padding: 2px 0; font-size: 0.62rem; }
    .drawer-stat-label { color: #708060; }
    .drawer-stat-val { color: #c0d0a0; font-family: 'Share Tech Mono', monospace; font-weight: 700; }

    /* Bottom zone strip */
    .dp-bottom-strip { display: flex; gap: 4px; padding: 4px; background: rgba(28, 38, 22, 0.6); border-top: 1px solid rgba(100, 130, 70, 0.2); flex-shrink: 0; }
    .zone-chip { flex: 1; background: rgba(38, 45, 32, 0.9); border: 1px solid rgba(80, 100, 65, 0.3); border-top: 2px solid #5a6e48; border-radius: 0 0 3px 3px; padding: 5px 8px; cursor: pointer; min-height: 56px; display: flex; flex-direction: column; }
    .zone-chip.selected { background: rgba(50, 70, 40, 0.92); border-top-color: #8cb060; border-left-color: rgba(140, 176, 96, 0.4); border-right-color: rgba(140, 176, 96, 0.4); }
    .zone-chip.expanded { background: rgba(70, 95, 55, 0.7); }
    .zone-chip-name { font-family: 'Black Ops One', cursive; font-size: 0.68rem; letter-spacing: 1px; color: #b0c0a0; }
    .zone-chip.selected .zone-chip-name { color: #e0e8d0; }
    .zone-chip-comp { font-size: 0.6rem; color: #708060; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .zone-chip-side { font-family: 'Share Tech Mono', monospace; font-size: 0.55rem; color: #708060; margin-top: auto; }
  </style>
</head>
<body>
  <div id="app"><div style="padding:40px;text-align:center;">Loading...</div></div>

  <!-- Landscape orientation warning -->
  <div id="rotate-warning">
    <div class="rotate-content">
      <div class="rotate-icon">📱</div>
      <h2>Rotate Your Device</h2>
      <p>This game plays best in landscape mode</p>
      <button id="dismiss-rotate" onclick="this.parentElement.parentElement.style.display='none'; sessionStorage.setItem('rotateDismissed','1');">Continue Anyway</button>
    </div>
  </div>
  <script>if(sessionStorage.getItem('rotateDismissed')) document.getElementById('rotate-warning').style.display='none';</script>

  <!-- Bypass ngrok browser warning for tunnel users -->
  <script>
    const _fetch = window.fetch;
    window.fetch = function(url, opts = {}) {
      opts.headers = opts.headers || {};
      if (opts.headers instanceof Headers) {
        opts.headers.set('ngrok-skip-browser-warning', 'true');
      } else {
        opts.headers['ngrok-skip-browser-warning'] = 'true';
      }
      return _fetch(url, opts);
    };
  </script>

  <script type="module" src="js/main.js"></script>

  <!-- Service Worker — caches all static assets after first load -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => {
          console.log('SW registered:', reg.scope);
          // When a new SW is waiting, tell it to activate immediately
          if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'activated') {
                console.log('SW updated — new cache active');
              }
            });
          });
        })
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
