      color: var(--accent-red) !important;
    }

    .defense-section {
      margin-bottom: 20px;
    }

    .defense-lanes {
      display: flex;
      gap: 10px;
    }

    .defense-slot {
      flex: 1;
      padding: 10px;
      background: var(--bg-medium);
      border: 2px solid var(--bg-light);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .defense-slot:active, .defense-slot.selected {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.1);
    }

    .defense-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .defense-unit {
      width: 36px;
      height: 36px;
      margin: 0 auto 5px;
    }

    .defense-unit svg {
      width: 100%;
      height: 100%;
    }

    .defense-name {
      font-size: 0.75rem;
      font-weight: 600;
    }

    .defense-types {
      margin-top: 5px;
      display: flex;
      justify-content: center;
      gap: 3px;
    }

    .defense-picker {
      margin-top: 15px;
      padding: 15px;
      background: var(--bg-medium);
      border-radius: 8px;
    }

    .defense-picker h4 {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .h2h-footer {
      padding: 15px;
      background: var(--bg-medium);
      border-top: 1px solid var(--bg-light);
    }

    .h2h-start {
      width: 100%;
    }

    .h2h-start.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* H2H Battle Screen */
    .h2h-battle-screen {
      background: linear-gradient(180deg, #0a0d12 0%, #1a1f2e 100%);
    }

    .h2h-battle-hud {
      padding: 10px 15px;
      background: var(--bg-medium);
      border-bottom: 1px solid var(--bg-light);
    }

    .h2h-score-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-score, .ai-score {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
    }

    .player-score {
      color: var(--accent-green);
    }

    .ai-score {
      color: var(--accent-red);
    }

    .round-indicator {
      font-family: 'Black Ops One', cursive;
      font-size: 1rem;
      color: var(--accent-blue);
    }

    .h2h-dual-field {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .ai-base, .player-base {
      padding: 10px 15px;
      background: var(--bg-medium);
    }

    .ai-base {
      border-bottom: 2px solid var(--accent-red);
    }

    .player-base {
      border-top: 2px solid var(--accent-green);
    }

    .base-label {
      font-family: 'Black Ops One', cursive;
      font-size: 0.75rem;
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .player-base .base-label {
      margin-bottom: 0;
      margin-top: 5px;
    }

    .hp-bar {
      height: 20px;
      background: var(--bg-light);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .hp-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .player-hp-fill {
      background: linear-gradient(90deg, var(--accent-green), #22c55e);
    }

    .ai-hp-fill {
      background: linear-gradient(90deg, var(--accent-red), #ef4444);
    }

    .hp-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .defense-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 8px 0;
    }

    .defender-slot {
      width: 40px;
      height: 40px;
    }

    .defender-icon {
      width: 100%;
      height: 100%;
    }

    .defender-icon svg {
      width: 100%;
      height: 100%;
    }

    .h2h-battlefield {
      flex: 1;
      display: flex;
      position: relative;
      background: linear-gradient(180deg, rgba(239,68,68,0.1) 0%, transparent 30%, transparent 70%, rgba(34,197,94,0.1) 100%);
    }

    .h2h-lane {
      flex: 1;
      border-right: 1px dashed var(--bg-light);
    }

    .h2h-lane:last-child {
      border-right: none;
    }

    .h2h-unit {
      position: absolute;
      width: 40px;
      height: 40px;
    }

    .h2h-unit svg {
      width: 100%;
      height: 100%;
    }

    .player-attacker {
      filter: drop-shadow(0 0 4px var(--accent-green));
    }

    .ai-attacker {
      filter: drop-shadow(0 0 4px var(--accent-red));
    }

    /* H2H Result Screen */
    .h2h-result-screen, .h2h-match-end-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0f1319 0%, #1a1f2e 100%);
    }

    .result-content, .match-end-content {
      text-align: center;
      padding: 30px;
    }

    .round-complete, .match-result {
      font-family: 'Black Ops One', cursive;
      font-size: 1.8rem;
      margin-bottom: 30px;
    }

    .hp-comparison {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .hp-side {
      padding: 15px 25px;
      background: var(--bg-medium);
      border-radius: 8px;
      border: 2px solid var(--bg-light);
    }

    .hp-side.winner {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.1);
    }

    .hp-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .hp-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .vs-divider {
      font-family: 'Black Ops One', cursive;
      color: var(--text-secondary);
    }

    .round-winner {
      font-family: 'Black Ops One', cursive;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .round-winner.player-win {
      color: var(--accent-green);
    }

    .round-winner.ai-win {
      color: var(--accent-red);
    }

    .match-score {
      margin-bottom: 30px;
    }

    .match-score .score-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .match-score .score-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
    }

    .h2h-match-end-screen.victory .match-result {
      color: var(--accent-green);
    }

    .h2h-match-end-screen.defeat .match-result {
      color: var(--accent-red);
    }

    .final-score {
      margin-bottom: 20px;
    }

    .final-score .score-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .final-score .score-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2.5rem;
      font-weight: 700;
    }

    .match-summary {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    /* ===== SPRITE EDITOR ===== */
    .sprite-editor-screen {
      background: var(--bg-dark);
      overflow: hidden;
    }

    .se-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      background: var(--bg-medium);
      border-bottom: 2px solid var(--accent-green);
      flex-shrink: 0;
    }

    .se-header h2 {
      font-family: 'Black Ops One', cursive;
      font-size: 1.1rem;
      margin-right: auto;
    }

    .se-tools {
      display: flex;
      gap: 4px;
    }

    .se-tool {
      width: 32px;
      height: 32px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .se-tool:hover {
      border-color: var(--text-secondary);
    }

    .se-tool.active {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #000;
    }

    .se-actions {
      display: flex;
      gap: 4px;
      margin-left: 10px;
    }

    .se-btn {
      padding: 6px 10px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .se-btn:hover {
      border-color: var(--text-secondary);
    }

    .se-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .se-canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0d12;
      overflow: auto;
      position: relative;
      padding: 20px;
    }

    .se-canvas-area.panning {
      cursor: grabbing;
    }

    .se-canvas-wrapper {
      position: relative;
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #222 0% 50%) 50% / 16px 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      transform-origin: center center;
    }

    .se-canvas-wrapper canvas {
      position: absolute;
      top: 0;
      left: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #seRefCanvas {
      opacity: 0.4;
      pointer-events: none;
    }

    #seDrawCanvas {
      cursor: crosshair;
    }

    .sprite-editor-screen[data-tool="fill"] #seDrawCanvas {
      cursor: cell;
    }

    .sprite-editor-screen[data-tool="select"] #seDrawCanvas {
      cursor: default;
    }

    #sePreviewCanvas {
      pointer-events: none;
    }

    .se-panel {
      width: 220px;
      background: var(--bg-medium);
      border-left: 1px solid var(--bg-light);
      overflow-y: auto;
      flex-shrink: 0;
    }

    .se-section {
      padding: 12px;
      border-bottom: 1px solid var(--bg-light);
    }

    .se-section-title {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .se-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .se-row:last-child {
      margin-bottom: 0;
    }

    .se-row label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .se-row input[type="number"] {
      width: 55px;
      padding: 4px 6px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
    }

    .se-row input[type="color"] {
      width: 32px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      cursor: pointer;
    }

    .se-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent-green);
    }

    .se-row input[type="checkbox"] {
      accent-color: var(--accent-green);
    }

    .se-btn-full {
      width: 100%;
      padding: 8px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.75rem;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .se-btn-full:last-child {
      margin-bottom: 0;
    }

    .se-btn-full:hover {
      border-color: var(--accent-green);
    }

    .se-btn-full.se-primary {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #000;
      font-weight: 700;
    }

    .se-btn-small {
      padding: 4px 8px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-secondary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.65rem;
      cursor: pointer;
    }

    .se-btn-small:hover {
      border-color: var(--text-secondary);
    }

    #seUnitSelect, #seStateSelect {
      width: 100%;
      padding: 6px 8px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }

    .se-row #seStateSelect {
      flex: 1;
      margin-bottom: 0;
    }

    .se-row input[type="text"] {
      padding: 4px 6px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.75rem;
    }

    .se-frames {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .se-frame {
      width: 50px;
      height: 50px;
      background: var(--bg-dark);
      border: 2px solid var(--bg-light);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .se-frame:hover {
      border-color: var(--text-secondary);
    }

    .se-frame.active {
      border-color: var(--accent-green);
    }

    .se-frame canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .se-frame span {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      color: var(--text-secondary);
    }

    .se-frame-del {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      background: var(--accent-red);
      border: none;
      border-radius: 2px;
      color: #fff;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .se-frame:hover .se-frame-del {
      opacity: 1;
    }

    .se-preview-box {
      margin-top: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .se-preview-box canvas {
      max-width: 100%;
      max-height: 80px;
      image-rendering: pixelated;
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #222 0% 50%) 50% / 8px 8px;
    }

    /* ===== UNIT CUSTOMIZER ===== */
    .unit-customizer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-medium);
      border-top: 2px solid var(--accent-blue);
      z-index: 100;
      max-height: 70%;
      display: flex;
      flex-direction: column;
    }

    .unit-customizer.collapsed .uc-content {
      display: none;
    }

    .unit-customizer.collapsed {
      max-height: auto;
    }

    .uc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      background: var(--bg-light);
      cursor: pointer;
    }

    .uc-header h3 {
      font-family: 'Black Ops One', cursive;
      font-size: 0.9rem;
      color: var(--accent-blue);
      margin: 0;
    }

    .uc-toggle {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .unit-customizer.collapsed .uc-toggle {
      transform: rotate(180deg);
    }

    .uc-content {
      padding: 15px;
      overflow-y: auto;
      flex: 1;
    }

    .uc-unit-select {
      margin-bottom: 15px;
    }

    .uc-unit-select label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .uc-unit-select select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.85rem;
    }

    .uc-preview {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: var(--bg-dark);
      border-radius: 8px;
      margin-bottom: 15px;
      min-height: 120px;
    }

    .uc-preview-svg {
      width: 100px;
      height: 100px;
    }

    .uc-preview-svg svg {
      width: 100%;
      height: 100%;
    }

    .uc-parts {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .uc-part-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-dark);
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }

    .uc-part-row:hover {
      border-color: var(--bg-light);
    }

    .uc-part-row.selected {
      border-color: var(--accent-blue);
      background: rgba(96, 165, 250, 0.1);
    }

    .uc-part-name {
      flex: 1;
      font-size: 0.8rem;
      text-transform: capitalize;
    }

    .uc-part-color {
      width: 36px;
      height: 24px;
      border-radius: 4px;
      border: 2px solid var(--bg-light);
    }

    .uc-color-input {
      width: 36px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .uc-actions {
      display: flex;
      gap: 10px;
    }

    .uc-actions .se-btn-full {
      flex: 1;
      margin-bottom: 0;
    }

    /* ═══════════════════════════════════════════════════════════════
       CAMPAIGN MODE STYLES
       ═══════════════════════════════════════════════════════════════ */

    /* Campaign screen - Landscape */
    .campaign-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }

    .campaign-screen h2 {
      font-family: 'Black Ops One', cursive;
      font-size: 1.5rem;
      margin: 0;
    }

    .campaign-screen .subtitle {
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .era-list, .mos-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 700px;
    }

    .era-btn, .mos-btn {
      background: var(--bg-light);
      border: 2px solid var(--bg-lighter);
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      min-width: 150px;
    }

    .era-btn:hover, .mos-btn:hover {
      border-color: var(--accent-blue);
      transform: scale(1.02);
    }

    .era-name, .mos-name {
      font-weight: bold;
      color: var(--accent-yellow);
      font-size: 0.95rem;
    }

    .era-period, .mos-style {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .mos-btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .mos-locked {
      color: var(--accent-red);
      font-size: 0.75rem;
    }

    /* ═══════════════════════════════════════════════════════════════
       CAMPAIGN PLANNING SCREEN - 3 Column Landscape Layout
       ═══════════════════════════════════════════════════════════════ */

    .planning-screen {
      display: flex;
      flex-direction: row;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* === LEFT PANEL: Units === */
    .plan-left-panel {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(20, 25, 35, 0.98);
      border-right: 2px solid var(--accent-blue);
      overflow-y: auto;
    }

    .plan-left-panel .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(74, 158, 255, 0.15);
      border-bottom: 1px solid rgba(74, 158, 255, 0.3);
    }

    .plan-left-panel .panel-header h2 {
      font-family: 'Black Ops One', cursive;
      font-size: 1rem;
      color: var(--accent-blue);
      margin: 0;
    }

    .plan-left-panel .back-btn {
      background: none;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .plan-left-panel .back-btn:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    /* Unit Detail Card */
    .unit-detail-card {
      background: rgba(40, 45, 60, 0.9);
      border-bottom: 1px solid #444;
      padding: 10px;
    }

    .unit-detail-card.path-mode {
      background: rgba(76, 175, 80, 0.2);
      border-color: var(--accent-green);
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .detail-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .detail-icon svg, .detail-svg {
      width: 100%;
      height: 100%;
    }

    .detail-icon.hero-icon {
      font-size: 32px;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-info {
      flex: 1;
      min-width: 0;
    }

    .detail-name {
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .detail-pos, .detail-stats {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .detail-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .detail-close:hover {
      color: var(--accent-red);
    }

    .detail-hint {
      font-size: 0.7rem;
      color: var(--accent-blue);
      text-align: center;
      padding: 4px;
      background: rgba(74, 158, 255, 0.1);
      border-radius: 4px;
    }

    /* Placement Mode Stack */
    .placement-mode-stack {
      margin: 10px 0;
      padding: 8px;
      background: var(--bg-dark);
      border-radius: 6px;
      border: 1px solid var(--bg-lighter);
    }

    .mode-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .mode-buttons {
      display: flex;
      gap: 6px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 6px;
      background: var(--bg-light);
      border: 2px solid var(--bg-lighter);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn:hover {
      background: var(--bg-lighter);
      border-color: var(--text-secondary);
    }

    .mode-btn.active {
      background: rgba(74, 158, 255, 0.2);
      border-color: var(--accent-blue);
      box-shadow: 0 0 8px rgba(74, 158, 255, 0.4);
    }

    .mode-btn[data-mode="primary"].active {
      background: rgba(76, 175, 80, 0.2);
      border-color: #4caf50;
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.4);
    }

    .mode-btn[data-mode="advance"].active {
      background: rgba(33, 150, 243, 0.2);
      border-color: #2196f3;
      box-shadow: 0 0 8px rgba(33, 150, 243, 0.4);
    }

    .mode-btn[data-mode="fallback"].active {
      background: rgba(255, 193, 7, 0.2);
      border-color: #ffc107;
      box-shadow: 0 0 8px rgba(255, 193, 7, 0.4);
    }

    .mode-icon {
      font-size: 1.4rem;
      display: block;
      text-align: center;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .action-btn {
      flex: 1;
      min-width: 60px;
      padding: 6px 8px;
      background: var(--bg-light);
      border: 1px solid var(--bg-lighter);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 0.7rem;
      cursor: pointer;
    }

    .action-btn:hover {
      border-color: var(--accent-blue);
    }

    .action-btn.remove {
      background: rgba(255, 68, 68, 0.2);
      border-color: rgba(255, 68, 68, 0.4);
    }

    .action-btn.remove:hover {
      background: rgba(255, 68, 68, 0.4);
    }

    .stance-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stance-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .stance-btn {
      padding: 4px 8px;
      background: var(--bg-light);
      border: 1px solid var(--bg-lighter);
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .stance-btn.active {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.2);
    }

    .path-mode-controls {
      text-align: center;
    }

    .path-hint {
      font-size: 0.75rem;
      color: var(--accent-green);
      margin-bottom: 8px;
    }

    .path-btns {
      display: flex;
      gap: 8px;
    }

    .btn-cancel, .btn-confirm {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-cancel {
      background: var(--bg-light);
      color: var(--text-secondary);
    }

    .btn-confirm {
      background: var(--accent-green);
      color: #000;
    }

    /* === DETAILS PANEL (New Planning UI) === */
    .details-panel {
      padding: 12px;
      background: rgba(40, 45, 60, 0.9);
      border-bottom: 1px solid #444;
    }

    .details-panel.empty {
      color: var(--text-secondary);
    }

    .details-panel .instructions {
      text-align: center;
      padding: 16px 0;
    }

    .details-panel .instruction-main {
      font-size: 0.9rem;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .details-panel .instruction-sub {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .details-panel .unit-summary {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #444;
    }

    .details-panel .unit-summary h4,
    .details-panel .position-legend h4 {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .details-panel .summary-text {
      font-size: 0.85rem;
    }

    .details-panel .position-legend {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #444;
    }

    .details-panel .legend-row {
      font-size: 0.75rem;
      padding: 3px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-panel .legend-icon {
      width: 20px;
      text-align: center;
    }

    .details-panel .legend-icon.primary { color: #4caf50; }
    .details-panel .legend-icon.advance { color: #2196f3; }
    .details-panel .legend-icon.fallback { color: #ffc107; }

    .details-panel.selected {
      border-left: 3px solid var(--accent-blue);
    }

    .placement-positions {
      margin: 10px 0;
    }

    .placement-positions .pos-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      font-size: 0.75rem;
    }

    .placement-positions .pos-icon {
      width: 18px;
      text-align: center;
    }

    .placement-positions .pos-label {
      color: var(--text-secondary);
      width: 60px;
    }

    .placement-positions .pos-value {
      color: var(--text-primary);
    }

    .placement-positions .pos-row.primary .pos-icon { color: #4caf50; }
    .placement-positions .pos-row.advance .pos-icon { color: #2196f3; }
    .placement-positions .pos-row.fallback .pos-icon { color: #ffc107; }

    .placement-hint {
      font-size: 0.7rem;
      color: var(--accent-blue);
      text-align: center;
      padding: 6px;
      background: rgba(74, 158, 255, 0.1);
      border-radius: 4px;
      margin-top: 8px;
    }

    /* === COLLAPSIBLE SECTIONS === */
    .collapsible-section {
      border-bottom: 1px solid #444;
    }

    .collapsible-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
      background: rgba(40, 45, 60, 0.6);
      user-select: none;
    }

    .collapsible-header:hover {
      background: rgba(50, 55, 70, 0.8);
    }

    .collapse-icon {
      font-size: 0.7rem;
      color: var(--text-secondary);
      width: 12px;
    }

    .collapse-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-primary);
      flex: 1;
    }

    .collapse-summary {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .collapsible-content {
      overflow: hidden;
      transition: max-height 0.2s ease-out;
    }

    .collapsible-section.collapsed .collapsible-content {
      max-height: 0;
      padding: 0;
    }

    .collapsible-section.expanded .collapsible-content {
      max-height: 500px;
      padding: 8px 12px;
    }

    /* === ROSTER LIST (in collapsible) === */
    .roster-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .roster-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(60, 65, 80, 0.5);
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: grab;
      user-select: none;
    }

    .roster-item:hover {
      background: rgba(70, 75, 90, 0.7);
      border-color: var(--accent-blue);
    }

    .roster-item:active {
      cursor: grabbing;
    }

    .roster-item.dragging {
      opacity: 0.5;
    }

    .roster-icon {
      font-size: 1.1rem;
    }

    .roster-name {
      flex: 1;
      font-size: 0.8rem;
      color: var(--text-primary);
    }

    .roster-count {
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 10px;
    }

    .roster-empty {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
      padding: 8px;
    }

    .roster-hint {
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-align: center;
      padding: 4px;
      margin-top: 4px;
    }

    /* === CONTEXT MENU (Long-press / Right-click) === */
    .context-menu {
      position: fixed;
      background: rgba(30, 35, 45, 0.98);
      border: 1px solid #555;
      border-radius: 8px;
      padding: 4px;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      min-width: 120px;
    }

    .ctx-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      width: 100%;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .ctx-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .ctx-btn.cancel {
      color: var(--text-secondary);
      border-top: 1px solid #444;
      margin-top: 4px;
      padding-top: 10px;
    }

    .ctx-icon {
      font-size: 1.1rem;
    }

    .ctx-label {
      flex: 1;
    }

    /* Roster Section */
    .roster-section {
      padding: 10px;
      flex: 1;
    }

    .roster-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .roster-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px;
      background: var(--bg-light);
      border: 2px solid var(--bg-lighter);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .roster-unit:hover {
      border-color: var(--accent-blue);
    }

    .roster-unit.selected {
      border-color: var(--accent-yellow);
      background: rgba(255, 204, 0, 0.2);
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
    }

    .roster-unit-icon {
      width: 32px;
      height: 32px;
    }

    .roster-unit-icon svg, .roster-svg {
      width: 100%;
      height: 100%;
    }

    .roster-unit-icon.hero-icon {
      font-size: 24px;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .roster-unit-name {
      font-size: 0.6rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .roster-unit-count {
      font-size: 0.7rem;
      color: var(--accent-yellow);
      font-weight: bold;
    }

    /* Tactic Section */
    .tactic-section {
      padding: 0 10px 10px;
      border-top: 1px solid #333;
    }

    .tactic-section h3 {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin: 8px 0;
    }

    .doctrine-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .doctrine-btn {
      padding: 6px 10px;
      background: var(--bg-light);
      border: 1px solid var(--bg-lighter);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .doctrine-btn:hover {
      border-color: var(--accent-blue);
    }

    .doctrine-btn.selected {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.2);
    }

    .doctrine-name {
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--text-primary);
    }

    .doctrine-desc {
      display: none;
    }

    /* Plan Actions */
    .plan-actions {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #333;
      margin-top: auto;
    }

    .btn-clear {
      flex: 0;
      padding: 10px 12px;
      background: var(--bg-light);
      border: 1px solid var(--text-secondary);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-clear:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn-deploy {
      flex: 1;
      padding: 10px 16px;
      background: var(--accent-green);
      border: none;
      border-radius: 4px;
      color: #000;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-deploy:hover {
      background: #5be090;
    }

    /* === CENTER: Map Grid === */
    .plan-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: linear-gradient(to bottom,
        rgba(255,50,50,0.1) 0%,
        rgba(100,100,100,0.05) 40%,
        rgba(50,100,255,0.1) 100%
      );
    }

    .planning-grid-viewport {
      flex: 1;
      overflow: hidden;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: none; /* Enable custom pinch zoom and pan */
    }

    .planning-grid-viewport:active {
      cursor: grabbing;
    }

    .planning-grid {
      display: grid;
      gap: 1px;
      background: rgba(0,0,0,0.3);
      border: 2px solid #444;
      border-radius: 4px;
      padding: 2px;
      transform-origin: center center;
    }

    .grid-controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(30,30,40,0.9);
      padding: 4px 6px;
      border-radius: 16px;
      z-index: 10;
    }

    .grid-ctrl-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: var(--bg-lighter);
      color: var(--text-primary);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid-ctrl-btn:hover {
      background: var(--accent-blue);
    }

    .grid-zoom-level {
      font-size: 0.7rem;
      color: var(--text-secondary);
      min-width: 35px;
      text-align: center;
    }

    .map-help {
      padding: 6px 12px;
      background: rgba(0,0,0,0.6);
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* === RIGHT PANEL: Enemy Intel === */
    .plan-right-panel {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(35, 20, 20, 0.98);
      border-left: 2px solid var(--accent-red);
      overflow-y: auto;
    }

    .plan-right-panel .panel-header {
      padding: 10px 12px;
      background: rgba(255, 68, 68, 0.15);
      border-bottom: 1px solid rgba(255, 68, 68, 0.3);
    }

    .plan-right-panel .panel-header h2 {
      font-family: 'Black Ops One', cursive;
      font-size: 0.9rem;
      color: var(--accent-red);
      margin: 0;
    }

    .intel-section {
      padding: 12px;
      border-bottom: 1px solid #333;
    }

    .intel-progress-bar {
      position: relative;
      height: 20px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .intel-progress-bar .intel-fill {
      height: 100%;
      background: linear-gradient(to right, #c33, #f55);
      transition: width 0.3s;
    }

    .intel-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.7rem;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 3px black;
    }

    .scout-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(to bottom, #c33, #922);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .scout-btn:hover {
      background: linear-gradient(to bottom, #d44, #a33);
    }

    .intel-hint {
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-align: center;
      margin: 0;
    }

    .enemy-list {
      padding: 10px;
      flex: 1;
    }

    .enemy-list h3 {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin: 0 0 8px 0;
    }

    .enemy-units {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .enemy-unit {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      background: rgba(255, 68, 68, 0.1);
      border-radius: 4px;
    }

    .enemy-icon {
      width: 24px;
      height: 24px;
    }

    .enemy-icon svg, .enemy-svg {
      width: 100%;
      height: 100%;
      filter: hue-rotate(180deg) saturate(1.5);
    }

    .enemy-name {
      font-size: 0.75rem;
      color: var(--text-primary);
    }

    .no-intel {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
      padding: 20px 10px;
      font-style: italic;
    }

    .threat-section {
      padding: 10px;
      border-top: 1px solid #333;
    }

    .threat-section h3 {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin: 0 0 8px 0;
    }

    .threat-level {
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .threat-level.unknown {
      background: rgba(255, 200, 50, 0.2);
      color: var(--accent-yellow);
    }

    .threat-level.medium {
      background: rgba(255, 150, 50, 0.2);
      color: var(--accent-orange);
    }

    .threat-level.known {
      background: rgba(74, 222, 128, 0.2);
      color: var(--accent-green);
    }

    /* Grid cells */
    .plan-cell {
      width: 32px;
      height: 32px;
      background: rgba(40,40,60,0.6);
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      position: relative;
    }

    .plan-cell:hover {
      background: rgba(60,60,90,0.8);
    }

    .plan-cell.player-zone {
      background: rgba(74, 158, 255, 0.2);
    }

    .plan-cell.player-zone:hover {
      background: rgba(74, 158, 255, 0.4);
    }

    .plan-cell.enemy-zone {
      background: rgba(255, 68, 68, 0.2);
    }

    .plan-cell.no-mans-land {
      background: rgba(80, 80, 80, 0.15);
    }

    .plan-cell.hero-cell {
      background: rgba(255, 204, 0, 0.4);
      box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.6);
    }

    .plan-hero {
      font-size: 22px;
      color: var(--accent-yellow);
      text-shadow: 0 0 12px rgba(255, 204, 0, 0.9);
    }

    .plan-unit {
      width: 26px;
      height: 26px;
    }

    .plan-unit svg, .plan-unit-svg {
      width: 100%;
      height: 100%;
    }

    .plan-unit.enemy {
      filter: hue-rotate(180deg) saturate(1.5);
    }

    .plan-unit.waypoint-selected {
      outline: 2px solid #4caf50;
      outline-offset: 2px;
      animation: pulse-outline 1s ease-in-out infinite;
    }

    .plan-unit.has-waypoints::after {
      content: '';
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
      border: 1px solid #1a1a1a;
    }

    .waypoint-marker {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background: rgba(76, 175, 80, 0.8);
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    /* Selected unit's waypoints - blue color to match selection */
    .waypoint-marker.selected-waypoint {
      background: rgba(96, 165, 250, 0.95);
      border-color: #fff;
      box-shadow: 0 0 8px rgba(96, 165, 250, 0.8);
    }

    @keyframes pulse-outline {
      0%, 100% { outline-color: #4caf50; }
      50% { outline-color: #81c784; }
    }

    /* === SELECTED PLACED UNIT === */
    .plan-cell.selected-placed-unit {
      outline: 2px solid var(--accent-blue);
      outline-offset: -2px;
      z-index: 20;
    }

    .plan-cell.selected-placed-unit.path-mode-origin {
      outline-color: var(--accent-green);
      outline-width: 3px;
    }

    .plan-cell.selected-placed-unit.path-mode-origin::after {
      content: 'START';
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-green);
      color: var(--bg-dark);
      font-size: 8px;
      font-weight: bold;
      padding: 2px 4px;
      border-radius: 3px;
      z-index: 25;
      white-space: nowrap;
    }

    .plan-unit.unit-selected {
      filter: drop-shadow(0 0 4px var(--accent-blue));
    }

    .plan-unit.unit-selected.path-mode {
      filter: drop-shadow(0 0 6px var(--accent-green));
    }

    /* === SELECTED UNIT'S SAVED WAYPOINTS === */
    .plan-cell.selected-unit-waypoint::before {
      content: '';
      position: absolute;
      inset: 2px;
      background: rgba(96, 165, 250, 0.3);
      border: 2px solid rgba(96, 165, 250, 0.7);
      border-radius: 4px;
      animation: pulse-waypoint 1.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 5;
    }

    .plan-cell.selected-unit-waypoint-target::before {
      background: rgba(96, 165, 250, 0.5);
      border: 2px solid var(--accent-blue);
    }

    .plan-cell.selected-unit-waypoint-target::after {
      content: 'END';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-blue);
      color: white;
      font-size: 7px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 3px;
      z-index: 25;
      white-space: nowrap;
    }

    @keyframes pulse-waypoint {
      0%, 100% {
        background: rgba(96, 165, 250, 0.2);
        border-color: rgba(96, 165, 250, 0.6);
      }
      50% {
        background: rgba(96, 165, 250, 0.4);
        border-color: rgba(96, 165, 250, 1);
      }
    }

    /* === DESTINATION MARKERS (Border-only, terrain visible) === */
    .dest-marker {
      position: absolute;
      inset: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      border: 3px solid transparent;
      z-index: 10;
      pointer-events: auto;
      cursor: grab;
      animation: pulse-border 1.5s ease-in-out infinite;
      /* NO BACKGROUND - terrain shows through */
      background: none !important;
      background-color: transparent !important;
    }

    .dest-marker:active {
      cursor: grabbing;
    }

    .dest-marker.primary {
      border-color: rgba(76, 175, 80, 0.9);
    }

    .dest-marker.advance {
      border-color: rgba(33, 150, 243, 0.9);
    }

    .dest-marker.fallback {
      border-color: rgba(255, 193, 7, 0.9);
    }

    .dest-marker.selected {
      box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.7);
      animation: pulse-border-selected 1s ease-in-out infinite;
    }

    .dest-marker.in-spawn-zone {
      opacity: 0.6;
      border-style: dashed;
    }

    .dest-marker.dragging {
      opacity: 0.5;
      border-style: dotted;
    }

    /* Unit SVG in marker */
    .dest-marker .dest-unit-svg {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }

    /* Position type icon in corner */
    .dest-marker .marker-type-icon {
      position: absolute;
      bottom: -4px;
      right: -4px;
      font-size: 10px;
      opacity: 0.9;
      text-shadow: 0 0 3px rgba(0,0,0,0.9);
      background: rgba(0,0,0,0.6);
      border-radius: 3px;
      padding: 1px 3px;
      line-height: 1;
    }

    @keyframes pulse-border {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes pulse-border-selected {
      0%, 100% { box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.7); }
      50% { box-shadow: 0 0 20px 6px rgba(255, 255, 255, 0.9); }
    }

    .dest-unit-svg {
      width: 22px;
      height: 22px;
    }

    .support-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ff9800;
      color: #000;
      font-size: 8px;
      font-weight: bold;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #fff;
    }

    /* Spawn point marker */
    .plan-cell.spawn-point {
      background: rgba(156, 39, 176, 0.3) !important;
      border: 2px dashed #9c27b0 !important;
    }

    .spawn-marker {
      color: #9c27b0;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
    }

    /* Placement mode buttons */
    .placement-mode-btns {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }

    .placement-mode-btn {
      flex: 1;
      padding: 6px 4px;
      font-size: 10px;
      border: 1px solid #444;
      background: rgba(30, 30, 40, 0.8);
      color: #aaa;
      border-radius: 4px;
      cursor: pointer;
    }

    .placement-mode-btn.active {
      color: #fff;
    }

    .placement-mode-btn.primary.active {
      background: rgba(76, 175, 80, 0.3);
      border-color: #4caf50;
      color: #4caf50;
    }

    .placement-mode-btn.advance.active {
      background: rgba(33, 150, 243, 0.3);
      border-color: #2196f3;
      color: #2196f3;
    }

    .placement-mode-btn.fallback.active {
      background: rgba(255, 193, 7, 0.3);
      border-color: #ffc107;
      color: #ffc107;
    }

    /* Compact stacked placement mode buttons */
    .placement-mode-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .pm-btn {
      width: 100%;
      height: 32px;
      border-radius: 6px;
      border: 2px solid transparent;
      background: rgba(40, 40, 50, 0.8);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pm-btn:hover {
      filter: brightness(1.2);
    }

    .pm-btn.primary { border-color: rgba(76, 175, 80, 0.5); }
    .pm-btn.advance { border-color: rgba(33, 150, 243, 0.5); }
    .pm-btn.fallback { border-color: rgba(255, 193, 7, 0.5); }

    .pm-btn.primary.active {
      background: rgba(76, 175, 80, 0.4);
      border-color: #4caf50;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
    }

    .pm-btn.advance.active {
      background: rgba(33, 150, 243, 0.4);
      border-color: #2196f3;
      box-shadow: 0 0 10px rgba(33, 150, 243, 0.5);
    }

    .pm-btn.fallback.active {
      background: rgba(255, 193, 7, 0.4);
      border-color: #ffc107;
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
    }

    /* Placement detail panel */
    .placement-detail .placement-positions {
      margin: 8px 0;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
    }

    .placement-detail .pos-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 11px;
    }

    .placement-detail .pos-row.primary .pos-label { color: #4caf50; }
    .placement-detail .pos-row.advance .pos-label { color: #2196f3; }
    .placement-detail .pos-row.fallback .pos-label { color: #ffc107; }

    .placement-detail .pos-value {
      color: #888;
      font-family: 'Share Tech Mono', monospace;
    }

    .placement-detail .support-toggle {
      border: 1px solid #ff9800;
      color: #ff9800;
    }

    .placement-detail .support-toggle.active {
      background: rgba(255, 152, 0, 0.3);
      color: #ffc107;
    }

    .placement-detail .placement-hint {
      margin-top: 8px;
      padding: 6px;
      background: rgba(33, 150, 243, 0.1);
      border: 1px dashed rgba(33, 150, 243, 0.3);
      border-radius: 4px;
      font-size: 10px;
      color: #2196f3;
      text-align: center;
    }

    /* Selected placement highlight */
    .plan-cell.selected-placement {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5) !important;
    }

    /* Underglow effect for selected unit's markers */
    .dest-marker.underglow {
      box-shadow:
        0 0 15px 5px currentColor,
        0 0 30px 10px currentColor,
        inset 0 0 10px rgba(255, 255, 255, 0.3);
      animation: underglow-pulse 1.5s ease-in-out infinite;
    }

    .dest-marker.primary.underglow {
      box-shadow:
        0 0 15px 5px rgba(76, 175, 80, 0.8),
        0 0 30px 10px rgba(76, 175, 80, 0.4),
        inset 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .dest-marker.advance.underglow {
      box-shadow:
        0 0 15px 5px rgba(33, 150, 243, 0.8),
        0 0 30px 10px rgba(33, 150, 243, 0.4),
        inset 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .dest-marker.fallback.underglow {
      box-shadow:
        0 0 15px 5px rgba(255, 193, 7, 0.8),
        0 0 30px 10px rgba(255, 193, 7, 0.4),
        inset 0 0 10px rgba(255, 255, 255, 0.3);
    }

    @keyframes underglow-pulse {
      0%, 100% { filter: brightness(1); transform: scale(1); }
      50% { filter: brightness(1.2); transform: scale(1.05); }
    }

    /* Position type selection popup */
    .position-popup {
      position: fixed;
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(20, 20, 30, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      transform: translateX(-50%);
      animation: popup-appear 0.15s ease-out;
    }

    @keyframes popup-appear {
      from { opacity: 0; transform: translateX(-50%) scale(0.8); }
      to { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    .pos-popup-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: rgba(60, 60, 70, 0.8);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pos-popup-btn:hover {
      transform: scale(1.1);
    }

    .pos-popup-btn.primary {
      border-color: #4caf50;
    }
    .pos-popup-btn.primary:hover {
      background: rgba(76, 175, 80, 0.4);
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
    }

    .pos-popup-btn.advance {
      border-color: #2196f3;
    }
    .pos-popup-btn.advance:hover {
      background: rgba(33, 150, 243, 0.4);
      box-shadow: 0 0 15px rgba(33, 150, 243, 0.6);
    }

    .pos-popup-btn.fallback {
      border-color: #ffc107;
    }
    .pos-popup-btn.fallback:hover {
      background: rgba(255, 193, 7, 0.4);
      box-shadow: 0 0 15px rgba(255, 193, 7, 0.6);
    }

    .pos-popup-btn .pos-icon {
      font-size: 22px;
    }

    .pos-popup-close {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(100, 100, 110, 0.8);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      position: absolute;
      top: -8px;
      right: -8px;
    }

    .pos-popup-close:hover {
      background: #f44336;
    }

    /* === PATH VISUALIZATION (in path-set mode) === */
    .plan-cell.in-path {
      position: relative;
    }

    .plan-cell.in-path::before {
      content: '';
      position: absolute;
      inset: 2px;
      background: rgba(248, 113, 113, 0.4);
      border: 2px solid rgba(248, 113, 113, 0.8);
      border-radius: 4px;
      animation: pulse-path 1s ease-in-out infinite;
      pointer-events: none;
      z-index: 5;
    }

    .plan-cell.path-target::before {
      background: rgba(248, 113, 113, 0.6);
      border: 2px solid #f87171;
    }

    .path-marker {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background: rgba(248, 113, 113, 0.9);
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes pulse-path {
      0%, 100% {
        background: rgba(248, 113, 113, 0.3);
        border-color: rgba(248, 113, 113, 0.7);
      }
      50% {
        background: rgba(248, 113, 113, 0.5);
        border-color: rgba(248, 113, 113, 1);
      }
    }

    /* === PLACED UNIT PANEL === */
    .placed-unit-panel {
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--bg-light);
    }

    .placed-unit-panel.path-mode {
      border-color: var(--accent-red);
      box-shadow: 0 0 10px rgba(248, 113, 113, 0.3);
    }

    .placed-unit-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .placed-unit-icon {
      width: 40px;
      height: 40px;
      background: var(--bg-dark);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .placed-unit-icon svg {
      width: 100%;
      height: 100%;
    }

    .placed-unit-info {
      flex: 1;
    }

    .placed-unit-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .placed-unit-pos {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: 'Share Tech Mono', monospace;
    }

    .placed-unit-close {
      width: 28px;
      height: 28px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placed-unit-close:hover {
      background: var(--accent-red);
      color: white;
    }

    .placed-unit-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .placed-action-btn {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .placed-action-btn:hover {
      border-color: var(--accent-blue);
      background: rgba(96, 165, 250, 0.1);
    }

    .placed-action-btn.remove-btn:hover {
      border-color: var(--accent-red);
      background: rgba(248, 113, 113, 0.1);
    }

    .placed-action-btn .btn-icon {
      font-size: 1rem;
    }

    .placed-action-btn .path-count {
      font-size: 0.7rem;
      color: var(--accent-green);
    }

    /* Stance Selector */
    .stance-selector {
      margin-top: 8px;
    }

    .stance-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stance-options {
      display: flex;
      gap: 6px;
    }

    .stance-btn {
      flex: 1;
      padding: 8px 6px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-light);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .stance-btn:hover {
      border-color: var(--accent-blue);
    }

    .stance-btn.active {
      background: rgba(96, 165, 250, 0.2);
      border-color: var(--accent-blue);
      color: var(--text-primary);
    }

    /* Path Set Mode Controls */
    .path-set-controls {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 6px;
      padding: 12px;
    }

    .path-set-hint {
      font-size: 0.85rem;
      color: var(--accent-red);
      margin-bottom: 10px;
      text-align: center;
    }

    .path-set-btns {
      display: flex;
      gap: 8px;
    }

    .path-set-btns .path-btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .path-set-btns .path-btn.cancel {
      background: var(--bg-dark);
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
    }

    .path-set-btns .path-btn.cancel:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .path-set-btns .path-btn.confirm {
      background: var(--accent-green);
      border: 1px solid var(--accent-green);
      color: var(--bg-dark);
    }

    .path-set-btns .path-btn.confirm:hover {
      background: #3cb371;
    }

    /* Terrain SVG graphics */
    .terrain-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .terrain-forest-svg {
      opacity: 0.9;
    }

    .terrain-high-svg {
      opacity: 0.85;
    }

    .terrain-water-svg {
      opacity: 0.95;
    }

    .terrain-crater-svg {
      opacity: 0.85;
    }

    /* Terrain cell backgrounds - subtle since SVGs provide visuals */
    .plan-cell.terrain-grass {
      background: transparent !important;
    }

    .plan-cell.terrain-brush {
      background: transparent !important;
    }

    .plan-cell.terrain-forest {
      background: transparent !important;
    }

    .plan-cell.terrain-high {
      background: transparent !important;
    }

    .plan-cell.terrain-water {
      background: transparent !important;
      cursor: not-allowed;
    }

    .plan-cell.terrain-crater {
      background: transparent !important;
    }

    /* Time of day overlays - applied via class on grid container */
    .planning-grid.time-dawn {
      filter: sepia(0.2) saturate(1.1) brightness(0.95);
    }
    .planning-grid.time-dawn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 150, 100, 0.1);
      pointer-events: none;
    }

    .planning-grid.time-dusk {
      filter: sepia(0.15) saturate(0.9) brightness(0.9);
    }
    .planning-grid.time-dusk::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 100, 80, 0.12);
      pointer-events: none;
    }

    .planning-grid.time-night {
      filter: saturate(0.6) brightness(0.5);
    }
    .planning-grid.time-night::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(30, 40, 80, 0.3);
      pointer-events: none;
    }

    /* Weather overlays */
    .planning-grid.weather-overcast {
      filter: saturate(0.7) brightness(0.9);
    }

    .planning-grid.weather-fog::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(200, 200, 210, 0.4);
      pointer-events: none;
    }

    .planning-grid.weather-rain {
      filter: saturate(0.6) brightness(0.85);
    }

    .planning-grid.weather-storm {
      filter: saturate(0.4) brightness(0.6) contrast(1.1);
    }

    /* Future terrain types (for structures) */
    .plan-cell.terrain-cover {
      background: rgba(100, 80, 60, 0.6) !important;
    }

    .plan-cell.terrain-trench {
      background: rgba(60, 50, 40, 0.8) !important;
    }

    /* Terrain hover info - specific descriptions */
    .plan-cell[data-terrain]:hover::after {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
    }
    .plan-cell.terrain-grass:hover::after { content: "Grass: Light cover"; }
    .plan-cell.terrain-brush:hover::after { content: "Brush: +10% def, -10% speed"; }
    .plan-cell.terrain-cover:hover::after { content: "Cover: +25% defense"; }
    .plan-cell.terrain-forest:hover::after { content: "Forest: +20% def, -30% speed"; }
    .plan-cell.terrain-high:hover::after { content: "High Ground: +15% dmg, +10% range"; }
    .plan-cell.terrain-trench:hover::after { content: "Trench: +40% def, -50% speed"; }
    .plan-cell.terrain-water:hover::after { content: "Water: Impassable"; }
    .plan-cell.terrain-crater:hover::after { content: "Crater: +15% def, -20% speed"; }

    /* Campaign Battle Screen - Landscape optimized */
    .campaign-battle-screen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: #1a1a2e;
      position: relative;
    }

    .campaign-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      z-index: 100;
      gap: 10px;
      padding: 8px 15px;
      pointer-events: none;
    }

    .campaign-top-bar > * {
      pointer-events: auto;
    }

    /* Front Line Command Buttons */
    .front-line-commands {
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .front-line-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 12px;
      background: rgba(60, 60, 70, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 60px;
    }

    .front-line-btn:hover {
      background: rgba(80, 80, 90, 0.9);
      color: #fff;
    }

    .front-line-btn.active {
      color: #fff;
      transform: scale(1.05);
    }

    .front-line-btn.advance.active {
      background: rgba(76, 175, 80, 0.4);
      border-color: #4caf50;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
    }

    .front-line-btn.hold.active {
      background: rgba(255, 193, 7, 0.4);
      border-color: #ffc107;
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
    }

    .front-line-btn.retreat.active {
      background: rgba(244, 67, 54, 0.4);
      border-color: #f44336;
      box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
    }

    .front-line-btn .fl-icon {
      font-size: 16px;
    }

    .front-line-btn .fl-label {
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .front-line-btn .fl-key {
      font-size: 8px;
      opacity: 0.6;
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .campaign-hud {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
      justify-content: center;
    }

    .campaign-hp-bar {
      width: 150px;
      height: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .campaign-hp-fill {
      height: 100%;
      background: linear-gradient(to right, #ff4444, #ff8844);
      transition: width 0.2s;
    }

    .campaign-hp-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.7rem;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
    }

    .campaign-stats {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
    }

    .campaign-timer {
      color: var(--accent-yellow);
      font-weight: bold;
    }

    .campaign-kills {
      color: var(--accent-blue);
    }

    .campaign-wave {
      color: var(--accent-green);
    }

    .campaign-battlefield {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #3a3a2e;
      cursor: crosshair;
    }

    .campaign-terrain {
      z-index: 1;
    }

    .campaign-cell {
      transition: none;
      overflow: hidden;
    }

    .campaign-cell .terrain-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .campaign-entity {
      position: absolute;
      pointer-events: none;
    }

    .campaign-unit {
      z-index: 30;
      box-shadow: 0 0 10px rgba(90, 138, 90, 0.5);
    }

    .campaign-hero {
      z-index: 50;
      box-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
    }

    .campaign-enemy {
      z-index: 40;
    }

    .campaign-projectile {
      z-index: 45;
    }

    .campaign-minimap {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--accent-green);
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .minimap-canvas {
      display: block;
      border-radius: 4px;
    }

    .minimap-legend {
      display: flex;
      justify-content: center;
      gap: 8px;
      font-size: 0.6rem;
      padding-top: 3px;
      color: var(--text-secondary);
    }

    .legend-hero { color: #4a9eff; }
    .legend-unit { color: #5a8a5a; }
    .legend-enemy { color: #ff4444; }

    .campaign-controls-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 15px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: rgba(0,0,0,0.5);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .control-group kbd {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-primary);
    }

    .control-sep {
      color: rgba(255,255,255,0.3);
    }

    .commands-row {
      color: var(--accent-yellow);
    }

    .commands-row kbd {
      background: rgba(255, 200, 50, 0.2);
      border-color: rgba(255, 200, 50, 0.4);
    }

    /* Mobile Controls - Landscape optimized */
    .mobile-controls {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 90;
    }

    .mobile-joystick-zone {
      position: absolute;
      left: 15px;
      bottom: 15px;
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .joystick-hint {
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-weight: bold;
    }

    .mobile-shoot-zone {
      position: absolute;
      right: 15px;
      bottom: 15px;
      width: 90px;
      height: 90px;
      background: rgba(255,100,100,0.15);
      border: 2px solid rgba(255,100,100,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .shoot-hint {
      color: rgba(255,150,150,0.7);
      font-size: 9px;
      font-weight: bold;
      text-align: center;
    }

    .mobile-commands {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .mobile-cmd-btn {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .mobile-cmd-btn:active {
      background: rgba(74, 158, 255, 0.5);
      border-color: #4a9eff;
    }

    /* Hide desktop controls on mobile */
    @media (max-width: 768px) {
      .campaign-controls-hint {
        display: none;
      }

      .campaign-top-bar {
        padding: 5px 10px;
        gap: 10px;
      }

      .minimap-canvas {
        width: 80px;
        height: 80px;
      }

      .campaign-hp-bar {
        width: 120px;
        height: 20px;
      }

      .campaign-stats {
        font-size: 0.8rem;
        gap: 10px;
      }
    }

    /* Campaign Result Screen */
    .campaign-result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px;
    }

    .victory-title {
      color: var(--accent-green);
      text-shadow: 0 0 20px var(--accent-green);
    }

    .defeat-title {
      color: var(--accent-red);
      text-shadow: 0 0 20px var(--accent-red);
    }

    .result-stats {
      text-align: center;
      line-height: 2;
    }

    /* Landscape orientation warning */
    #rotate-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1a1a2e;
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    .rotate-content {
      text-align: center;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
    }

    .rotate-icon {
      font-size: 80px;
      animation: rotate-hint 2s ease-in-out infinite;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    .rotate-content h2 {
      margin: 20px 0 10px;
      color: #4a9eff;
    }

    .rotate-content p {
      color: #888;
    }

    /* Show warning only on mobile in portrait */
    @media (max-width: 900px) and (orientation: portrait) {
      #rotate-warning {
        display: flex;
      }
      #app {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app"><div style="padding:40px;text-align:center;">Loading...</div></div>

  <!-- Landscape orientation warning -->
  <div id="rotate-warning">
    <div class="rotate-content">
      <div class="rotate-icon">📱</div>
      <h2>Rotate Your Device</h2>
      <p>This game plays best in landscape mode</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>

  <!-- Register Service Worker for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
