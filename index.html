<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculated Risk</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4a9eff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalcRisk">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oxanium:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #1a1f2e;
      --bg-medium: #252b3d;
      --bg-light: #2f3749;
      --bg-lighter: #3d4559;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-yellow: #fbbf24;
      --accent-blue: #60a5fa;
      --accent-orange: #fb923c;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
    }

    /* Global themed scrollbars */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--bg-lighter) var(--bg-dark);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-lighter);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-blue);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Oxanium', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      touch-action: manipulation;
    }

    button, .lane-slot, .lane, .unit-option, .toggle {
      touch-action: manipulation;
      cursor: pointer;
    }

    #app {
      height: 100%;
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* ===== SCREENS ===== */
    .screen {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── Title Screen / Save Slots ── */
    .title-screen { align-items: center; justify-content: center; padding: 20px; }
    .title-header { text-align: center; margin-bottom: 30px; }
    .title-name { font-size: 2rem; font-weight: 700; letter-spacing: 4px; color: var(--accent-green); margin: 0; }
    .title-version { font-size: 0.7rem; color: var(--text-secondary); }
    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; max-width: 800px; width: 100%; }
    .slot-card { padding: 16px; border-radius: 8px; cursor: pointer; transition: all 0.15s; border: 2px solid var(--bg-light); background: var(--bg-medium); }
    .slot-card:hover { border-color: var(--accent-green); background: var(--bg-light); }
    .slot-card.slot-active { border-color: var(--accent-green); box-shadow: 0 0 8px rgba(74,222,128,0.25); }
    .slot-filled .slot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .slot-name { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
    .slot-wave { font-size: 0.7rem; color: var(--accent-yellow); font-weight: 600; }
    .slot-details { display: flex; gap: 12px; font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 6px; }
    .slot-footer { display: flex; justify-content: space-between; align-items: center; }
    .slot-date { font-size: 0.6rem; color: var(--text-secondary); opacity: 0.6; }
    .slot-delete { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.7rem; opacity: 0.4; padding: 2px 4px; }
    .slot-delete:hover { opacity: 1; color: var(--accent-red); }
    .slot-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px; border-style: dashed; }
    .slot-empty-label { font-size: 0.75rem; color: var(--text-secondary); opacity: 0.5; }
    .slot-new-label { font-size: 0.7rem; color: var(--accent-green); margin-top: 4px; }

    /* New Game Setup Screen */
    .new-game-setup { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; gap: 20px; }
    .setup-header { text-align: center; }
    .setup-header h2 { font-size: 1.4rem; color: var(--accent-green); margin: 0 0 4px; letter-spacing: 2px; }
    .setup-subtitle { font-size: 0.75rem; color: var(--text-secondary); margin: 0; }
    .setup-seeds { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 360px; }
    .seed-row { display: flex; align-items: center; gap: 8px; }
    .seed-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; flex: 1; background: var(--bg-medium); border: 1px solid var(--bg-light); transition: border-color 0.15s; }
    .seed-option:hover { border-color: var(--accent-green); }
    .seed-option input[type="radio"] { accent-color: var(--accent-green); }
    .seed-option input[type="radio"]:checked ~ .seed-name { color: var(--accent-green); }
    .seed-name { font-size: 0.8rem; color: var(--text-primary); flex: 1; }
    .seed-value { font-size: 0.65rem; color: var(--text-secondary); font-family: monospace; }
    .seed-remove-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.8rem; padding: 4px 6px; opacity: 0.4; }
    .seed-remove-btn:hover { opacity: 1; color: var(--accent-red); }
    .seed-custom-row { flex-wrap: wrap; }
    .seed-custom-input { width: 100%; margin-top: 4px; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--bg-light); background: var(--bg-dark); color: var(--text-primary); font-family: 'Oxanium', monospace; font-size: 0.75rem; }
    .seed-custom-input:focus { border-color: var(--accent-green); outline: none; }
    .setup-actions { display: flex; gap: 12px; margin-top: 8px; }
    .setup-btn { padding: 10px 28px; border-radius: 6px; border: 1px solid var(--bg-light); background: var(--bg-medium); color: var(--text-primary); font-family: 'Oxanium', monospace; font-size: 0.8rem; cursor: pointer; letter-spacing: 1px; }
    .setup-btn:hover { border-color: var(--text-secondary); }
    .setup-btn.primary { background: var(--accent-green); color: var(--bg-dark); font-weight: 700; border-color: var(--accent-green); }
    .setup-btn.primary:hover { filter: brightness(1.1); }
    .title-footer { margin-top: 20px; }
    .title-settings-btn { padding: 8px 20px; background: none; border: 1px solid var(--bg-light); color: var(--text-secondary); border-radius: 4px; cursor: pointer; }
    .title-settings-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }

    /* Radio message overlay */
    .radio-message { position: absolute; bottom: 80px; left: 16px; background: rgba(26,31,46,0.85); border: 1px solid var(--accent-yellow); color: var(--accent-yellow); padding: 8px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; z-index: 100; transition: opacity 0.5s; pointer-events: none; max-width: 300px; }

    /* Mission fade from black */
    .mission-fade { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 300; pointer-events: none; transition: opacity 0.1s; }
    .mission-click-hint { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: var(--text-secondary); opacity: 0.6; letter-spacing: 1.5px; text-transform: uppercase; z-index: 150; pointer-events: none; animation: pulse-hint 2s ease-in-out infinite; }
    @keyframes pulse-hint { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

    /* Mission dialog overlay */
    .mission-dialog-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; pointer-events: all; cursor: pointer; }
    .mission-dialog-overlay.type-thought { background: rgba(0,0,0,0.5); }
    .mission-dialog-overlay.type-radio { background: rgba(0,0,0,0.3); }
    .mission-dialog-text { max-width: 600px; text-align: center; padding: 20px 30px; border-radius: 8px; font-size: 1.1rem; line-height: 1.6; }
    .type-thought .mission-dialog-text { color: var(--text-primary); font-style: italic; background: rgba(26,31,46,0.8); border: 1px solid rgba(255,255,255,0.1); }
    .type-radio .mission-dialog-text { color: var(--accent-yellow); font-weight: 700; background: rgba(26,31,46,0.9); border: 1px solid var(--accent-yellow); letter-spacing: 0.5px; }
    .type-radio .mission-dialog-text::before { content: '📻 '; }
    .mission-dialog-hint { margin-top: 12px; font-size: 0.65rem; color: var(--text-secondary); opacity: 0.6; letter-spacing: 1px; text-transform: uppercase; }
    .type-radio .mission-dialog-hint { display: none; }

    /* Menu Screen - Landscape optimized */
    .menu-screen {
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(180deg, #0f1319 0%, #1a1f2e 50%, #252b3d 100%);
      position: relative;
    }

    .menu-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .menu-resources {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      gap: 12px;
    }

    .res-scrap { color: var(--accent-yellow); }
    .res-parts { color: var(--accent-blue); }

    .menu-header {
      text-align: center;
      width: 100%;
      flex-shrink: 0;
    }

    .game-title {
      font-family: 'Black Ops One', cursive;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 5px;
    }

    .game-title span {
      display: inline;
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-subtitle {
      font-family: 'Share Tech Mono', monospace;
      color: var(--text-secondary);
      margin-bottom: 0;
      font-size: 0.85rem;
      letter-spacing: 2px;
    }

    .menu-version {
      position: absolute;
      bottom: 12px;
      right: 15px;
      font-family: 'Share Tech Mono', monospace;
      color: var(--text-secondary);
      font-size: 0.7rem;
      opacity: 0.5;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 300px;
      width: 100%;
    }

    .menu-btn {
      width: 100%;
      padding: 14px 24px;
      font-family: 'Oxanium', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid var(--accent-green);
      background: transparent;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .menu-btn:active, .menu-btn:hover {
      background: var(--accent-green);
      color: var(--bg-dark);
    }

    .menu-btn.secondary {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
    }

    .menu-btn.secondary:active, .menu-btn.secondary:hover {
      background: var(--text-secondary);
      color: var(--bg-dark);
    }

    .menu-btn:disabled {
      opacity: 0.5;
    }

    /* ===== GAME SCREEN ===== */
    .game-screen {
      background: var(--bg-dark);
    }

    /* HUD */
    .game-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      background: var(--bg-medium);
      border-bottom: 2px solid var(--bg-light);
      flex-shrink: 0;
    }

    .hud-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .health-bar {
      width: 80px;
      height: 18px;
      background: var(--bg-dark);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-green));
      transition: width 0.3s;
    }

    .health-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: white;
      text-shadow: 0 0 3px black;
    }

    .resource-display {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
    }

    .resource-display.scrap { color: var(--accent-yellow); }
    .resource-display.parts { color: var(--accent-blue); }

    .score-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      color: var(--accent-green);
    }

    .wave-display {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .hud-btn {
      background: none;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      font-size: 1rem;
      padding: 5px 10px;
      font-family: 'Oxanium', sans-serif;
    }

    /* Battlefield */
    .battlefield {
      flex: 1;
      display: flex;
      position: relative;
      background: linear-gradient(180deg, #2d3a2d 0%, #3d4a3d 50%, #4a5a4a 100%);
      overflow: hidden;
    }

    .lane {
      flex: 1;
      position: relative;
      border-right: 1px dashed rgba(255,255,255,0.1);
    }

    .lane:last-child {
      border-right: none;
    }

    .lane-number {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      font-family: 'Share Tech Mono', monospace;
    }

    /* Units and Enemies */
    .unit, .enemy {
      position: absolute;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .unit svg, .enemy svg {
      width: 100%;
      height: 100%;
    }

    .unit {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .enemy {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Unit shadows - rendered behind units */
    .unit-shadow {
      position: absolute;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform-origin: center center;
    }

    .unit-shadow svg,
    .unit-shadow img.unit-sprite {
      width: 100%;
      height: 100%;
      filter: brightness(0) saturate(0);
      background: transparent !important;
    }

    /* PNG Sprite support */
    .unit-sprite {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .enemy .unit-sprite {
      filter: hue-rotate(180deg) saturate(0.8) brightness(0.9);
    }

    .health-pip {
      position: absolute;
      bottom: -8px;
      left: 5px;
      right: 5px;
      height: 4px;
      background: #333;
      border-radius: 2px;
    }

    .health-pip-fill {
      height: 100%;
      background: var(--accent-red);
      border-radius: 2px;
    }

    .explosion {
      position: absolute;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, var(--accent-yellow), var(--accent-orange), transparent);
      border-radius: 50%;
      animation: explode 0.3s forwards;
      pointer-events: none;
    }

    @keyframes explode {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* Projectiles */
    .projectile {
      position: absolute;
      pointer-events: none;
      z-index: 15;
    }

    .muzzle-flash {
      position: absolute;
      pointer-events: none;
      z-index: 14;
    }

    .impact {
      position: absolute;
      pointer-events: none;
      z-index: 16;
    }

    .loot-drop {
      position: absolute;
      font-size: 0.8rem;
      font-weight: bold;
      animation: float-up 1s forwards;
      pointer-events: none;
      font-family: 'Share Tech Mono', monospace;
      text-shadow: 0 0 5px black;
    }

    .loot-drop.scrap { color: var(--accent-yellow); }
    .loot-drop.parts { color: var(--accent-blue); }

    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }

    /* Base */
    .base-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(0deg, var(--bg-medium), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 2px solid var(--accent-green);
    }

    .base-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-green);
      letter-spacing: 2px;
    }

    /* Lane Selector */
    .lane-selector {
      display: flex;
      padding: 10px;
      background: var(--bg-medium);
      border-top: 2px solid var(--bg-light);
      flex-shrink: 0;
    }

    .lane-slot {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 5px;
      background: var(--bg-dark);
      margin: 0 5px;
      border-radius: 6px;
      border: 2px solid transparent;
      transition: all 0.2s;
      position: relative;
    }

    .lane-slot:active, .lane-slot.selected {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.1);
    }

    .lane-slot .unit-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 5px;
    }

    .lane-slot .unit-name {
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .lane-slot .deploy-ready {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 5px var(--accent-green);
    }

    .lane-slot .cooldown-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--bg-light);
      border-radius: 0 0 4px 4px;
    }

    .lane-slot .cooldown-fill {
      height: 100%;
      background: var(--accent-blue);
      border-radius: 0 0 4px 4px;
    }

    /* Unit Selection Panel */
    .unit-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-dark);
      border-top: 3px solid var(--accent-green);
      padding: 15px;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      z-index: 100;
    }

    .unit-panel.open {
      transform: translateY(0);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .panel-title {
      font-family: 'Black Ops One', cursive;
      font-size: 1rem;
    }

    .panel-close {
      background: none;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      padding: 6px 12px;
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .unit-option {
      padding: 10px;
      background: var(--bg-medium);
      border: 2px solid transparent;
      border-radius: 6px;
      text-align: center;
    }

    .unit-option:active, .unit-option.selected {
      border-color: var(--accent-green);
    }

    .unit-option .icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 5px;
    }

    .unit-option .name {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .unit-option .stats {
      font-size: 0.6rem;
      color: var(--accent-yellow);
      margin-top: 3px;
    }

    /* Overlays */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .overlay h2 {
      font-family: 'Black Ops One', cursive;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .overlay .stats-box {
      text-align: center;
      margin: 20px 0;
    }

    .overlay .stat-line {
      font-size: 1rem;
      margin: 10px 0;
      color: var(--text-secondary);
    }

    .overlay .stat-line span {
      color: var(--accent-yellow);
      font-family: 'Share Tech Mono', monospace;
    }

    .countdown-overlay h2 {
      font-size: 5rem;
      color: var(--accent-green);
    }

    .countdown-overlay .wave-info {
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .wave-complete-overlay h2 { color: var(--accent-green); }
    .game-over-overlay h2 { color: var(--accent-red); }
    .game-over-overlay.victory h2 { color: var(--accent-green); }
    .pause-overlay h2 { color: var(--text-primary); }

    /* Fire Range Results Modal */
    .fr-results-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column; align-items: center;
      justify-content: safe center;
      z-index: 250; padding: 30px 20px; overflow-y: auto;
    }
    .fr-results-overlay h2 {
      font-family: 'Black Ops One', cursive; font-size: 2rem; margin: 0 0 4px;
    }
    .fr-results-overlay .fr-duration {
      color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 16px;
      font-family: 'Share Tech Mono', monospace;
    }
    .fr-results-overlay.blue-wins h2 { color: #4a9eff; }
    .fr-results-overlay.red-wins h2 { color: #ff4444; }
    .fr-results-overlay.draw h2 { color: #ccc; }

    .fr-team-summary {
      display: flex; gap: 32px; margin-bottom: 16px;
    }
    .fr-team-box {
      text-align: center; padding: 10px 20px; border-radius: 6px;
      background: rgba(255,255,255,0.05); min-width: 160px;
    }
    .fr-team-box.blue { border: 1px solid rgba(74,158,255,0.3); }
    .fr-team-box.red { border: 1px solid rgba(255,68,68,0.3); }
    .fr-team-box h3 {
      font-size: 0.9rem; margin: 0 0 8px; font-family: 'Black Ops One', cursive;
    }
    .fr-team-box.blue h3 { color: #4a9eff; }
    .fr-team-box.red h3 { color: #ff4444; }
    .fr-team-box .fr-tstat {
      font-size: 0.75rem; color: var(--text-secondary); margin: 3px 0;
    }
    .fr-team-box .fr-tstat span {
      color: var(--accent-yellow); font-family: 'Share Tech Mono', monospace;
    }

    .fr-results-table {
      border-collapse: collapse; font-size: 0.7rem; margin-bottom: 16px;
      font-family: 'Share Tech Mono', monospace;
    }
    .fr-results-table th {
      color: var(--text-secondary); font-weight: normal; padding: 4px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;
    }
    .fr-results-table td {
      padding: 4px 10px; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .fr-results-table tr.blue-row td { color: #8ac4ff; }
    .fr-results-table tr.red-row td { color: #ff8888; }
    .fr-results-table tr.dead-row td { color: #666 !important; }
    .fr-results-table tr.fr-mvp-row td {
      color: #ffd700; font-weight: bold; opacity: 1;
    }
    .fr-mvp-badge {
      font-size: 0.6rem; background: rgba(255,215,0,0.2); color: #ffd700;
      padding: 1px 5px; border-radius: 3px; margin-left: 6px;
    }

    .fr-results-overlay.live h2 { color: #aaa; }

    .fr-results-tables {
      display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap;
      justify-content: center;
    }
    .fr-results-team-table { min-width: 280px; }
    .fr-table-header {
      font-size: 0.75rem; margin: 0 0 4px; font-family: 'Black Ops One', cursive;
    }
    .fr-table-header.blue { color: #4a9eff; }
    .fr-table-header.red { color: #ff4444; }

    .fr-results-buttons { display: flex; gap: 10px; margin-top: 8px; }
    .fr-results-buttons .menu-btn {
      font-size: 0.85rem; padding: 8px 20px;
    }

    /* Settings Screen - Landscape */
    .settings-screen {
      padding: 20px 40px;
      overflow-y: auto;
      max-width: 600px;
      margin: 0 auto;
    }

    .settings-header {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      padding: 10px;
      margin-right: 10px;
      cursor: pointer;
    }

    .back-btn:hover {
      color: var(--accent-green);
    }

    .settings-title {
      font-family: 'Black Ops One', cursive;
      font-size: 1.3rem;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    /* Settings sub-tabs (general / cursors) */
    .settings-sub-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--bg-light, #2f3749);
    }
    .settings-sub-tab {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 8px 16px;
      font-family: Oxanium, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 1px;
      cursor: var(--cursor-menu);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .settings-sub-tab.active {
      color: var(--accent-green, #4ade80);
      border-bottom-color: var(--accent-green, #4ade80);
    }

    /* Cursor settings — two-column picker */
    .cursor-settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .cursor-column {
      background: var(--bg-medium, #252b3d);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 14px;
    }
    .cursor-col-header {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .cursor-swatch-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .cursor-swatch {
      background: var(--bg-light, #2f3749);
      border: 2px solid transparent;
      border-radius: 4px;
      padding: 6px 4px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: var(--cursor-menu);
      color: var(--text-primary);
    }
    .cursor-swatch.active {
      border-color: var(--accent-green, #4ade80);
    }
    .cursor-swatch:hover {
      background: #383f54;
    }
    .cursor-swatch img {
      background: #0a1424;
      border-radius: 3px;
    }
    .cursor-swatch-name {
      font-size: 10px;
      color: var(--text-secondary);
    }
    .cursor-selected {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .cursor-selected strong { color: var(--text-primary); }
    .cursor-parts { margin-bottom: 10px; }
    .cursor-part-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      font-size: 12px;
    }
    .cursor-part-row label { flex: 1; color: var(--text-secondary); }
    .cursor-part-row input[type="color"] {
      width: 32px; height: 24px;
      border: 1px solid #444;
      background: transparent;
      cursor: var(--cursor-menu);
    }
    .cursor-part-auto, .cursor-part-static {
      font-size: 11px;
      color: var(--text-secondary);
      font-style: italic;
    }
    .cursor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .cursor-add-drawer {
      margin-top: 12px;
      padding: 10px;
      background: #0a1424;
      border: 1px solid var(--accent-yellow, #fbbf24);
      border-radius: 4px;
    }
    .cursor-add-header {
      font-size: 11px;
      color: var(--accent-yellow, #fbbf24);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .cursor-add-textarea {
      width: 100%;
      background: #1a1f2e;
      color: var(--text-primary);
      border: 1px solid #333;
      border-radius: 3px;
      font-family: Consolas, monospace;
      font-size: 11px;
      padding: 6px;
      resize: vertical;
      box-sizing: border-box;
    }
    .cursor-add-error {
      color: var(--accent-red, #f87171);
      font-size: 11px;
      margin-top: 4px;
    }
    .cursor-add-preview {
      margin-top: 8px;
      padding: 6px;
      background: #1a1f2e;
      border-radius: 3px;
      text-align: center;
    }
    .cursor-add-preview img { background: #0a1424; border-radius: 3px; }
    .cursor-add-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .cursor-help {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 12px;
      padding: 8px;
      background: var(--bg-medium, #252b3d);
      border-radius: 4px;
    }
    .menu-btn.small {
      padding: 4px 10px;
      font-size: 11px;
    }
    .menu-btn.danger { color: var(--accent-red, #f87171); border-color: var(--accent-red, #f87171); }

    .setting-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .setting-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .setting-btn {
      flex: 1;
      min-width: 100px;
      padding: 10px 16px;
      font-family: 'Oxanium', sans-serif;
      font-size: 0.85rem;
      border: 1px solid var(--bg-light);
      background: var(--bg-medium);
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
    }

    .setting-btn:hover {
      border-color: var(--text-secondary);
    }

    .setting-btn.active {
      border-color: var(--accent-green);
      background: rgba(74, 222, 128, 0.1);
      color: var(--accent-green);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--bg-light);
    }

    .checkbox-row label {
      flex: 1;
      font-size: 0.9rem;
    }

    .toggle {
      width: 50px;
      height: 28px;
      background: var(--bg-light);
      border-radius: 14px;
      position: relative;
      transition: background 0.2s;
      cursor: pointer;
    }

    .toggle.active {
      background: var(--accent-green);
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.active::after {
      transform: translateX(22px);
    }

    /* Skin Selector */
    .skins-container {
      max-height: 200px;
      overflow-y: auto;
    }

    .skin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--bg-light);
    }

    .skin-row:last-child {
      border-bottom: none;
    }

    .skin-unit-name {
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .skin-selector {
      padding: 6px 10px;
      background: var(--bg-medium);
      border: 1px solid var(--bg-light);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 140px;
    }

    .skin-selector:hover {
      border-color: var(--accent-blue);
    }

    .skin-selector:focus {
      outline: none;
      border-color: var(--accent-green);
    }

    /* Stats Screen - Landscape */
    .stats-screen {
      padding: 20px 40px;
      overflow-y: auto;
      max-width: 800px;
      margin: 0 auto;
    }

    .stats-sections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .stats-section {
      background: var(--bg-medium);
      border-radius: 8px;
      padding: 16px;
    }

    .stats-section h3 {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--bg-light);
      font-size: 0.9rem;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-value {
      font-family: 'Share Tech Mono', monospace;
      color: var(--accent-green);
    }

    /* ===== HEADQUARTERS SCREEN - Landscape ===== */
    .hq-screen {
      padding: 0;
      background: linear-gradient(180deg, #0f1319 0%, #1a1f2e 100%);
      display: flex;
      flex-direction: column;
    }

    .hq-header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: var(--bg-medium);
      border-bottom: 2px solid var(--accent-green);
      flex-shrink: 0;
    }

    .hq-title {
      font-family: 'Black Ops One', cursive;
      font-size: 1.2rem;
      margin-right: 20px;
    }

    .hq-resources {
      display: flex;
      gap: 15px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      flex: 0 0 auto;
      margin-right: auto;
    }

    .hq-tabs, .hq-tab-bar {
      display: flex;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--bg-light);
      flex-shrink: 0;
    }

    .hq-tab {
      padding: 10px 20px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-family: 'Black Ops One', cursive;
      font-size: 0.8rem;
      font-weight: 400;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .hq-tab.active {
      color: var(--accent-green);
      border-bottom-color: var(--accent-green);
    }

    .hq-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    /* Insignia editor fills full viewport — no padding, no scroll on parent */
    .hq-content:has(.insignia-tab) {
      padding: 0;
      overflow: hidden;
      max-width: none;
    }

    .hq-header-actions { display: flex; gap: 8px; }
    .hq-header-btn { background: none; border: 1px solid var(--bg-light); color: var(--text-secondary); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    .hq-header-btn:hover { color: var(--text-primary); border-color: var(--accent-green); }

    /* ── HQ header deploy bar (compact) ───────────────────── */
    .hq-deploy-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px;
      background: var(--bg-light);
      border: 1px solid var(--bg-lighter);
      border-radius: 4px;
      flex-shrink: 0;
    }
    .hq-deploy-group { display: flex; align-items: center; gap: 4px; }
    .hq-deploy-label {
      font-size: 0.55rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'Oxanium', sans-serif;
      font-weight: 600;
    }
    .hq-deploy-val {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .hq-map-buttons { display: flex; gap: 2px; }
    .hq-map-btn {
      width: 24px; height: 24px;
      background: var(--bg-medium);
      border: 1px solid var(--bg-lighter);
      color: var(--text-secondary);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 3px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }
    .hq-map-btn:hover { color: var(--text-primary); border-color: var(--accent-green); }
    .hq-map-btn.active { background: var(--accent-green); color: var(--bg-dark); border-color: var(--accent-green); }
    .hq-wave-select {
      background: var(--bg-medium);
      border: 1px solid var(--bg-lighter);
      color: var(--text-primary);
      padding: 3px 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      border-radius: 3px;
      cursor: pointer;
    }
    .hq-deploy-btn {
      background: var(--accent-green);
      color: var(--bg-dark);
      border: none;
      padding: 5px 14px;
      font-family: 'Black Ops One', cursive;
      font-size: 0.8rem;
      letter-spacing: 1px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .hq-deploy-btn:hover:not(.disabled) { filter: brightness(1.1); box-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }
    .hq-deploy-btn.disabled {
      background: var(--bg-medium);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    /* Insignia inside Barracks sub-tab — restore hq-content padding (override insignia full-bleed rule) */
    .hq-content:has(.barracks-tab-insignia) {
      padding: 15px 20px;
      overflow: hidden;
      max-width: 1200px;
    }
    .barracks-tab-insignia .insignia-tab {
      flex: 1;
      min-height: 0;
      height: auto;
    }

    /* ═══ Barracks ▸ SQUADS sub-view ═══ */
    .sq-split { display: flex; flex: 1; gap: 8px; min-height: 0; padding: 6px 0 0; }
    .sq-roster-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .sq-squad-pane { flex: 0 0 28%; background: var(--bg-medium); border-radius: 6px; padding: 8px 10px; overflow-y: auto; min-width: 0; }

    .sq-filter-bar { display: flex; gap: 3px; padding: 0 0 6px; flex-wrap: wrap; flex-shrink: 0; }
    .sq-filter-chip { padding: 2px 6px; font-family: 'Oxanium', sans-serif; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.3px; background: var(--bg-medium); border: 1px solid var(--bg-light); color: var(--text-secondary); border-radius: 3px; cursor: pointer; }
    .sq-filter-chip:hover { color: var(--text-primary); }
    .sq-filter-chip.active { background: var(--bg-light); color: var(--accent-green); border-color: var(--accent-green); }

    .sq-roster-table { flex: 1; overflow-y: auto; background: var(--bg-medium); border-radius: 5px; min-height: 0; }
    .sq-th-row { display: flex; align-items: center; gap: 4px; padding: 5px 6px; border-bottom: 1px solid var(--bg-light); position: sticky; top: 0; background: var(--bg-medium); z-index: 1; }
    .sq-tbody { /* no nested scroll — parent table scrolls */ }
    .sq-th { font-family: 'Oxanium', sans-serif; font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; flex-shrink: 0; background: none; border: none; padding: 0; text-align: left; white-space: nowrap; overflow: visible; }
    .sq-th:hover:not([disabled]) { color: var(--text-primary); }
    .sq-th.active { color: var(--accent-green); }

    /* Column widths — must match between header (sq-th sq-col-*) and body (sq-col-*) */
    .sq-col-mos { width: 40px; text-align: center; flex-shrink: 0; }
    .sq-col-rank { width: 40px; flex-shrink: 0; font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--text-secondary); }
    .sq-col-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sq-col-hp { width: 116px; flex-shrink: 0; display: flex; align-items: center; gap: 5px; }
    .sq-col-hp .sq-hp-num { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; margin-left: auto; }
    .sq-col-dmg { width: 44px; text-align: right; flex-shrink: 0; font-family: 'Share Tech Mono', monospace; font-size: 0.72rem; color: var(--text-primary); }
    .sq-col-rng { width: 50px; text-align: right; flex-shrink: 0; font-family: 'Share Tech Mono', monospace; font-size: 0.72rem; color: var(--text-secondary); }
    .sq-col-spd { width: 44px; text-align: right; flex-shrink: 0; font-family: 'Share Tech Mono', monospace; font-size: 0.72rem; color: var(--text-primary); }
    .sq-col-chip { width: 100px; flex-shrink: 0; display: flex; justify-content: center; position: relative; }
    .sq-th.sq-col-chip { color: var(--text-secondary); cursor: default; text-align: center; }
    /* Header cells use the body classes but reset numeric font/colors so labels stay readable */
    .sq-th.sq-col-rank, .sq-th.sq-col-dmg, .sq-th.sq-col-rng, .sq-th.sq-col-spd { font-family: 'Oxanium', sans-serif; font-size: 0.6rem; color: var(--text-secondary); }
    .sq-th.sq-col-rank.active, .sq-th.sq-col-dmg.active, .sq-th.sq-col-rng.active, .sq-th.sq-col-spd.active { color: var(--accent-green); }

    /* Extra columns for ROSTER sub-view */
    .r-col-check { width: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .r-col-check input[type="checkbox"] { cursor: pointer; }
    .r-col-phys { width: 30px; flex-shrink: 0; font-family: 'Share Tech Mono', monospace; font-size: 0.68rem; color: var(--text-primary); text-align: right; }
    .sq-th.r-col-phys { font-family: 'Oxanium', sans-serif; font-size: 0.6rem; color: var(--text-secondary); }
    .sq-th.r-col-phys.active { color: var(--accent-green); }
    .r-col-num { width: 38px; flex-shrink: 0; font-family: 'Share Tech Mono', monospace; font-size: 0.66rem; color: var(--text-secondary); text-align: right; }
    .sq-th.r-col-num { font-family: 'Oxanium', sans-serif; font-size: 0.6rem; color: var(--text-secondary); }
    .sq-th.r-col-num.active { color: var(--accent-green); }
    .r-col-mmr { width: 48px; flex-shrink: 0; font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--text-primary); text-align: right; font-weight: 700; }
    .sq-th.r-col-mmr { font-family: 'Oxanium', sans-serif; font-size: 0.6rem; color: var(--text-secondary); font-weight: normal; }
    .sq-th.r-col-mmr.active { color: var(--accent-green); }
    .r-col-status { width: 50px; flex-shrink: 0; text-align: center; font-family: 'Black Ops One', cursive; font-size: 0.58rem; letter-spacing: 0.5px; }
    .r-col-status.status-active { color: var(--accent-green); }
    .r-col-status.status-wounded { color: var(--accent-yellow); }
    .r-col-status.status-kia { color: var(--accent-red); }
    .sq-row.checked { background: rgba(96,165,250,0.08); }
    .pc-badge { font-family: 'Black Ops One', cursive; font-size: 0.48rem; color: var(--bg-dark); background: var(--accent-green); padding: 1px 4px; border-radius: 2px; letter-spacing: 0.3px; margin-left: 4px; }

    .sq-row { display: flex; align-items: center; gap: 4px; padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); min-height: 36px; font-size: 0.78rem; }
    .sq-row:last-child { border-bottom: none; }
    .sq-row:hover { background: rgba(255,255,255,0.02); }
    .sq-name { font-weight: 600; color: var(--text-primary); }
    .sq-star { color: var(--accent-yellow); font-size: 0.78rem; }
    .sq-mos-tag { font-family: 'Black Ops One', cursive; font-size: 0.55rem; color: var(--text-secondary); padding: 1px 4px; border: 1px solid var(--bg-lighter); border-radius: 2px; letter-spacing: 0.3px; }
    .sq-empty { padding: 12px; color: var(--text-secondary); text-align: center; font-style: italic; font-size: 0.78rem; }

    /* Squad chip */
    .sq-chip {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 4px 9px; min-height: 26px;
      background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.4); color: var(--accent-green);
      font-family: 'Oxanium', sans-serif; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.3px;
      border-radius: 3px; cursor: pointer; white-space: nowrap;
    }
    .sq-chip:hover { filter: brightness(1.15); }
    .sq-chip.reserve { background: var(--bg-light); border-color: var(--bg-lighter); color: var(--text-secondary); }
    .sq-chip.crew { background: rgba(96,165,250,0.12); border-color: rgba(96,165,250,0.4); color: var(--accent-blue); }
    .sq-chip.active { background: rgba(251,191,36,0.2); border-color: var(--accent-yellow); color: var(--accent-yellow); }
    .sq-chip-arrow { opacity: 0.6; font-size: 0.6rem; }

    /* CMD card in squad pane */
    .sq-cmd-card { background: rgba(251,146,60,0.05); border: 1px dashed rgba(251,146,60,0.3); border-radius: 4px; padding: 6px 10px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; cursor: pointer; position: relative; }
    .sq-cmd-card.locked { opacity: 0.4; cursor: default; }
    .sq-cmd-card.filled { border-style: solid; }
    .sq-cmd-card:hover:not(.locked) { background: rgba(251,146,60,0.08); }
    .sq-cmd-label { font-family: 'Black Ops One', cursive; font-size: 0.58rem; color: var(--accent-orange); letter-spacing: 1px; }
    .sq-cmd-name { font-family: 'Share Tech Mono', monospace; font-size: 0.78rem; color: var(--text-primary); font-weight: 700; }
    .sq-cmd-msg { font-size: 0.7rem; color: var(--text-secondary); font-style: italic; margin-left: auto; }
    .sq-cmd-effects { display: flex; gap: 8px; margin-left: auto; }
    .sq-cmd-effect { font-size: 0.6rem; color: var(--text-secondary); padding: 1px 5px; background: var(--bg-dark); border-radius: 3px; }

    /* Squad card */
    .sq-card { background: var(--bg-dark); border-radius: 5px; padding: 6px 8px; margin-bottom: 6px; }
    .sq-card-header { display: flex; align-items: center; gap: 6px; padding: 2px 0 6px; border-bottom: 1px solid var(--bg-light); margin-bottom: 4px; }
    .sq-card-header.hero .sq-card-title { color: var(--accent-yellow); }
    .sq-card-title { font-family: 'Black Ops One', cursive; font-size: 0.66rem; letter-spacing: 1px; color: var(--text-primary); flex: 1; }
    .sq-card-count { font-family: 'Share Tech Mono', monospace; font-size: 0.66rem; color: var(--text-secondary); }
    .sq-card-remove { background: none; border: none; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer; opacity: 0.5; padding: 0 4px; }
    .sq-card-remove:hover { opacity: 1; color: var(--accent-red); }
    .sq-card-empty { padding: 6px; text-align: center; color: var(--text-secondary); font-size: 0.7rem; font-style: italic; }

    .sq-pane-soldier { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 0.72rem; }
    .sq-pane-rank { font-family: 'Share Tech Mono', monospace; font-size: 0.64rem; color: var(--text-secondary); min-width: 26px; }
    .sq-pane-name { flex: 1; min-width: 0; color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sq-ldr-badge { font-family: 'Black Ops One', cursive; font-size: 0.48rem; color: var(--accent-yellow); padding: 1px 4px; border: 1px solid var(--accent-yellow); border-radius: 2px; background: rgba(251,191,36,0.08); letter-spacing: 0.3px; width: 30px; text-align: center; box-sizing: border-box; flex-shrink: 0; }
    .sq-ldr-badge.spacer { visibility: hidden; }

    /* Vehicle card inside squad pane */
    .sq-vehicle-card {
      background: rgba(96,165,250,0.06);
      border: 1px solid rgba(96,165,250,0.3);
      border-radius: 4px;
      padding: 5px 7px;
      margin-top: 4px;
      cursor: pointer;
      position: relative;
    }
    .sq-vehicle-card:hover { background: rgba(96,165,250,0.1); }
    .sq-vehicle-header { display: flex; align-items: center; gap: 6px; font-size: 0.74rem; padding-bottom: 3px; border-bottom: 1px solid rgba(96,165,250,0.15); margin-bottom: 3px; }
    .sq-vehicle-name { font-weight: 700; color: var(--text-primary); flex: 1; }
    .sq-vehicle-hp { font-family: 'Share Tech Mono', monospace; font-size: 0.66rem; color: var(--accent-green); }
    .sq-vehicle-chevron { color: var(--accent-blue); font-size: 0.7rem; opacity: 0.7; }
    .sq-pane-crew { display: flex; align-items: center; gap: 5px; padding: 2px 0 2px 12px; font-size: 0.68rem; }
    .sq-pane-crew-slot { font-family: 'Black Ops One', cursive; font-size: 0.52rem; color: var(--accent-blue); width: 30px; flex-shrink: 0; letter-spacing: 0.3px; }
    .sq-pane-crew-empty { color: var(--text-secondary); font-style: italic; font-size: 0.66rem; }

    .sq-vehicle-slot-wrap { position: relative; margin-top: 4px; }
    .sq-vehicle-empty {
      display: block; width: 100%; padding: 6px;
      background: transparent;
      border: 1px dashed var(--bg-lighter);
      border-radius: 4px;
      text-align: center;
      color: var(--text-secondary);
      font-family: 'Black Ops One', cursive;
      font-size: 0.62rem;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .sq-vehicle-empty:hover { color: var(--accent-blue); border-color: rgba(96,165,250,0.4); }

    .sq-add-squad {
      width: 100%; padding: 6px;
      background: transparent;
      border: 1px dashed var(--bg-lighter);
      color: var(--text-secondary);
      font-family: 'Black Ops One', cursive;
      font-size: 0.66rem;
      letter-spacing: 1px;
      border-radius: 4px;
      margin-top: 6px;
      cursor: pointer;
    }
    .sq-add-squad:hover { color: var(--accent-green); border-color: var(--accent-green); }

    /* Popover — centered floater with backdrop. Escapes table overflow clipping. */
    .sq-popover-backdrop { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.35); }
    .sq-popover {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      max-height: 80vh;
      overflow-y: auto;
      background: var(--bg-medium);
      border: 1px solid var(--accent-green);
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
      padding: 4px;
      z-index: 1000;
    }
    .sq-popover-backdrop ~ .sq-popover,
    .sq-vehicle-card .sq-popover,
    .sq-vehicle-empty .sq-popover {
      /* Vehicle popovers use blue accent */
    }
    .sq-vehicle-card > .sq-popover,
    .sq-vehicle-empty > .sq-popover,
    .sq-cmd-card > .sq-popover { border-color: var(--accent-blue); }
    .sq-cmd-card > .sq-popover { border-color: var(--accent-orange); }

    .sq-pop-title { font-family: 'Black Ops One', cursive; font-size: 0.66rem; color: var(--text-primary); padding: 6px 8px; border-bottom: 1px solid var(--bg-light); margin-bottom: 3px; letter-spacing: 1px; }
    .sq-pop-option { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 3px; font-size: 0.74rem; cursor: pointer; color: var(--text-primary); background: none; border: none; width: 100%; text-align: left; }
    .sq-pop-option:hover:not(:disabled) { background: var(--bg-light); }
    .sq-pop-option:disabled { cursor: default; opacity: 0.6; }
    .sq-pop-option.current { background: rgba(74,222,128,0.1); }
    .sq-pop-option .radio { width: 11px; height: 11px; border: 2px solid var(--bg-lighter); border-radius: 50%; position: relative; flex-shrink: 0; }
    .sq-pop-option.current .radio { border-color: var(--accent-green); }
    .sq-pop-option.current .radio::after { content: ''; position: absolute; inset: 1px; background: var(--accent-green); border-radius: 50%; }
    .sq-pop-option .label { flex: 1; }
    .sq-pop-option .meta { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--text-secondary); }
    .sq-pop-option .icon { width: 16px; text-align: center; font-size: 0.85rem; }
    .sq-pop-option.destructive { color: var(--accent-red); }
    .sq-pop-divider { height: 1px; background: var(--bg-light); margin: 3px 4px; }
    .sq-pop-empty { padding: 8px; text-align: center; color: var(--text-secondary); font-style: italic; font-size: 0.7rem; }

    /* Vehicle drawer */
    .vd-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
    .vd-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 60%); background: var(--bg-medium); border-left: 2px solid var(--accent-blue); padding: 16px 18px; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 1001; }
    .vd-close { float: right; background: none; border: 1px solid var(--bg-lighter); color: var(--text-secondary); width: 26px; height: 26px; border-radius: 3px; font-size: 0.8rem; cursor: pointer; }
    .vd-close:hover { color: var(--accent-red); border-color: var(--accent-red); }
    .vd-title { font-family: 'Black Ops One', cursive; font-size: 1rem; margin: 0 0 2px; letter-spacing: 1px; color: var(--text-primary); }
    .vd-sub { font-size: 0.7rem; color: var(--text-secondary); margin: 0 0 12px; }
    .vd-stats { background: var(--bg-dark); border-radius: 4px; padding: 10px; margin-bottom: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .vd-stat { text-align: center; }
    .vd-stat-val { font-family: 'Share Tech Mono', monospace; font-size: 0.95rem; color: var(--text-primary); font-weight: 700; }
    .vd-stat-label { font-size: 0.55rem; color: var(--text-secondary); letter-spacing: 0.3px; }
    .vd-section { font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 4px; }
    .vd-gear-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--bg-dark); border-radius: 4px; margin-bottom: 3px; }
    .vd-gear-slot { font-family: 'Black Ops One', cursive; font-size: 0.56rem; color: var(--accent-blue); width: 70px; letter-spacing: 0.5px; }
    .vd-gear-name { flex: 1; font-size: 0.78rem; color: var(--text-primary); font-weight: 600; }
    .vd-crew-row { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 0.78rem; }
    .vd-crew-slot { font-family: 'Black Ops One', cursive; font-size: 0.55rem; color: var(--accent-blue); width: 36px; flex-shrink: 0; }
    .vd-rank { font-family: 'Share Tech Mono', monospace; font-size: 0.66rem; color: var(--text-secondary); width: 28px; }
    .vd-name { flex: 1; color: var(--text-primary); font-weight: 600; }
    .vd-crew-empty { flex: 1; color: var(--text-secondary); font-style: italic; }
    .vd-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .vd-action { padding: 5px 11px; background: none; border: 1px solid var(--bg-lighter); color: var(--text-primary); font-family: 'Black Ops One', cursive; font-size: 0.62rem; letter-spacing: 1px; border-radius: 3px; cursor: pointer; }
    .vd-action:hover { color: var(--accent-green); border-color: var(--accent-green); }
    .vd-action.repair { background: rgba(74,222,128,0.1); border-color: var(--accent-green); color: var(--accent-green); }
    .vd-action.hero { border-color: var(--accent-yellow); color: var(--accent-yellow); }

    /* Mobile landscape */
    @media (max-width: 900px) and (orientation: landscape) {
      .sq-split { gap: 6px; }
      .sq-roster-pane { flex-basis: 60%; }
      .sq-row { min-height: 32px; padding: 4px 5px; font-size: 0.7rem; }
      .sq-th.col-rng, .sq-col-rng { width: 42px; }
      .sq-th.col-hp, .sq-col-hp { width: 96px; }
      .sq-chip { padding: 3px 7px; min-height: 24px; font-size: 0.6rem; }
      .sq-popover { width: 200px; }
    }

    /* ═══ Armory tab ═══ */
    .armory-tab { display: flex; flex-direction: column; height: 100%; min-height: 0; padding: 0; }
    .ar-col-type { width: 50px; flex-shrink: 0; }
    .ar-col-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ar-col-quality { width: 115px; flex-shrink: 0; overflow: hidden; }
    .ar-col-stats { flex: 0 0 200px; font-family: 'Share Tech Mono', monospace; font-size: 0.66rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ar-col-condition { width: 130px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
    .ar-col-assigned { width: 150px; flex-shrink: 0; }
    .ar-name { font-weight: 600; color: var(--text-primary); font-size: 0.78rem; }

    /* Category badges (weapon types + slot types) */
    .cat-badge { font-family: 'Black Ops One', cursive; font-size: 0.55rem; letter-spacing: 0.5px; padding: 2px 5px; border-radius: 3px; white-space: nowrap; }
    .cat-badge.ar     { color: var(--accent-orange); border: 1px solid var(--accent-orange); background: rgba(251,146,60,0.08); }
    .cat-badge.smg    { color: var(--accent-orange); border: 1px solid rgba(251,146,60,0.6); background: rgba(251,146,60,0.05); }
    .cat-badge.lmg    { color: var(--accent-red); border: 1px solid var(--accent-red); background: rgba(248,113,113,0.08); }
    .cat-badge.sr     { color: #a78bfa; border: 1px solid #a78bfa; background: rgba(167,139,250,0.08); }
    .cat-badge.sg     { color: var(--accent-yellow); border: 1px solid var(--accent-yellow); background: rgba(251,191,36,0.08); }
    .cat-badge.ps     { color: var(--text-secondary); border: 1px solid var(--text-secondary); }
    .cat-badge.optic  { color: var(--accent-blue); border: 1px solid var(--accent-blue); background: rgba(96,165,250,0.08); }
    .cat-badge.attach { color: #a78bfa; border: 1px solid #a78bfa; background: rgba(167,139,250,0.08); }
    .cat-badge.armor  { color: var(--accent-green); border: 1px solid var(--accent-green); background: rgba(74,222,128,0.08); }
    .cat-badge.utility { color: var(--text-secondary); border: 1px solid var(--bg-lighter); }

    /* Quality badges */
    .quality-badge { font-family: 'Black Ops One', cursive; font-size: 0.55rem; letter-spacing: 0.5px; padding: 2px 5px; border-radius: 3px; white-space: nowrap; }
    .quality-badge.standard { color: #94a3b8; border: 1px solid #94a3b8; }
    .quality-badge.common   { color: #e2e8f0; border: 1px solid #e2e8f0; }
    .quality-badge.improved { color: var(--accent-green); border: 1px solid var(--accent-green); background: rgba(74,222,128,0.08); }
    .quality-badge.rare     { color: var(--accent-blue); border: 1px solid var(--accent-blue); background: rgba(96,165,250,0.08); }

    /* Condition bar */
    .cond-bar { flex: 1; height: 6px; background: var(--bg-dark); border-radius: 3px; overflow: hidden; }
    .cond-fill { height: 100%; }
    .cond-num { font-family: 'Share Tech Mono', monospace; font-size: 0.62rem; color: var(--text-secondary); min-width: 32px; text-align: right; }

    /* Assigned chip */
    .assigned-chip { display: inline-flex; align-items: center; padding: 2px 7px; min-height: 22px; background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.4); color: var(--accent-green); font-size: 0.66rem; font-weight: 700; border-radius: 3px; font-family: 'Oxanium', sans-serif; }
    .assigned-chip.unassigned { background: var(--bg-light); border-color: var(--bg-lighter); color: var(--text-secondary); }

    /* ═══ Soldier dossier — EQUIPMENT tab ═══ */
    .equip-summary { background: var(--bg-dark); border-radius: 4px; padding: 8px 10px; margin-bottom: 10px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .equip-stat { text-align: center; }
    .equip-stat-val { font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; color: var(--text-primary); font-weight: 700; }
    .equip-stat-label { font-size: 0.55rem; color: var(--text-secondary); letter-spacing: 0.3px; }

    .equip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .equip-slot {
      background: var(--bg-dark);
      border: 1px solid var(--bg-lighter);
      border-radius: 5px;
      padding: 8px 10px;
      cursor: pointer;
      position: relative;
      transition: border-color 0.12s;
    }
    .equip-slot:hover { border-color: var(--accent-green); }
    .equip-slot.empty { border-style: dashed; }
    .equip-slot.incompatible { border-color: var(--accent-red); background: rgba(248,113,113,0.06); }
    .equip-slot.incompatible:hover { border-color: var(--accent-red); }
    .equip-incompat-tag { font-family: 'Black Ops One', cursive; font-size: 0.48rem; color: var(--accent-red); padding: 1px 4px; border: 1px solid var(--accent-red); border-radius: 2px; margin-left: 4px; letter-spacing: 0.5px; }

    .equip-kit-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bg-light); }
    .equip-kit-btn {
      width: 100%; padding: 8px;
      background: var(--bg-dark);
      border: 1px dashed var(--bg-lighter);
      color: var(--text-secondary);
      font-family: 'Black Ops One', cursive;
      font-size: 0.65rem;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
    }
    .equip-kit-btn:hover:not(:disabled) { color: var(--accent-green); border-color: var(--accent-green); }
    .equip-kit-btn.dirty { color: var(--accent-yellow); border-color: var(--accent-yellow); background: rgba(251,191,36,0.05); border-style: solid; }
    .equip-kit-btn:disabled { cursor: default; opacity: 0.6; }

    .picker-kit-tag { font-family: 'Oxanium', sans-serif; font-size: 0.55rem; color: var(--accent-blue); font-style: italic; font-weight: 500; margin-left: 4px; }

    /* MOS switch prompt modal — uses .picker styling but bigger */
    .mos-prompt { width: 380px; padding: 12px 14px; }
    .mos-prompt-msg { font-size: 0.78rem; color: var(--text-secondary); padding: 8px 4px 12px; line-height: 1.4; }
    .mos-prompt-btn {
      width: 100%; padding: 10px;
      font-family: 'Black Ops One', cursive; font-size: 0.66rem; letter-spacing: 1px;
      border-radius: 4px; cursor: pointer; margin-bottom: 6px;
      border: 1px solid var(--bg-lighter);
      background: var(--bg-dark);
      color: var(--text-primary);
    }
    .mos-prompt-btn.save { background: rgba(74,222,128,0.12); border-color: var(--accent-green); color: var(--accent-green); }
    .mos-prompt-btn.discard { color: var(--accent-yellow); border-color: var(--accent-yellow); }
    .mos-prompt-btn.cancel { color: var(--text-secondary); }
    .mos-prompt-btn:hover { filter: brightness(1.15); }
    .equip-slot-label { font-family: 'Black Ops One', cursive; font-size: 0.55rem; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 3px; }
    .equip-slot-name { font-size: 0.78rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .equip-slot-stats { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--text-secondary); margin-top: 2px; }
    .equip-slot-empty-text { color: var(--text-secondary); font-style: italic; font-size: 0.72rem; }
    .equip-slot-chevron { float: right; color: var(--text-secondary); font-size: 0.7rem; }

    /* Equipment picker — centered floater */
    .picker {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 360px; max-height: 80vh;
      background: var(--bg-medium);
      border: 1px solid var(--accent-green);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      padding: 6px;
      z-index: 1100;
      overflow-y: auto;
    }
    .picker-title { font-family: 'Black Ops One', cursive; font-size: 0.66rem; color: var(--text-primary); letter-spacing: 1px; padding: 6px 8px; border-bottom: 1px solid var(--bg-light); margin-bottom: 4px; }
    .picker-option {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      border-radius: 4px; cursor: pointer;
      font-size: 0.74rem;
      background: none; border: none; width: 100%; text-align: left;
      color: var(--text-primary);
    }
    .picker-option:hover:not(.disabled) { background: var(--bg-light); }
    .picker-option.current { background: rgba(74,222,128,0.08); border-left: 2px solid var(--accent-green); padding-left: 8px; }
    .picker-option.disabled { opacity: 0.4; cursor: not-allowed; }
    .picker-option .radio { width: 12px; height: 12px; border: 2px solid var(--bg-lighter); border-radius: 50%; position: relative; flex-shrink: 0; }
    .picker-option.current .radio { border-color: var(--accent-green); }
    .picker-option.current .radio::after { content: ''; position: absolute; inset: 1px; background: var(--accent-green); border-radius: 50%; }

    /* Memorial section */

    /* Memorial card — tier border */

    /* Memorial detail panel */

    /* Memorial tier tag (inline in rows) */

    .memorial-tier-tag.tier-gold { background: rgba(251,191,36,0.2); color: var(--accent-yellow); }

    .g2g-section { margin-top: 8px; padding: 10px; background: rgba(251,146,60,0.05); border: 1px solid rgba(251,146,60,0.2); border-radius: 6px; }
