<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- M1 Abrams Armor Plates - Outline style (optional overlay) -->
  <defs>
    <style>
      .outline { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #1a1a1a; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Side ERA panels - left (optional upgrade) -->
  <g id="left-era">
    <rect class="detail" x="16" y="42" width="4" height="18"/>
    <rect class="detail" x="16" y="64" width="4" height="18"/>
    <rect class="detail" x="16" y="86" width="4" height="14"/>
  </g>

  <!-- Side ERA panels - right (optional upgrade) -->
  <g id="right-era">
    <rect class="detail" x="80" y="42" width="4" height="18"/>
    <rect class="detail" x="80" y="64" width="4" height="18"/>
    <rect class="detail" x="80" y="86" width="4" height="14"/>
  </g>
</svg>
