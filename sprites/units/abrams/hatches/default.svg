<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- M1 Abrams Hatches - Outline style (alternate hatch designs) -->
  <defs>
    <style>
      .outline { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #1a1a1a; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Commander's hatch (positioned on turret) -->
  <g id="commander-hatch" transform="translate(40, 70)">
    <circle class="outline" cx="0" cy="0" r="10"/>
    <circle class="detail" cx="0" cy="0" r="6"/>
    <line class="detail" x1="0" y1="-6" x2="0" y2="6"/>
    <circle class="detail" cx="0" cy="2" r="2"/>
  </g>

  <!-- Loader's hatch -->
  <g id="loader-hatch" transform="translate(38, 52)">
    <ellipse class="detail" cx="0" cy="0" rx="6" ry="5"/>
  </g>
</svg>
