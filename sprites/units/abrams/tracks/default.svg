<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- M1 Abrams Tracks - Outline style -->
  <defs>
    <style>
      .outline { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #1a1a1a; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Left track assembly -->
  <g id="left-track">
    <!-- Outer track frame -->
    <rect class="outline" x="4" y="18" width="14" height="104" rx="2"/>
    <!-- Track segments -->
    <line class="detail" x1="4" y1="30" x2="18" y2="30"/>
    <line class="detail" x1="4" y1="44" x2="18" y2="44"/>
    <line class="detail" x1="4" y1="58" x2="18" y2="58"/>
    <line class="detail" x1="4" y1="72" x2="18" y2="72"/>
    <line class="detail" x1="4" y1="86" x2="18" y2="86"/>
    <line class="detail" x1="4" y1="100" x2="18" y2="100"/>
    <line class="detail" x1="4" y1="114" x2="18" y2="114"/>
  </g>

  <!-- Right track assembly -->
  <g id="right-track">
    <!-- Outer track frame -->
    <rect class="outline" x="82" y="18" width="14" height="104" rx="2"/>
    <!-- Track segments -->
    <line class="detail" x1="82" y1="30" x2="96" y2="30"/>
    <line class="detail" x1="82" y1="44" x2="96" y2="44"/>
    <line class="detail" x1="82" y1="58" x2="96" y2="58"/>
    <line class="detail" x1="82" y1="72" x2="96" y2="72"/>
    <line class="detail" x1="82" y1="86" x2="96" y2="86"/>
    <line class="detail" x1="82" y1="100" x2="96" y2="100"/>
    <line class="detail" x1="82" y1="114" x2="96" y2="114"/>
  </g>
</svg>
