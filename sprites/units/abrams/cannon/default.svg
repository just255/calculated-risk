<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- M1 Abrams 120mm Cannon - Outline style -->
  <defs>
    <style>
      .outline { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #1a1a1a; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Gun barrel - segmented -->
  <!-- Muzzle (top) -->
  <rect class="outline" x="47" y="2" width="6" height="6"/>

  <!-- Upper barrel segment -->
  <rect class="detail" x="48" y="8" width="4" height="10"/>

  <!-- Bore evacuator (bulge) -->
  <rect class="outline" x="46" y="18" width="8" height="6" rx="1"/>

  <!-- Middle barrel segment -->
  <rect class="detail" x="48" y="24" width="4" height="12"/>

  <!-- Lower barrel segment -->
  <rect class="detail" x="47" y="36" width="6" height="14"/>

  <!-- Gun mantlet connection -->
  <rect class="outline" x="45" y="50" width="10" height="8" rx="2"/>

  <!-- Mantlet to turret connector -->
  <path class="detail" d="M 46 58 L 46 62 L 54 62 L 54 58"/>
</svg>
