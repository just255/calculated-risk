<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- M1 Abrams Turret - Outline style -->
  <defs>
    <style>
      .outline { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #1a1a1a; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Main turret body - angular shape -->
  <path class="outline" d="
    M 30 38
    L 50 32
    L 70 38
    L 76 48
    L 76 88
    L 70 92
    L 30 92
    L 24 88
    L 24 48
    Z
  "/>

  <!-- Front armor detail lines -->
  <path class="detail" d="M 32 42 L 50 36 L 68 42"/>
  <path class="detail" d="M 28 50 L 28 46 L 50 38 L 72 46 L 72 50"/>

  <!-- Left hatch (oval) -->
  <ellipse class="detail" cx="38" cy="52" rx="6" ry="5"/>

  <!-- Right hatch detail (rounded rectangle) -->
  <rect class="detail" x="56" y="48" width="10" height="8" rx="2"/>

  <!-- Commander's cupola (large circle with inner details) -->
  <circle class="detail" cx="40" cy="70" r="10"/>
  <circle class="detail" cx="40" cy="70" r="6"/>
  <!-- Cupola detail -->
  <line class="detail" x1="40" y1="64" x2="40" y2="76"/>
  <circle class="detail" cx="40" cy="72" r="2"/>

  <!-- Side detail - left -->
  <rect class="detail" x="26" y="54" width="4" height="30"/>

  <!-- Side detail - right -->
  <rect class="detail" x="70" y="54" width="4" height="30"/>

  <!-- Center rectangle detail -->
  <rect class="detail" x="54" y="66" width="14" height="6" rx="1"/>

  <!-- Bustle rack (rear) -->
  <rect class="detail" x="30" y="84" width="40" height="10" rx="1"/>
  <!-- Bustle vertical dividers -->
  <line class="detail" x1="42" y1="84" x2="42" y2="94"/>
  <line class="detail" x1="50" y1="84" x2="50" y2="94"/>
  <line class="detail" x1="58" y1="84" x2="58" y2="94"/>
</svg>
